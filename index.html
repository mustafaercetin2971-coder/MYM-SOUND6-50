<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYM SOUND</title>

<style>
:root{
  --bg:#08080b;
  --panel:#111116;
  --panel2:#17171e;
  --border:#292933;
  --purple:#8b5cf6;
  --purple2:#6d3fe8;
  --text:#fff;
  --muted:#9999a8;
  --danger:#ef4444;
  --success:#22c55e;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}

button,input,textarea,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  display:flex;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:245px;
  position:fixed;
  left:0;
  top:0;
  bottom:0;
  background:#0c0c10;
  border-right:1px solid var(--border);
  padding:22px 15px;
  z-index:50;
}

.logo{
  font-size:23px;
  font-weight:800;
  margin:5px 10px 30px;
  letter-spacing:-1px;
}

.logo span{
  color:var(--purple);
}

.nav{
  display:flex;
  flex-direction:column;
  gap:6px;
}

.nav button{
  background:transparent;
  color:#bdbdc8;
  border:0;
  text-align:left;
  padding:13px 14px;
  border-radius:11px;
  transition:.2s;
}

.nav button:hover,
.nav button.active{
  background:#1c1729;
  color:#fff;
}

.nav button.active{
  border-left:3px solid var(--purple);
}

/* MAIN */

.main{
  margin-left:245px;
  width:calc(100% - 245px);
  min-width:0;
}

.topbar{
  height:70px;
  position:sticky;
  top:0;
  z-index:40;
  background:rgba(8,8,11,.92);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  gap:15px;
  padding:10px 25px;
}

.search{
  flex:1;
  max-width:600px;
  position:relative;
}

.search input{
  width:100%;
  background:#15151b;
  border:1px solid var(--border);
  color:#fff;
  outline:none;
  padding:12px 15px;
  border-radius:12px;
}

.search input:focus{
  border-color:var(--purple);
}

.top-actions{
  margin-left:auto;
  display:flex;
  gap:8px;
}

.icon-btn{
  width:42px;
  height:42px;
  border:1px solid var(--border);
  background:#141419;
  color:#fff;
  border-radius:11px;
}

.icon-btn:hover{
  border-color:var(--purple);
}

/* CONTENT */

.content{
  max-width:1250px;
  margin:auto;
  padding:28px;
}

.page-title{
  font-size:30px;
  margin-bottom:7px;
}

.page-subtitle{
  color:var(--muted);
  margin-bottom:24px;
}

/* CARDS */

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:17px;
  overflow:hidden;
}

.card-pad{
  padding:18px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
  gap:18px;
}

/* BUTTONS */

.btn{
  border:1px solid var(--border);
  background:#17171e;
  color:#fff;
  border-radius:10px;
  padding:10px 15px;
  transition:.2s;
}

.btn:hover{
  border-color:var(--purple);
}

.btn.primary{
  background:var(--purple);
  border-color:var(--purple);
}

.btn.primary:hover{
  background:var(--purple2);
}

.btn.danger{
  background:#351417;
  color:#ff8b8b;
  border-color:#5b2024;
}

.btn.small{
  padding:7px 11px;
  font-size:13px;
}

/* AVATARS */

.avatar{
  width:48px;
  height:48px;
  min-width:48px;
  border-radius:50%;
  background:linear-gradient(135deg,#6d3fe8,#15151d);
  border:1px solid #39304e;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.avatar.small{
  width:34px;
  height:34px;
  min-width:34px;
  font-size:12px;
}

.avatar.big{
  width:105px;
  height:105px;
  min-width:105px;
  font-size:30px;
}

/* USER */

.user-row{
  display:flex;
  align-items:center;
  gap:12px;
}

.user-info{
  min-width:0;
}

.user-name{
  font-weight:700;
}

.user-handle{
  color:var(--muted);
  font-size:13px;
  margin-top:3px;
}

.online{
  display:inline-flex;
  align-items:center;
  gap:5px;
  color:#67e08a;
  font-size:12px;
}

.online:before{
  content:"";
  width:7px;
  height:7px;
  border-radius:50%;
  background:#22c55e;
}

.offline{
  color:#777;
}

/* HOME POST */

.post{
  margin-bottom:18px;
}

.post-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:16px;
}

.post-body{
  padding:0 16px 16px;
}

.post-text{
  line-height:1.6;
  white-space:pre-wrap;
}

.post-media{
  width:100%;
  max-height:600px;
  object-fit:cover;
  display:block;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}

.post-actions{
  display:flex;
  gap:7px;
  padding:12px 16px;
  border-top:1px solid var(--border);
}

.post-actions button{
  background:transparent;
  color:#aaa;
  border:0;
  padding:7px 9px;
  border-radius:8px;
}

.post-actions button:hover{
  background:#1c1c24;
  color:#fff;
}

.post-actions button.liked{
  color:#c084fc;
}

/* SONG */

.song-card{
  display:flex;
  gap:14px;
  align-items:center;
  padding:13px;
}

.song-cover{
  width:75px;
  height:75px;
  min-width:75px;
  border-radius:10px;
  object-fit:cover;
  background:#1d1d25;
}

.song-main{
  min-width:0;
  flex:1;
}

.song-title{
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.song-description{
  color:var(--muted);
  font-size:13px;
  margin:5px 0;
}

audio{
  width:100%;
  height:34px;
}

.song-buttons{
  display:flex;
  gap:5px;
  margin-top:7px;
}

/* CHANNEL */

.channel-cover{
  height:190px;
  background:linear-gradient(135deg,#20163d,#101017);
  background-size:cover;
  background-position:center;
}

.channel-info{
  padding:0 22px 22px;
  margin-top:-48px;
  position:relative;
}

.channel-header{
  display:flex;
  gap:17px;
  align-items:flex-end;
}

.channel-actions{
  margin-left:auto;
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.channel-stats{
  display:flex;
  gap:25px;
  margin-top:18px;
  color:#bbb;
}

.channel-stats strong{
  color:#fff;
}

.tabs{
  display:flex;
  gap:5px;
  overflow:auto;
  border-bottom:1px solid var(--border);
  margin-top:22px;
}

.tabs button{
  border:0;
  background:transparent;
  color:#aaa;
  padding:12px 15px;
  white-space:nowrap;
}

.tabs button.active{
  color:#fff;
  border-bottom:2px solid var(--purple);
}

/* PEOPLE */

.people-card{
  display:flex;
  align-items:center;
  gap:14px;
  padding:15px;
}

.people-card .grow{
  flex:1;
  min-width:0;
}

.people-buttons{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

/* MESSAGES */

.messages-layout{
  display:grid;
  grid-template-columns:310px 1fr;
  height:650px;
  border:1px solid var(--border);
  border-radius:15px;
  overflow:hidden;
  background:var(--panel);
}

.conversations{
  border-right:1px solid var(--border);
  overflow:auto;
}

.conversation{
  padding:13px;
  display:flex;
  gap:10px;
  align-items:center;
  border-bottom:1px solid #202027;
  cursor:pointer;
}

.conversation:hover,
.conversation.active{
  background:#1b1725;
}

.chat{
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chat-header{
  padding:15px;
  border-bottom:1px solid var(--border);
}

.chat-messages{
  flex:1;
  padding:20px;
  overflow:auto;
  display:flex;
  flex-direction:column;
  gap:9px;
}

.message{
  max-width:72%;
  padding:10px 13px;
  border-radius:13px;
  background:#1b1b23;
  align-self:flex-start;
  line-height:1.45;
}

.message.mine{
  background:#6338bb;
  align-self:flex-end;
}

.message-time{
  color:#aaa;
  font-size:10px;
  margin-top:4px;
}

.chat-input{
  display:flex;
  gap:8px;
  padding:13px;
  border-top:1px solid var(--border);
}

.chat-input input{
  flex:1;
  background:#15151b;
  border:1px solid var(--border);
  color:#fff;
  padding:12px;
  border-radius:10px;
  outline:none;
}

/* PROFILE */

.profile-background{
  height:230px;
  border-radius:18px 18px 0 0;
  background:
    linear-gradient(135deg,#25184a,#0d0d12);
  background-size:cover;
  background-position:center;
}

.profile-header{
  background:var(--panel);
  border:1px solid var(--border);
  border-top:0;
  padding:0 25px 25px;
}

.profile-avatar-wrap{
  margin-top:-55px;
  position:relative;
  width:110px;
}

.profile-avatar-wrap .avatar{
  border:4px solid var(--panel);
}

.profile-main{
  display:flex;
  align-items:flex-end;
  gap:18px;
}

.profile-actions{
  margin-left:auto;
}

.profile-stats{
  display:flex;
  gap:28px;
  margin-top:20px;
}

/* SHOP */

.shop-banner{
  height:180px;
  border-radius:16px 16px 0 0;
  background:linear-gradient(135deg,#211638,#111116);
  background-size:cover;
  background-position:center;
}

.shop-owner{
  padding:18px;
  display:flex;
  align-items:center;
  gap:12px;
}

.shop-item{
  overflow:hidden;
}

.shop-cover{
  height:180px;
  width:100%;
  object-fit:cover;
  background:#18181e;
}

.shop-body{
  padding:15px;
}

.shop-type{
  color:#b78cff;
  font-size:12px;
  text-transform:uppercase;
  margin-bottom:6px;
}

.shop-title{
  font-weight:700;
  font-size:18px;
}

.shop-description{
  color:#aaa;
  font-size:13px;
  margin:7px 0 12px;
}

/* MODAL */

.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.78);
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.modal-bg.open{
  display:flex;
}

.modal{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#111116;
  border:1px solid var(--border);
  border-radius:18px;
}

.modal-head{
  padding:17px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.modal-body{
  padding:18px;
}

.close{
  background:#191920;
  color:#fff;
  border:0;
  width:35px;
  height:35px;
  border-radius:9px;
}

/* FORMS */

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  color:#ccc;
  font-size:13px;
  margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  background:#17171e;
  border:1px solid var(--border);
  border-radius:10px;
  color:#fff;
  padding:11px;
  outline:none;
}

.form-group textarea{
  min-height:100px;
  resize:vertical;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
  border-color:var(--purple);
}

.form-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
}

/* EMPTY */

.empty{
  padding:45px 20px;
  text-align:center;
  color:#777;
  border:1px dashed #292932;
  border-radius:14px;
}

/* TOAST */

.toast-area{
  position:fixed;
  right:20px;
  bottom:90px;
  z-index:200;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.toast{
  background:#191920;
  border:1px solid #33333e;
  border-left:3px solid var(--purple);
  padding:12px 15px;
  border-radius:10px;
  box-shadow:0 10px 30px #000;
}

/* MOBILE */

.mobile-nav{
  display:none;
}

@media(max-width:850px){

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
    width:100%;
    padding-bottom:75px;
  }

  .topbar{
    padding:9px 12px;
  }

  .content{
    padding:18px 12px;
  }

  .top-actions{
    display:none;
  }

  .mobile-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:65px;
    background:#101015;
    border-top:1px solid var(--border);
    display:flex;
    overflow-x:auto;
    z-index:80;
  }

  .mobile-nav button{
    flex:0 0 95px;
    background:transparent;
    border:0;
    color:#999;
  }

  .mobile-nav button.active{
    color:#fff;
    background:#1c1729;
  }

  .messages-layout{
    grid-template-columns:1fr;
    height:650px;
  }

  .conversations{
    display:none;
  }

  .channel-header,
  .profile-main{
    align-items:flex-start;
    flex-direction:column;
  }

  .channel-actions,
  .profile-actions{
    margin-left:0;
  }

  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">

    <div class="logo">
      MYM <span>SOUND</span>
    </div>

    <nav class="nav">

      <button data-page="home">Ana Sayfa</button>
      <button data-page="reels">Reels</button>
      <button data-page="channels">Kanallar</button>
      <button data-page="people">Kişiler</button>
      <button data-page="shop">Shop</button>
      <button data-page="messages">Mesajlaşma</button>
      <button data-page="profile">Profilim</button>
      <button data-page="settings">Ayarlar</button>

    </nav>

  </aside>

  <main class="main">

    <header class="topbar">

      <div class="search">
        <input
          id="globalSearch"
          placeholder="MYM SOUND'da ara..."
          autocomplete="off"
        >
      </div>

      <div class="top-actions">
        <button class="icon-btn" onclick="openNotifications()">N</button>
        <button class="icon-btn" onclick="openSongModal()">+</button>
      </div>

    </header>

    <section id="content" class="content"></section>

  </main>

</div>

<div class="mobile-nav">

  <button data-page="home">Ana Sayfa</button>
  <button data-page="reels">Reels</button>
  <button data-page="channels">Kanallar</button>
  <button data-page="shop">Shop</button>
  <button data-page="messages">Mesaj</button>
  <button data-page="profile">Profil</button>
  <button data-page="settings">Ayarlar</button>

</div>

<div id="modalBg" class="modal-bg">
  <div id="modal" class="modal"></div>
</div>

<div id="toastArea" class="toast-area"></div>

<audio id="globalAudio"></audio>

<script>

/* =========================================================
   MYM SOUND
   DÜZELTİLMİŞ ANA SİSTEM
========================================================= */

const DB_NAME = "MYM_SOUND_DATABASE";
const DB_VERSION = 1;

let db = null;

const state = {
  page:"home",
  currentChannel:null,
  currentChat:null,
  currentSong:null,
  search:"",
  channelTab:"posts"
};

/* =========================================================
   LOCAL STORAGE
========================================================= */

const KEYS = {
  users:"mym_users",
  posts:"mym_posts",
  songs:"mym_songs",
  reels:"mym_reels",
  shop:"mym_shop",
  messages:"mym_messages",
  notifications:"mym_notifications",
  activity:"mym_activity",
  comments:"mym_comments",
  history:"mym_history",
  current:"mym_current_user"
};

function read(key, fallback=[]){

  try{
    const value = localStorage.getItem(key);

    if(value === null){
      return fallback;
    }

    return JSON.parse(value);

  }catch(e){
    console.error("Storage okuma hatası:",e);
    return fallback;
  }

}

function write(key,value){
  localStorage.setItem(key,JSON.stringify(value));
}

function getUsers(){
  return read(KEYS.users,[]);
}

function getPosts(){
  return read(KEYS.posts,[]);
}

function getSongs(){
  return read(KEYS.songs,[]);
}

function getReels(){
  return read(KEYS.reels,[]);
}

function getShop(){
  return read(KEYS.shop,[]);
}

function getMessages(){
  return read(KEYS.messages,[]);
}

function getNotifications(){
  return read(KEYS.notifications,[]);
}

function getActivity(){
  return read(KEYS.activity,[]);
}

function getComments(){
  return read(KEYS.comments,[]);
}

/* =========================================================
   CURRENT USER
========================================================= */

function getCurrentUser(){

  const id = localStorage.getItem(KEYS.current);

  if(!id){
    return null;
  }

  return getUsers().find(u => u.id === id) || null;
}

function setCurrentUser(id){
  localStorage.setItem(KEYS.current,id);
}

function updateUser(user){

  const users = getUsers();

  const index = users.findIndex(u => u.id === user.id);

  if(index === -1){
    users.push(user);
  }else{
    users[index] = user;
  }

  write(KEYS.users,users);
}

function userById(id){
  return getUsers().find(u => u.id === id);
}

/* =========================================================
   ID
========================================================= */

function uid(prefix="id"){
  return prefix + "_" +
    Date.now().toString(36) +
    "_" +
    Math.random().toString(36).slice(2,8);
}

/* =========================================================
   DATABASE
========================================================= */

function openDB(){

  return new Promise((resolve,reject)=>{

    const request = indexedDB.open(DB_NAME,DB_VERSION);

    request.onupgradeneeded = e => {

      const database = e.target.result;

      if(!database.objectStoreNames.contains("media")){
        database.createObjectStore("media");
      }

    };

    request.onsuccess = e => {

      db = e.target.result;
      resolve(db);

    };

    request.onerror = () => reject(request.error);

  });

}

async function saveMedia(blob){

  await openDB();

  const id = uid("media");

  return new Promise((resolve,reject)=>{

    const transaction = db.transaction("media","readwrite");

    transaction.objectStore("media").put(blob,id);

    transaction.oncomplete = () => resolve(id);

    transaction.onerror = () => reject(transaction.error);

  });

}

async function getMedia(id){

  if(!id){
    return null;
  }

  await openDB();

  return new Promise((resolve,reject)=>{

    const transaction = db.transaction("media","readonly");

    const request =
      transaction.objectStore("media").get(id);

    request.onsuccess = () => resolve(request.result || null);

    request.onerror = () => reject(request.error);

  });

}

async function deleteMedia(id){

  if(!id) return;

  await openDB();

  const transaction =
    db.transaction("media","readwrite");

  transaction.objectStore("media").delete(id);

}

/* =========================================================
   START
========================================================= */

async function start(){

  try{
    await openDB();
  }catch(e){
    console.error(e);
  }

  createFirstUser();

  bindNavigation();

  bindSearch();

  render();

}

/* =========================================================
   FIRST USER
========================================================= */

function createFirstUser(){

  let users = getUsers();

  if(users.length === 0){

    const first = {
      id:uid("user"),
      name:"MYM Kullanıcısı",
      username:"mymuser",
      password:"",
      role:"Sanatçı",
      plan:"free",

      avatarMediaId:null,
      profileBackgroundMediaId:null,
      shopBackgroundMediaId:null,

      bio:"MYM SOUND kullanıcısı",

      followers:[],
      following:[],
      blockedUsers:[],

      nameChanges:[],

      online:true,
      lastSeen:Date.now(),

      settings:{
        notifications:true,
        autoplay:false
      }
    };

    users.push(first);

    write(KEYS.users,users);

    setCurrentUser(first.id);

  }else{

    const current = getCurrentUser();

    if(!current){
      setCurrentUser(users[0].id);
    }

  }

}

/* =========================================================
   BLOCK SYSTEM
========================================================= */

function isBlocked(targetId){

  const me = getCurrentUser();

  if(!me || !targetId){
    return false;
  }

  if(me.id === targetId){
    return false;
  }

  const target = userById(targetId);

  if(!target){
    return true;
  }

  return (
    (me.blockedUsers || []).includes(targetId) ||
    (target.blockedUsers || []).includes(me.id)
  );

}

function toggleBlock(targetId){

  const me = getCurrentUser();
  const target = userById(targetId);

  if(!me || !target || me.id === target.id){
    return;
  }

  me.blockedUsers = me.blockedUsers || [];

  const blocked =
    me.blockedUsers.includes(targetId);

  if(blocked){

    me.blockedUsers =
      me.blockedUsers.filter(id => id !== targetId);

    addActivity("unblock",target.name + " engeli kaldırıldı.");

    toast("Engel kaldırıldı.");

  }else{

    me.blockedUsers.push(targetId);

    /* Takip ilişkisini iki tarafta da temizle */

    me.following =
      (me.following || []).filter(id => id !== targetId);

    target.following =
      (target.following || []).filter(id => id !== me.id);

    me.followers =
      (me.followers || []).filter(id => id !== targetId);

    target.followers =
      (target.followers || []).filter(id => id !== me.id);

    addActivity("block",target.name + " engellendi.");

    toast("Kullanıcı engellendi.");

  }

  updateUser(me);
  updateUser(target);

  render();

}

/* =========================================================
   FOLLOW SYSTEM
========================================================= */

function isFollowing(targetId){

  const me = getCurrentUser();

  if(!me){
    return false;
  }

  return (me.following || []).includes(targetId);

}

function toggleFollow(targetId){

  const me = getCurrentUser();
  const target = userById(targetId);

  if(!me || !target){
    return;
  }

  if(me.id === target.id){
    toast("Kendini takip edemezsin.");
    return;
  }

  if(isBlocked(targetId)){
    toast("Bu kullanıcıyla takip ilişkisi kurulamaz.");
    return;
  }

  me.following = me.following || [];
  target.followers = target.followers || [];

  if(me.following.includes(targetId)){

    me.following =
      me.following.filter(id => id !== targetId);

    target.followers =
      target.followers.filter(id => id !== me.id);

    addActivity(target.name + " takipten çıkarıldı.");

    toast("Takipten çıkıldı.");

  }else{

    me.following.push(targetId);

    if(!target.followers.includes(me.id)){
      target.followers.push(me.id);
    }

    addActivity(target.name + " takip edildi.");

    addNotification(
      target.id,
      me.name + " seni takip etmeye başladı.",
      "follow"
    );

    toast("Takip edildi.");

  }

  updateUser(me);
  updateUser(target);

  render();

}

function addNotification(userId,text,type="system"){

  const notifications = getNotifications();

  notifications.unshift({
    id:uid("notification"),
    userId,
    text,
    type,
    read:false,
    createdAt:Date.now()
  });

  write(KEYS.notifications,notifications);

}

function openNotifications(){

  const me = getCurrentUser();

  if(!me) return;

  const list =
    getNotifications()
      .filter(n => n.userId === me.id)
      .sort((a,b)=>b.createdAt-a.createdAt);

  const unread =
    list.filter(n=>!n.read);

  if(unread.length){

    const all = getNotifications();

    all.forEach(n=>{
      if(n.userId === me.id){
        n.read = true;
      }
    });

    write(KEYS.notifications,all);

  }

  showModal(
    "Bildirimler",
    list.length
      ? list.map(n=>`
        <div class="card card-pad" style="margin-bottom:8px">
          <div>${escapeHTML(n.text)}</div>

      : `<div class="empty">Henüz bildirim yok.</div>`
  );

}

  switch(state.page){

    case "reels":

    case "people":

function addComment(postId){

  const input =
    document.getElementById("commentInput");

  const text =
    input.value.trim();

  const me = getCurrentUser();

  if(!me || !text){
    return;
  }

  const posts = getPosts();
  const post = posts.find(p=>p.id===postId);

  if(!post || isBlocked(post.userId)){
    toast("Bu gönderiye yorum yapamazsın.");
    return;
  }

  const comments = getComments();

  comments.push({
    id:uid("comment"),
    postId,
    userId:me.id,
    text,
    createdAt:Date.now()
  });

  write(KEYS.comments,comments);

  addActivity("comment","Bir gönderiye yorum yaptın.");

  if(post.userId !== me.id){

    addNotification(
      post.userId,
      me.name + " gönderine yorum yaptı.",
      "comment"
    );

  }

  openComments(postId);

}

function deleteComment(commentId){

  const me = getCurrentUser();

  let comments = getComments();

  const comment =
    comments.find(c=>c.id===commentId);

  if(!comment || comment.userId !== me.id){
    return;
  }

  comments =
    comments.filter(c=>c.id!==commentId);

  write(KEYS.comments,comments);

  openComments(comment.postId);

}

async function createPost(){

  const me = getCurrentUser();

  const text =
    document.getElementById("postText")
      .value.trim();

  const fileInput =
    document.getElementById("postFile");

  const file =
    fileInput.files[0];

  if(!text && !file){

    toast("Gönderi boş olamaz.");

    return;
  }

  let mediaId = null;
  let mediaType = null;

  if(file){

    mediaId =
      await saveMedia(file);

    mediaType =
      file.type.startsWith("video")
      ? "video"
      : "image";

  }

  const posts = getPosts();

  posts.unshift({

    id:uid("post"),

    userId:me.id,

    text,

    mediaId,

    mediaType,

    likes:[],

    createdAt:Date.now()

  });

  write(KEYS.posts,posts);

  addActivity("post","Yeni gönderi paylaştın.");

  closeModal();

  toast("Gönderi paylaşıldı.");

  state.page="home";

  render();

}

/* =========================================================
   DELETE POST
========================================================= */

async function deletePost(postId){

  const me = getCurrentUser();

  let posts = getPosts();

  const post =
    posts.find(p=>p.id===postId);

  if(!post || post.userId !== me.id){
    return;
  }

  if(post.mediaId){
    await deleteMedia(post.mediaId);
  }

  posts =
    posts.filter(p=>p.id!==postId);

  write(KEYS.posts,posts);

  render();

  toast("Gönderi silindi.");

}

/* =========================================================
   LOAD MEDIA
========================================================= */

async function loadDynamicMedia(){

  document
    .querySelectorAll("[data-avatar]")
    .forEach(async el=>{

      const id = el.dataset.avatar;
      const user = userById(id);

      if(!user || !user.avatarMediaId){
        return;
      }

      try{

        const blob =
          await getMedia(user.avatarMediaId);

        if(blob){

          const url =
            URL.createObjectURL(blob);

          el.innerHTML =
            `<img src="${url}" alt="">`;

        }

      }catch(e){
        console.error(e);
      }

    });

  document
    .querySelectorAll("[data-cover-id]")
    .forEach(async el=>{

      try{

        const blob =
          await getMedia(el.dataset.coverId);

        if(blob){

          const url =
            URL.createObjectURL(blob);

          el.src=url;

        }

      }catch(e){
        console.error(e);
      }

    });

  document
    .querySelectorAll("[data-audio-id]")
    .forEach(async el=>{

      try{

        const blob =
          await getMedia(el.dataset.audioId);

        if(blob){

          const url =
            URL.createObjectURL(blob);

          el.src=url;

        }

      }catch(e){
        console.error(e);
      }

    });

  document
    .querySelectorAll("[data-media-id]")
    .forEach(async el=>{

      try{

        const blob =
          await getMedia(el.dataset.mediaId);

        if(!blob){
          return;
        }

        const url =
          URL.createObjectURL(blob);

        if(el.dataset.mediaType==="video"){

          el.innerHTML =
            `<video
              class="post-media"
              controls
              src="${url}"
            ></video>`;

        }else{

          el.innerHTML =
            `<img
              class="post-media"
              src="${url}"
              alt=""
            >`;

        }

      }catch(e){
        console.error(e);
      }

    });

}

/* =========================================================
   PLAY SONG
========================================================= */

async function playSong(songId){

  const songs = getSongs();

  const song =
    songs.find(s=>s.id===songId);

  if(!song){
    return;
  }

  const blob =
    await getMedia(song.audioMediaId);

  if(!blob){
    toast("Ses dosyası bulunamadı.");
    return;
  }

  const audio =
    document.getElementById("globalAudio");

  const url =
    URL.createObjectURL(blob);

  audio.src=url;

  await audio.play();

  song.plays =
    (song.plays || 0) + 1;

  write(KEYS.songs,songs);

  addActivity(
    "play",
    song.name + " dinlendi."
  );

}

    songs.find(s=>s.id===songId);

    return;

  songs =
    songs.filter(s=>s.id!==songId);

  write(KEYS.songs,songs);

  toast("Şarkı silindi.");

  render();

}

function conversationUsers(){

  const me = getCurrentUser();

  const messages =
    getMessages();

  const ids = new Set();

  messages.forEach(message=>{

    if(message.fromId===me.id){
      ids.add(message.toId);
    }

    if(message.toId===me.id){
      ids.add(message.fromId);
    }

  });

  return [...ids]
    .map(id=>userById(id))
    .filter(Boolean)
    .filter(u=>u.id!==me.id)
    .filter(u=>!isBlocked(u.id));

}

function renderMessage(message){

  const me =
    getCurrentUser();

  return `

    <div class="message ${message.fromId===me.id ? "mine" : ""}">

      <div>
        ${escapeHTML(message.text)}
      </div>

        ${formatDate(message.createdAt)}

          message.fromId===me.id
          ? `
            <button
              style="
                border:0;
                background:none;
                color:#ddd;
                margin-left:5px;
                cursor:pointer;
              "
              onclick="deleteMessage('${message.id}')"
            >
              Sil
            </button>
          `
          : ""
        }

      </div>

    </div>

  `;

}

function sendMessage(){

  const me =
    getCurrentUser();

  const target =
    userById(state.currentChat);

  const input =
    document.getElementById("messageInput");

  if(!me || !target || !input){
    return;
  }

  if(isBlocked(target.id)){

    toast("Bu kullanıcıya mesaj gönderemezsin.");

    return;
  }

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  const messages =
    getMessages();

  messages.push({

    id:uid("message"),

    fromId:me.id,

    toId:target.id,

    text,

    createdAt:Date.now(),

    read:false

  });

  write(KEYS.messages,messages);

  addActivity(
    "message",
    target.name + " kişisine mesaj gönderdin."
  );

  addNotification(
    target.id,
    me.name + " sana bir mesaj gönderdi.",
    "message"
  );

  input.value="";

  renderMessages();

}

function deleteMessage(messageId){

  const me = getCurrentUser();

  let messages =
    getMessages();

  const message =
    messages.find(m=>m.id===messageId);

  if(!message || message.fromId!==me.id){
    return;
  }

  messages =
    messages.filter(m=>m.id!==messageId);

  write(KEYS.messages,messages);

  renderMessages();

}

function identityChangeAllowed(user){

  const now =
    Date.now();

  const week =
    7 * 24 * 60 * 60 * 1000;

  user.nameChanges =
    (user.nameChanges || [])
      .filter(t=>now-t < week);

  return user.nameChanges.length < 3;

}

async function saveProfileEdit(){

  const me =
    getCurrentUser();

  const newName =
    document.getElementById("editName")
      .value.trim();

  const newUsername =
    document.getElementById("editUsername")
      .value.trim();

  const role =
    document.getElementById("editRole")
      .value;

  const bio =
    document.getElementById("editBio")
      .value.trim();

  const avatar =
    document.getElementById("editAvatar")
      .files[0];

  if(!newName || !newUsername){

    toast("Ad ve kullanıcı adı boş bırakılamaz.");

    return;
  }

  const changed =
    newName !== me.name ||
    newUsername !== me.username;

  if(changed){

    if(!identityChangeAllowed(me)){

      toast("7 gün içinde 3 isim/kullanıcı adı değişikliği hakkın doldu.");

      return;
    }

    const duplicate =
      getUsers().some(
        u =>
          u.id !== me.id &&
          u.username.toLowerCase() === newUsername.toLowerCase()
      );

    if(duplicate){

      toast("Bu kullanıcı adı zaten kullanılıyor.");

      return;
    }

    me.nameChanges =
      me.nameChanges || [];

    me.nameChanges.push(Date.now());

  }

  if(avatar){

    if(me.avatarMediaId){
      await deleteMedia(me.avatarMediaId);
    }

    me.avatarMediaId =
      await saveMedia(avatar);

  }

  me.name=newName;
  me.username=newUsername;
  me.role=role;
  me.bio=bio;

  updateUser(me);

  addActivity("profile","Profilini güncelledin.");

  closeModal();

  toast("Profil güncellendi.");

  render();

}

async function createShopItem(){

  const me =
    getCurrentUser();

  const type =
    document.getElementById("shopType").value;

  const name =
    document.getElementById("shopName")
      .value.trim();

  const description =
    document.getElementById("shopDescription")
      .value.trim();

  const cover =
    document.getElementById("shopCover")
      .files[0];

  const audio =
    document.getElementById("shopAudio")
      .files[0];

  if(!name){

    toast("İsim zorunlu.");

    return;
  }

  if(!audio){

    toast("Ses dosyası zorunlu.");

    return;
  }

  if(
    me.plan!=="pro" &&
    freeShopCount()>=50
  ){

    toast("Free Shop limitine ulaştın.");

    return;
  }

  let coverId=null;

  if(cover){

    coverId =
      await saveMedia(cover);

  }

  const audioId =
    await saveMedia(audio);

  const shop =
    getShop();

  shop.unshift({

    id:uid("shop"),

    userId:me.id,

    type,

    name,

    description,

    coverMediaId:coverId,

    audioMediaId:audioId,

    createdAt:Date.now()

  });

  write(KEYS.shop,shop);

  addActivity(
    "shop",
    name + " Shop'a eklendi."
  );

  closeModal();

  toast("Shop içeriği eklendi.");

  render();

}

async function deleteShopItem(itemId){

  const me =
    getCurrentUser();

  let shop =
    getShop();

  const item =
    shop.find(i=>i.id===itemId);

  if(!item || item.userId!==me.id){
    return;
  }

  if(item.coverMediaId){
    await deleteMedia(item.coverMediaId);
  }

  if(item.audioMediaId){
    await deleteMedia(item.audioMediaId);
  }

  shop =
    shop.filter(i=>i.id!==itemId);

  write(KEYS.shop,shop);

  toast("Shop içeriği kaldırıldı.");

  render();

}

async function createReel(){

    getCurrentUser();

  const file =
    document.getElementById("reelFile")
      .files[0];

    document.getElementById("reelDescription")
      .value.trim();

  if(!file){

    toast("Video seç.");

    return;
  }

  const mediaId =
    await saveMedia(file);

  const reels =
    getReels();

  reels.unshift({

    id:uid("reel"),

    userId:me.id,

    mediaId,

    description,

    likes:[],

    createdAt:Date.now()

  });

  write(KEYS.reels,reels);

  closeModal();

  addActivity("reel","Yeni reel paylaştın.");

  toast("Reel paylaşıldı.");

function toggleReelLike(reelId){

  const me =
    getCurrentUser();

  const reels =
    getReels();

  const reel =
    reels.find(r=>r.id===reelId);

  if(!reel) return;

  reel.likes =
    reel.likes || [];

  const index =
    reel.likes.indexOf(me.id);

  if(index===-1){
    reel.likes.push(me.id);
  }else{
    reel.likes.splice(index,1);
  }

  write(KEYS.reels,reels);

  render();

}

async function deleteReel(reelId){

  const me =
    getCurrentUser();

  let reels =
    getReels();

  const reel =
    reels.find(r=>r.id===reelId);

  if(!reel || reel.userId!==me.id){
    return;
  }

  await deleteMedia(reel.mediaId);

  reels =
    reels.filter(r=>r.id!==reelId);

  write(KEYS.reels,reels);

  render();

}

      .value.trim();

  const role =
    document.getElementById("newRole")
      .value;

  if(!name || !username){

    toast("Ad ve kullanıcı adı gerekli.");

    return;
  }

  const users =
    getUsers();

  if(
    users.some(
      u=>u.username.toLowerCase() === username.toLowerCase()
    )
  ){

    toast("Bu kullanıcı adı alınmış.");

    return;
  }

  const user = {

    id:uid("user"),

    name,

    username,

    password:"",

    role,

    plan:"free",

    avatarMediaId:null,

    profileBackgroundMediaId:null,

    shopBackgroundMediaId:null,

    bio:"",

    followers:[],

    following:[],

    blockedUsers:[],

    nameChanges:[],

    online:true,

    lastSeen:Date.now(),

    settings:{
      notifications:true,
      autoplay:false
    }

  };

  users.push(user);

  write(KEYS.users,users);

  setCurrentUser(user.id);

  closeModal();

  state.page="home";

  render();

  toast("Hesap oluşturuldu.");

}

/* =========================================================
   MODAL
========================================================= */

function showModal(title,body){

  const bg =
    document.getElementById("modalBg");

  const modal =
    document.getElementById("modal");

  modal.innerHTML = `

    <div class="modal-head">

      <h2>
        ${escapeHTML(title)}
      </h2>

      <button
        class="close"
        onclick="closeModal()"
      >
        X
      </button>

    </div>

    <div class="modal-body">
      ${body}
    </div>
  `;

  bg.classList.add("open");

}

function closeModal(){

  document
    .getElementById("modalBg")
    .classList.remove("open");

}

document
  .getElementById("modalBg")
  .addEventListener("click",e=>{

    if(e.target.id==="modalBg"){
      closeModal();
    }

  });

/* =========================================================
   TOAST
========================================================= */

function toast(text){

  const area =
    document.getElementById("toastArea");

  const el =
    document.createElement("div");

  el.className="toast";

  el.textContent=text;

  area.appendChild(el);

  setTimeout(()=>{
    el.remove();
  },3000);

}

/* =========================================================
   HELPERS
========================================================= */

function initials(name){

  if(!name){
    return "?";
  }

  return name
    .split(" ")
    .slice(0,2)
    .map(x=>x[0])
    .join("")
    .toUpperCase();

}

function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

function escapeAttr(value){

  return escapeHTML(value)
    .replaceAll("\n"," ");

}

function formatDate(time){

  const date =
    new Date(time);

  return date.toLocaleString(
    "tr-TR",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}

/* =========================================================
   AUDIO EVENTS
========================================================= */

document.addEventListener("play",e=>{

  if(e.target.tagName !== "AUDIO"){
    return;
  }

  document
    .querySelectorAll("audio")
    .forEach(audio=>{

      if(audio !== e.target){
        audio.pause();
      }

    });

},true);

/* =========================================================
   INITIALIZE
========================================================= */

start();

</script>
