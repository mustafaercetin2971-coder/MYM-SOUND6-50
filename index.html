<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MYM SOUND</title>

<style>
/* =========================================================
   MYM SOUND
   ANA TASARIM SİSTEMİ
   ========================================================= */

:root{
    --p:#7c3aed;
    --p2:#a855f7;
    --a:#c084fc;
    --bg:#08080d;
    --bg2:#0d0d15;
    --panel:#12121c;
    --panel2:#181824;
    --border:#29293a;
    --text:#ffffff;
    --muted:#9898aa;
    --danger:#ef4444;
    --success:#22c55e;
    --warning:#f59e0b;
    --shadow:0 15px 45px rgba(0,0,0,.35);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 20% 0%,rgba(124,58,237,.12),transparent 35%),
        radial-gradient(circle at 80% 20%,rgba(168,85,247,.08),transparent 30%),
        var(--bg);
    color:var(--text);
    font-family:Inter,Arial,Helvetica,sans-serif;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
    text-decoration:none;
}

img{
    max-width:100%;
}

/* =========================================================
   SCROLLBAR
   ========================================================= */

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-track{
    background:var(--bg);
}

::-webkit-scrollbar-thumb{
    background:var(--border);
    border-radius:20px;
}

::-webkit-scrollbar-thumb:hover{
    background:var(--p);
}

/* =========================================================
   GENEL
   ========================================================= */

.hidden{
    display:none!important;
}

.app{
    min-height:100vh;
}

.container{
    width:min(1250px,calc(100% - 30px));
    margin:auto;
}

.card{
    background:linear-gradient(
        145deg,
        rgba(255,255,255,.035),
        rgba(255,255,255,.015)
    );
    border:1px solid var(--border);
    border-radius:20px;
    box-shadow:var(--shadow);
}

.muted{
    color:var(--muted);
}

.small{
    font-size:12px;
}

.center{
    text-align:center;
}

.flex{
    display:flex;
}

.column{
    flex-direction:column;
}

.gap5{
    gap:5px;
}

.gap10{
    gap:10px;
}

.gap15{
    gap:15px;
}

.gap20{
    gap:20px;
}

/* =========================================================
   BUTTONLAR
   ========================================================= */

.btn{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    border-radius:12px;
    padding:10px 15px;
    transition:.2s;
    font-weight:600;
}

.btn:hover{
    transform:translateY(-1px);
    border-color:var(--p);
}

.btn.primary{
    background:linear-gradient(
        135deg,
        var(--p),
        var(--p2)
    );
    border-color:transparent;
}

.btn.danger{
    background:#35151a;
    border-color:#6b2028;
    color:#ff8e98;
}

.btn.success{
    background:#102a1a;
    border-color:#205f37;
    color:#70e59b;
}

.btn.warning{
    background:#33250c;
    border-color:#745719;
    color:#ffd56a;
}

.btn.full{
    width:100%;
}

/* =========================================================
   HEADER
   ========================================================= */

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    height:68px;
    background:rgba(8,8,13,.84);
    backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
}

.topbar-inner{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:21px;
    font-weight:900;
    letter-spacing:.5px;
}

.logo-mark{
    width:38px;
    height:38px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:linear-gradient(
        135deg,
        var(--p),
        var(--p2)
    );
}

.header-search{
    flex:1;
    max-width:480px;
    position:relative;
}

.header-search input{
    width:100%;
    background:var(--panel);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:14px;
    padding:12px 15px;
    outline:none;
}

.header-search input:focus{
    border-color:var(--p);
}

.header-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;
    border-radius:12px;
    border:1px solid var(--border);
    background:var(--panel);
    color:var(--text);
}

/* =========================================================
   ANA LAYOUT
   ========================================================= */

.main-layout{
    display:grid;
    grid-template-columns:230px minmax(0,1fr);
    gap:20px;
    padding-top:20px;
}

.sidebar{
    position:sticky;
    top:88px;
    height:max-content;
}

.sidebar-menu{
    padding:10px;
}

.nav-item{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    border:0;
    background:transparent;
    color:var(--muted);
    padding:13px 14px;
    border-radius:13px;
    text-align:left;
    margin-bottom:3px;
}

.nav-item:hover,
.nav-item.active{
    background:rgba(124,58,237,.13);
    color:#fff;
}

.content{
    min-width:0;
}

/* =========================================================
   AUTH
   ========================================================= */

.auth-page{
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:20px;
}

.auth-box{
    width:min(450px,100%);
    padding:30px;
}

.auth-logo{
    text-align:center;
    margin-bottom:25px;
}

.auth-logo .logo-mark{
    margin:0 auto 12px;
    width:60px;
    height:60px;
    font-size:25px;
}

.auth-logo h1{
    font-size:30px;
}

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;
    font-size:13px;
    color:var(--muted);
    margin-bottom:7px;
}

.input{
    width:100%;
    border:1px solid var(--border);
    background:#0b0b12;
    color:#fff;
    border-radius:12px;
    padding:12px 13px;
    outline:none;
}

.input:focus{
    border-color:var(--p);
}

textarea.input{
    min-height:110px;
    resize:vertical;
}

.auth-switch{
    margin-top:18px;
    text-align:center;
    color:var(--muted);
}

.auth-switch button{
    background:none;
    border:0;
    color:var(--a);
}

/* =========================================================
   PAGE HEADER
   ========================================================= */

.page-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:18px;
}

.page-header h1{
    font-size:26px;
}

.page-header p{
    color:var(--muted);
    margin-top:4px;
}

/* =========================================================
   POST
   ========================================================= */

.post-create{
    padding:16px;
    margin-bottom:18px;
}

.post-create-row{
    display:flex;
    gap:12px;
    align-items:center;
}

.avatar{
    width:44px;
    height:44px;
    flex:none;
    border-radius:50%;
    overflow:hidden;
    background:linear-gradient(
        135deg,
        var(--p),
        var(--p2)
    );
    display:grid;
    place-items:center;
    font-weight:800;
}

.avatar.small-avatar{
    width:34px;
    height:34px;
    font-size:12px;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.fake-input{
    flex:1;
    padding:12px 15px;
    border:1px solid var(--border);
    background:var(--panel);
    border-radius:14px;
    color:var(--muted);
    cursor:pointer;
}

.post-card{
    padding:18px;
    margin-bottom:15px;
}

.post-head{
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.user-line{
    display:flex;
    align-items:center;
    gap:10px;
}

.user-info strong{
    display:block;
}

.user-info span{
    color:var(--muted);
    font-size:12px;
}

.post-content{
    margin:16px 0;
    line-height:1.6;
    white-space:pre-wrap;
    word-break:break-word;
}

.post-media{
    width:100%;
    max-height:650px;
    object-fit:contain;
    background:#050507;
    border-radius:15px;
    border:1px solid var(--border);
}

.post-actions{
    display:flex;
    align-items:center;
    gap:8px;
    border-top:1px solid var(--border);
    margin-top:15px;
    padding-top:12px;
}

.action-btn{
    background:transparent;
    border:0;
    color:var(--muted);
    padding:8px 10px;
    border-radius:10px;
}

.action-btn:hover{
    background:var(--panel2);
    color:#fff;
}

/* =========================================================
   BADGE
   ========================================================= */

.pro-badge{
    display:inline-flex;
    align-items:center;
    border-radius:7px;
    padding:3px 7px;
    font-size:10px;
    font-weight:900;
    margin-left:5px;
}

.pro-monthly{
    background:#7c3aed;
    color:#fff;
}

.pro-yearly{
    background:#2563eb;
    color:#fff;
}

.admin-badge{
    background:#dc2626;
    color:white;
}

/* =========================================================
   REELS
   ========================================================= */

.reels-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.reel-card{
    position:relative;
    min-height:440px;
    overflow:hidden;
    border-radius:18px;
    border:1px solid var(--border);
    background:#050507;
}

.reel-card video,
.reel-card img{
    width:100%;
    height:100%;
    min-height:440px;
    object-fit:cover;
}

.reel-info{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:18px;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.85)
    );
}

/* =========================================================
   SONG
   ========================================================= */

.song-card{
    padding:15px;
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:12px;
}

.song-cover{
    width:62px;
    height:62px;
    flex:none;
    border-radius:13px;
    background:linear-gradient(
        135deg,
        var(--p),
        var(--p2)
    );
    overflow:hidden;
}

.song-cover img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.song-main{
    flex:1;
    min-width:0;
}

.song-main strong{
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song-main audio{
    width:100%;
    margin-top:8px;
}

/* =========================================================
   CHANNEL
   ========================================================= */

.channel-cover{
    height:230px;
    border-radius:20px 20px 0 0;
    background:
        linear-gradient(
            135deg,
            rgba(124,58,237,.8),
            rgba(168,85,247,.3)
        );
    background-size:cover;
    background-position:center;
}

.channel-header{
    padding:20px;
}

.channel-profile-row{
    display:flex;
    align-items:flex-end;
    gap:15px;
    margin-top:-50px;
}

.channel-large-avatar{
    width:100px;
    height:100px;
    border:5px solid var(--bg);
    border-radius:50%;
    overflow:hidden;
    background:var(--p);
    display:grid;
    place-items:center;
    font-size:30px;
    font-weight:900;
}

.channel-large-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.channel-stats{
    display:flex;
    gap:25px;
    margin-top:15px;
}

.channel-tabs{
    display:flex;
    overflow:auto;
    border-top:1px solid var(--border);
    margin-top:18px;
}

.channel-tab{
    border:0;
    background:transparent;
    color:var(--muted);
    padding:13px 17px;
    white-space:nowrap;
}

.channel-tab.active{
    color:#fff;
    border-bottom:2px solid var(--p);
}

/* =========================================================
   SHOP
   ========================================================= */

.shop-hero{
    min-height:250px;
    border-radius:20px;
    padding:30px;
    display:flex;
    align-items:flex-end;
    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.85),
            rgba(0,0,0,.15)
        ),
        linear-gradient(
            135deg,
            var(--p),
            #111
        );
    background-size:cover;
    background-position:center;
    margin-bottom:18px;
}

.shop-items{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.shop-card{
    padding:15px;
}

.shop-image{
    height:180px;
    border-radius:14px;
    overflow:hidden;
    background:#08080c;
    margin-bottom:12px;
}

.shop-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.price{
    color:var(--a);
    font-size:19px;
    font-weight:900;
    margin-top:8px;
}

.role-tag{
    display:inline-block;
    font-size:10px;
    padding:4px 7px;
    border-radius:6px;
    background:var(--panel2);
    color:var(--muted);
}

/* =========================================================
   PRO
   ========================================================= */

.pro-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:18px;
}

.pro-card{
    padding:25px;
    position:relative;
    overflow:hidden;
}

.pro-card.monthly{
    border-color:#7c3aed;
}

.pro-card.yearly{
    border-color:#2563eb;
}

.pro-price{
    font-size:38px;
    font-weight:900;
    margin:18px 0 5px;
}

.pro-list{
    list-style:none;
    margin:20px 0;
}

.pro-list li{
    padding:9px 0;
    color:#ddd;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.pro-current{
    margin-top:18px;
    padding:14px;
    border-radius:13px;
    background:var(--panel2);
}

/* =========================================================
   SETTINGS
   ========================================================= */

.settings-grid{
    display:grid;
    grid-template-columns:200px minmax(0,1fr);
    gap:18px;
}

.settings-menu{
    padding:10px;
}

.settings-content{
    padding:20px;
}

.theme-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
}

.theme-option{
    border:2px solid var(--border);
    border-radius:14px;
    padding:12px;
    cursor:pointer;
}

.theme-option.selected{
    border-color:var(--p);
}

.theme-preview{
    height:55px;
    border-radius:10px;
    margin-bottom:8px;
}

/* =========================================================
   MESAJ
   ========================================================= */

.messages-layout{
    display:grid;
    grid-template-columns:280px 1fr;
    min-height:650px;
    overflow:hidden;
}

.message-users{
    border-right:1px solid var(--border);
    padding:10px;
}

.message-user{
    display:flex;
    gap:10px;
    align-items:center;
    padding:10px;
    border-radius:12px;
    cursor:pointer;
}

.message-user:hover,
.message-user.active{
    background:var(--panel2);
}

.chat{
    display:flex;
    flex-direction:column;
}

.chat-head{
    padding:15px;
    border-bottom:1px solid var(--border);
}

.chat-messages{
    flex:1;
    padding:18px;
    overflow:auto;
    min-height:450px;
}

.message{
    max-width:70%;
    padding:10px 13px;
    border-radius:14px;
    margin-bottom:8px;
    background:var(--panel2);
}

.message.mine{
    margin-left:auto;
    background:var(--p);
}

.chat-send{
    display:flex;
    gap:8px;
    padding:12px;
    border-top:1px solid var(--border);
}

/* =========================================================
   ADMIN
   ========================================================= */

.admin-stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:18px;
}

.stat-card{
    padding:18px;
}

.stat-number{
    font-size:27px;
    font-weight:900;
    margin-top:7px;
}

.admin-table{
    width:100%;
    border-collapse:collapse;
}

.admin-table th,
.admin-table td{
    padding:11px;
    border-bottom:1px solid var(--border);
    text-align:left;
    vertical-align:middle;
}

.admin-table th{
    color:var(--muted);
    font-size:12px;
}

/* =========================================================
   MODAL
   ========================================================= */

.modal-layer{
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(8px);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal-layer.open{
    display:flex;
}

.modal{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    padding:22px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.modal-close{
    width:35px;
    height:35px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--panel2);
    color:#fff;
}

/* =========================================================
   TOAST
   ========================================================= */

.toast-area{
    position:fixed;
    right:18px;
    bottom:18px;
    z-index:2000;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.toast{
    max-width:350px;
    padding:13px 16px;
    border-radius:13px;
    background:#181820;
    border:1px solid var(--border);
    box-shadow:var(--shadow);
}

/* =========================================================
   SEARCH
   ========================================================= */

.search-results{
    display:grid;
    gap:10px;
}

.search-result{
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
}

/* =========================================================
   NOTIFICATIONS
   ========================================================= */

.notification{
    padding:15px;
    border-bottom:1px solid var(--border);
}

.notification.unread{
    background:rgba(124,58,237,.08);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media(max-width:900px){

    .main-layout{
        grid-template-columns:1fr;
    }

    .sidebar{
        position:fixed;
        bottom:0;
        left:0;
        right:0;
        top:auto;
        z-index:90;
        border-top:1px solid var(--border);
        background:rgba(8,8,13,.95);
        backdrop-filter:blur(15px);
    }

    .sidebar-menu{
        display:flex;
        overflow:auto;
        padding:7px;
    }

    .nav-item{
        flex-direction:column;
        justify-content:center;
        min-width:70px;
        font-size:10px;
        padding:7px;
        margin:0;
    }

    .content{
        padding-bottom:75px;
    }

    .reels-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .shop-items{
        grid-template-columns:repeat(2,1fr);
    }

    .admin-stats{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:650px){

    .container{
        width:min(100% - 16px,1250px);
    }

    .header-search{
        display:none;
    }

    .topbar{
        height:60px;
    }

    .page-header h1{
        font-size:22px;
    }

    .reels-grid,
    .shop-items,
    .pro-grid{
        grid-template-columns:1fr;
    }

    .settings-grid,
    .messages-layout{
        grid-template-columns:1fr;
    }

    .message-users{
        border-right:0;
        border-bottom:1px solid var(--border);
        max-height:180px;
        overflow:auto;
    }

    .theme-grid{
        grid-template-columns:repeat(2,1fr);
    }

    .channel-profile-row{
        align-items:center;
        flex-direction:column;
        text-align:center;
    }

    .channel-stats{
        justify-content:center;
    }

    .admin-table{
        min-width:850px;
    }

    .admin-table-wrap{
        overflow:auto;
    }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="modalLayer" class="modal-layer">
    <div id="modalBox" class="modal card"></div>
</div>

<div id="toastArea" class="toast-area"></div>

<script>
/* =========================================================
   MYM SOUND
   VERİTABANI / STORAGE
   ========================================================= */

const DB = {

    users: "mym_sound_users_v20",
    posts: "mym_sound_posts_v20",
    reels: "mym_sound_reels_v20",
    songs: "mym_sound_songs_v20",
    shop: "mym_sound_shop_v20",
    messages: "mym_sound_messages_v20",
    notifications: "mym_sound_notifications_v20",
    activities: "mym_sound_activities_v20",
    current: "mym_sound_current_v20",
    settings: "mym_sound_settings_v20",
    adminLogs: "mym_sound_admin_logs_v20"

};

function read(key, fallback){

    try{

        const value = localStorage.getItem(key);

        if(value === null){
            return fallback;
        }

        return JSON.parse(value);

    }catch(error){

        console.error(error);
        return fallback;

    }

}

function write(key,value){

    localStorage.setItem(
        key,
        JSON.stringify(value)
    );

}

function uid(prefix="id"){

    return prefix +
        "_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
            .toString(36)
            .slice(2,9);

}

function now(){

    return Date.now();

}

function dayMs(){

    return 24 * 60 * 60 * 1000;

}

function monthKey(timestamp){

    const d = new Date(timestamp);

    return d.getFullYear() +
        "-" +
        String(d.getMonth()+1).padStart(2,"0");

}

/* =========================================================
   PRO SİSTEMİ
   ========================================================= */

const PRO = {

    monthly:{
        price:50,
        days:30,
        boosts:10,
        badge:"PRO",
        badgeClass:"pro-monthly"
    },

    yearly:{
        price:200,
        days:365,
        boosts:10,
        badge:"PRO",
        badgeClass:"pro-yearly"
    }

};

function getUsers(){

    return read(DB.users,[]);

}

function saveUsers(users){

    write(DB.users,users);

}

function currentUser(){

    const id = read(DB.current,null);

    if(!id){
        return null;
    }

    const users = getUsers();

    return users.find(
        u => u.id === id
    ) || null;

}

function updateUser(id,callback){

    const users = getUsers();

    const index = users.findIndex(
        u => u.id === id
    );

    if(index === -1){
        return null;
    }

    callback(users[index]);

    saveUsers(users);

    return users[index];

}

function getUser(id){

    return getUsers().find(
        u => u.id === id
    ) || null;

}

/* =========================================================
   PRO KONTROL
   ========================================================= */

function checkPro(user){

    if(!user){
        return;
    }

    if(user.plan !== "pro"){
        return;
    }

    if(
        !user.proExpiresAt ||
        now() >= user.proExpiresAt
    ){

        user.plan = "free";
        user.proPlan = null;
        user.proStartedAt = null;
        user.proExpiresAt = null;
        user.proCycleKey = null;
        user.proBoostUsed = 0;

        saveUsers(getUsers());

        return;
    }

    /*
       YILLIK PRO'DA:
       10 öne çıkarma hakkı her takvim ayının
       ilk 00:00 döneminde yenilenir.

       Önemli:
       Pro'nun kendisi yenilenmez.
       Sadece aylık hak yenilenir.
    */

    if(user.proPlan === "yearly"){

        const currentCycle = monthKey(now());

        if(user.proCycleKey !== currentCycle){

            updateUser(user.id,u => {

                u.proCycleKey = currentCycle;
                u.proBoostUsed = 0;

            });

            clearExpiredFeaturedForUser(
                user.id
            );

        }

    }

}

function isPro(user){

    if(!user){
        return false;
    }

    checkPro(user);

    const fresh = getUser(user.id);

    return !!(
        fresh &&
        fresh.plan === "pro" &&
        fresh.proExpiresAt > now()
    );

}

function proRemainingDays(user){

    if(!isPro(user)){
        return 0;
    }

    return Math.ceil(
        (user.proExpiresAt - now()) /
        dayMs()
    );

}

/* =========================================================
   PRO AKTİVASYONU
   ========================================================= */

function activatePro(type){

    const user = currentUser();

    if(!user){
        toast("Önce giriş yapmalısın.");
        return;
    }

    if(!PRO[type]){
        return;
    }

    const started = now();

    const duration =
        PRO[type].days * dayMs();

    const expires =
        started + duration;

    updateUser(user.id,u => {

        u.plan = "pro";
        u.proPlan = type;
        u.proStartedAt = started;
        u.proExpiresAt = expires;
        u.proBoostUsed = 0;

        /*
           Yıllık PRO aktif olduğu anda
           ilk 10 hakkı verir.
        */

        u.proCycleKey = monthKey(started);

    });

    activity(
        "pro_activate",
        `${type === "monthly" ? "Aylık" : "Yıllık"} PRO aktif edildi.`
    );

    toast(
        `${type === "monthly" ? "Aylık" : "Yıllık"} PRO aktif edildi.`
    );

    render();

}

/* =========================================================
   ÖNE ÇIKARMA
   ========================================================= */

function remainingBoosts(user){

    if(!isPro(user)){
        return 0;
    }

    const plan = PRO[user.proPlan];

    return Math.max(
        0,
        plan.boosts - (user.proBoostUsed || 0)
    );

}

function boostContent(type,id){

    const user = currentUser();

    if(!user){
        toast("Giriş yapmalısın.");
        return;
    }

    if(!isPro(user)){
        toast("Bu özellik PRO hesap gerektiriyor.");
        navigate("pro");
        return;
    }

    if(remainingBoosts(user) <= 0){

        toast(
            user.proPlan === "yearly"
            ? "Bu ayki 10 öne çıkarma hakkın bitti."
            : "10 öne çıkarma hakkının tamamını kullandın."
        );

        return;
    }

    const keyMap = {
        post:DB.posts,
        reel:DB.reels,
        song:DB.songs,
        shop:DB.shop
    };

    const key = keyMap[type];

    if(!key){
        return;
    }

    const items = read(key,[]);

    const itemIndex = items.findIndex(
        x => x.id === id
    );

    if(itemIndex === -1){
        return;
    }

    if(items[itemIndex].userId !== user.id){

        toast("Sadece kendi içeriğini öne çıkarabilirsin.");
        return;

    }

    if(items[itemIndex].featured){

        toast("Bu içerik zaten öne çıkarılmış.");
        return;

    }

    items[itemIndex].featured = true;
    items[itemIndex].featuredAt = now();
    items[itemIndex].featuredBy = user.id;

    write(key,items);

    updateUser(user.id,u => {

        u.proBoostUsed =
            (u.proBoostUsed || 0) + 1;

    });

    activity(
        "boost",
        `${type} içeriği öne çıkarıldı.`
    );

    toast("İçerik öne çıkarıldı.");

    render();

}

function clearExpiredFeaturedForUser(userId){

    [
        DB.posts,
        DB.reels,
        DB.songs,
        DB.shop
    ].forEach(key => {

        const items = read(key,[]);

        let changed = false;

        items.forEach(item => {

            if(
                item.userId === userId &&
                item.featured
            ){

                item.featured = false;
                item.featuredAt = null;
                item.featuredBy = null;

                changed = true;

            }

        });

        if(changed){
            write(key,items);
        }

    });

}

   ========================================================= */

function dateText(timestamp){

    if(!timestamp){
        return "-";
    }

    return new Date(timestamp)
        .toLocaleString(
            "tr-TR",
            {
                dateStyle:"medium",
                timeStyle:"short"
            }
        );

}

function timeAgo(timestamp){

    const diff =
        Math.max(
            0,
            now() - timestamp
        );

    const minute =
        60 * 1000;

    const hour =
        60 * minute;

    const day =
        24 * hour;

    if(diff < minute){
        return "az önce";
    }

    if(diff < hour){
        return Math.floor(diff/minute) + " dk";
    }

    if(diff < day){
        return Math.floor(diff/hour) + " sa";
    }

    return Math.floor(diff/day) + " gün";

}

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

    return escapeHTML(value);

}

/* =========================================================

   ========================================================= */

function registerUser(data){

    const users = getUsers();

    const name =
        data.name.trim();

    const email =
        data.email.trim().toLowerCase();

    const username =
        data.username
            .trim()
            .toLowerCase();

    const password =
        data.password;

    const role =
        data.role;

    if(
        !name ||
        !email ||
        !username ||
        !password
    ){

        toast("Tüm alanları doldur.");
        return false;

    }

    if(password.length < 6){

        toast(
            "Şifre en az 6 karakter olmalı."
        );

        return false;

    }

    if(
        users.some(
            u => u.email === email
        )
    ){

        toast(
            "Bu e-posta ile zaten hesap var."
        );

        return false;

    }

    if(
        users.some(
            u => u.username === username
        )
    ){

        toast(
            "Bu kullanıcı adı zaten alınmış."
        );

        return false;

    }

    const allowedRoles = [

        "Dinleyici",
        "Sanatçı",
        "Beat Maker",
        "Mix Engineer",
        "Prodüktör"

    ];

    if(!allowedRoles.includes(role)){

        toast("Geçersiz hesap türü.");
        return false;

    }

    const user =
        createUserObject(
            name,
            email,
            username,
            password,
            role
        );

    users.push(user);

    saveUsers(users);

    write(
        DB.current,
        user.id
    );

    activity(
        "register",
        "Hesap oluşturuldu."
    );

    toast("Hesap oluşturuldu.");

    render();

    return true;

}

function isFollowing(
    followerId,
    targetId
){

    const user =
        getUser(followerId);

    return !!(
        user &&
        user.following.includes(targetId)
    );

}

function followUser(targetId){

    const me = currentUser();

    if(!me){
        toast("Giriş yapmalısın.");
        return;
    }

    if(me.id === targetId){
        return;
    }

    const target =
        getUser(targetId);

    if(!target){
        return;
    }

    if(
        me.blockedUsers.includes(targetId) ||
        target.blockedUsers.includes(me.id)
    ){

        toast(
            "Bu kullanıcıyla etkileşim kuramazsın."
        );

        return;

    }

    const already =
        me.following.includes(targetId);

    updateUser(me.id,u => {

        if(already){

            u.following =
                u.following.filter(
                    id => id !== targetId
                );

        }else{

            u.following.push(targetId);

        }

    });

    updateUser(targetId,u => {

        if(already){

            u.followers =
                u.followers.filter(
                    id => id !== me.id
                );

        }else{

            if(!u.followers.includes(me.id)){

                u.followers.push(me.id);

            }

        }

    });

    if(!already){

        notification(
            targetId,
            `${me.name} seni takip etmeye başladı.`,
            "follow"
        );

    }

    render();

}

function toggleBlock(targetId){

    const me = currentUser();

    if(!me || me.id === targetId){
        return;

    const blocked =
        me.blockedUsers.includes(targetId);

    updateUser(me.id,u => {

        if(blocked){

            u.blockedUsers =
                u.blockedUsers.filter(
                    id => id !== targetId
                );

        }else{

            u.blockedUsers.push(targetId);

        }

    });

    toast(
        blocked
        ? "Engel kaldırıldı."
        : "Kullanıcı engellendi."
    );

    render();

}

   ========================================================= */

function canChangeName(user){

    const limit =
        7 * dayMs();

    const cutoff =
        now() - limit;

    const recent =
        (user.nameChanges || [])
            .filter(
                x => x.at >= cutoff
            );

    return recent.length < 3;

}

function registerNameChange(
    user,
    type,
    oldValue,
    newValue
){

    if(oldValue === newValue){
        return true;
    }

    if(!canChangeName(user)){

        toast(
            "7 gün içinde en fazla 3 isim/kullanıcı adı değişikliği yapabilirsin."
        );

        return false;

    }

    updateUser(user.id,u => {

        if(!u.nameChanges){
            u.nameChanges = [];
        }

        u.nameChanges.push({

            type,
            oldValue,
            newValue,
            at:now()

        });

    });

    return true;

}

    if(
        user.plan === "pro" &&
        user.proExpiresAt > now()
    ){

        return true;

    }

    return shopCount(user.id) < 20;

}

function allowedShopTypes(role){

    switch(role){

        case "Beat Maker":
            return ["Beat"];

        case "Mix Engineer":
            return ["Mix"];

        case "Prodüktör":
            return ["Beat","Mix"];

        default:
            return [];

    }

}

function likePost(postId){

    const user = currentUser();

    if(!user){
        return;
    }

    const posts =
        getPosts();

    const post =
        posts.find(
            p => p.id === postId
        );

    if(!post){
        return;
    }

    const index =
        post.likes.indexOf(user.id);

    if(index === -1){

        post.likes.push(user.id);

        if(post.userId !== user.id){

            notification(
                post.userId,
                `${user.name} gönderini beğendi.`,
                "like"
            );

        }

    }else{

        post.likes.splice(
            index,
            1
        );

    }

    write(
        DB.posts,
        posts
    );

    render();

}

function conversationKey(a,b){

    return [a,b]
        .sort()
        .join("_");

}

function sendMessage(targetId,text){

    const me = currentUser();

    if(!me){
        return;
    }

    const target =
        getUser(targetId);

    if(!target){
        return;
    }

    if(
        me.blockedUsers.includes(targetId) ||
        target.blockedUsers.includes(me.id)
    ){

        toast(
            "Bu kullanıcıya mesaj gönderemezsin."
        );

        return;

    }

    const messages =
        getMessages();

    messages.push({

        id:uid("msg"),

        conversation:
            conversationKey(
                me.id,
                targetId
            ),

        from:me.id,

        to:targetId,

        text:text.trim(),

        createdAt:now(),

        read:false

    });

    write(
        DB.messages,
        messages
    );

    notification(
        targetId,
        `${me.name} sana yeni bir mesaj gönderdi.`,
        "message"
    );

    render();

}

function isAdmin(user){

        user.role === "admin"
    );

}

function adminLog(
    action,
    targetId,
    description
){

    const admin =
        currentUser();

    if(!isAdmin(admin)){
        return;
    }

    const logs =
        read(DB.adminLogs,[]);

    logs.unshift({

        id:uid("adminlog"),

        adminId:admin.id,

        action,

        targetId,

        description,

        createdAt:now()

    });

    write(

    );

}

function adminBanUser(userId){

    const admin =
        currentUser();

    if(!isAdmin(admin)){
        return;
    }

    if(userId === admin.id){
        return;
    }

    const target =
        getUser(userId);

    if(!target){
        return;
    }

    updateUser(
        userId,
        u => {
            u.banned = true;
            u.online = false;
        }
    );

    adminLog(
        "ban",
        userId,
        `${target.username} engellendi.`
    );

    toast("Kullanıcı engellendi.");

    render();

}

function adminUnbanUser(userId){

    const admin =
        currentUser();

    if(!isAdmin(admin)){
        return;
    }

    updateUser(
        userId,
        u => {
            u.banned = false;
        }
    );

    adminLog(
        "unban",
        userId,
        "Kullanıcı engeli kaldırıldı."
    );

    toast("Kullanıcı engeli kaldırıldı.");

    render();

}

function adminDeleteUser(userId){

    const admin =
        currentUser();

    if(!isAdmin(admin)){
        return;
    }

    if(userId === admin.id){
        return;
    }

    let users =
        getUsers();

    users =
        users.filter(
            u => u.id !== userId
        );

    saveUsers(users);

    [
        DB.posts,
        DB.reels,
        DB.songs,
        DB.shop
    ].forEach(key => {

        const items =
            read(key,[]);

        write(
            key,
            items.filter(
                x => x.userId !== userId
            )
        );

    });

    adminLog(
        "delete_user",
        userId,
        "Kullanıcı hesabı silindi."
    );

    toast("Hesap silindi.");

    render();

}

function adminGivePro(
    userId,
    type
){

    const admin =
        currentUser();

    if(!isAdmin(admin)){
        return;
    }

    const config =
        PRO[type];

    if(!config){
        return;
    }

    const started =
        now();

    updateUser(
        userId,
        u => {

            u.plan = "pro";

            u.proPlan = type;

            u.proStartedAt =
                started;

            u.proExpiresAt =
                started +
                config.days *
                dayMs();

            u.proBoostUsed = 0;

            u.proCycleKey =
                monthKey(started);

        }
    );

    adminLog(
        "give_pro",
        userId,
        `${type} PRO verildi.`
    );

    notification(
        userId,
        `Yönetici hesabına ${type} PRO tanımladı.`,
        "pro"
    );

    toast("PRO tanımlandı.");

    render();

}

function adminRemovePro(userId){

    const admin =
        currentUser();

    if(!isAdmin(admin)){
        return;
    }

    updateUser(
        userId,
        u => {

            u.plan = "free";
            u.proPlan = null;
            u.proStartedAt = null;
            u.proExpiresAt = null;
            u.proCycleKey = null;
            u.proBoostUsed = 0;

        }
    );

    clearExpiredFeaturedForUser(
        userId
    );

    adminLog(
        "remove_pro",
        userId,
        "PRO kaldırıldı."
    );

    toast("PRO kaldırıldı.");

    render();

}

        getPosts()
            .sort(
                (a,b) =>
                    Number(b.featured) -
                    Number(a.featured) ||
                    b.createdAt -
                    a.createdAt
            );

    return `

        <div class="page-header">

            <div>
                <h1>Ana Sayfa</h1>
                <p>MYM SOUND topluluğundan son içerikler.</p>
            </div>

        </div>

        <div class="post-create card">

            <div class="post-create-row">

                ${avatarHTML(currentUser())}

                <div
                    class="fake-input"
                    data-action="create-post"
                >
                    Bir şeyler paylaş...
                </div>

            </div>

        </div>

        ${
            posts.length
            ? posts.map(postCard).join("")
            : `
                <div class="card center" style="padding:40px">
                    Henüz gönderi yok.
                </div>
            `
        }

    `;

}

/* =========================================================
   SHOP SAYFASI
   ========================================================= */

function renderShop(){

    const user =
        currentUser();

    const all =
        getShop();

    const myItems =
        all.filter(
            x => x.userId === user.id
        );

    const vitrines =
        [...new Set(
            all.map(x => x.userId)
        )];

    const visible =
        state.shopTab === "my"
        ? myItems
        : all;

    return `

        <div class="page-header">

            <div>
                <h1>Vitrin</h1>
                <p>
                    Beat, Mix ve prodüksiyon ürünleri.
                </p>
            </div>

            <button
                class="btn primary"
                data-action="create-shop"
            >
                + Ürün
            </button>

        </div>

        <div class="card" style="padding:8px;margin-bottom:18px">

            <button
                class="btn ${
                    state.shopTab === "my"
                    ? "primary"
                    : ""
                }"
                data-shop-tab="my"
            >
                Benim Vitrinim
            </button>

            <button
                class="btn ${
                    state.shopTab === "all"
                    ? "primary"
                    : ""
                }"
                data-shop-tab="all"
            >
                Vitrinler
            </button>

        </div>

        ${
            state.shopTab === "my"
            ? `
                <div class="shop-hero">

                    <div>

                        <h2>
                            ${escapeHTML(user.name)}
                            ${badgeHTML(user)}
                        </h2>

                        <p>
                            @${escapeHTML(user.username)}
                        </p>

                        <p class="muted" style="margin-top:7px">
                            ${escapeHTML(user.bio || "Vitrin açıklaması eklenmemiş.")}
                        </p>

                        <p style="margin-top:10px">
                            ${myItems.length}
                            / 
                            ${
                                isPro(user)
                                ? "∞"
                                : "20"
                            }
                            ürün
                        </p>

                    </div>

                </div>
            `
            : ""
        }

        ${
            state.shopTab === "all"
            ? `
                <div class="card" style="padding:15px;margin-bottom:18px">

                    <strong>
                        ${vitrines.length}
                        aktif Vitrin
                    </strong>

                </div>
            `
            : ""
        }

        <div class="shop-items">

            ${
                visible.length
                ? visible.map(shopCard).join("")
                : `
                    <div
                        class="card center"
                        style="
                            padding:40px;
                            grid-column:1/-1
                        "

                        Vitrinde henüz ürün yok.

                `

        </div>

    `;

}

/* =========================================================
   MESAJLAR SAYFASI
   ========================================================= */

function renderMessages(){

    const me =
        currentUser();

    const users =
        getUsers()
            .filter(
                u =>
                    u.id !== me.id &&
                    !me.blockedUsers.includes(u.id)
            );

    const selected =
        state.messageUserId
        ? getUser(state.messageUserId)
        : null;

    const conversation =
        selected
        ? getMessages()
            .filter(
                m =>
                    m.conversation ===
                    conversationKey(
                        me.id,
                        selected.id
                    )
            )
            .sort(
                (a,b) =>
                    a.createdAt -
                    b.createdAt
            )
        : [];

    return `

        <div class="page-header">

            <div>
                <h1>Mesajlar</h1>
                <p>Kullanıcılarla özel mesajlaş.</p>
            </div>

        </div>

        <div class="messages-layout card">

            <div class="message-users">

                ${
                    users.map(
                        user => `

                            <div
                                class="
                                    message-user
                                    ${
                                        selected?.id === user.id
                                        ? "active"
                                        : ""
                                    }
                                "
                                data-message-user="${user.id}"
                            >

                                ${avatarHTML(user,true)}

                                <div>

                                    <strong>
                                        ${escapeHTML(user.name)}
                                    </strong>

                                    <div class="small muted">

                                        @${escapeHTML(user.username)}

                                    </div>

                                </div>

                            </div>

                        `
                    ).join("")
                }

            </div>

            <div class="chat">

                ${
                    selected
                    ? `

                        <div class="chat-head">

                            <strong>
                                ${escapeHTML(selected.name)}
                                ${badgeHTML(selected)}
                            </strong>

                            <div class="small muted">

                                @${escapeHTML(selected.username)}

                            </div>

                        </div>

                        <div class="chat-messages">

                            ${
                                conversation.map(
                                    message => `

                                        <div
                                            class="
                                                message
                                                ${
                                                    message.from === me.id
                                                    ? "mine"
                                                    : ""
                                                }
                                            "
                                        >
                                            ${escapeHTML(message.text)}

                                            <div
                                                class="small"
                                                style="
                                                    opacity:.65;
                                                    margin-top:4px
                                                "
                                            >
                                                ${dateText(message.createdAt)}
                                            </div>

                                        </div>

                                    `
                                ).join("")
                            }

                        </div>

                        <form
                            id="messageForm"
                            class="chat-send"
                        >

                            <input
                                class="input"
                                name="text"
                                placeholder="Mesaj yaz..."
                                autocomplete="off"
                                required
                            >

                            <button
                                class="btn primary"
                            >
                                Gönder
                            </button>

                        </form>

                    `
                    : `
                        <div
                            class="center muted"
                            style="
                                margin:auto;
                                padding:40px
                            "
                        >
                            Mesajlaşmak için bir kullanıcı seç.
                        </div>
                    `
                }

            </div>

        </div>

    `;

}

function adminContentRow(
    type,
    id,
    text,
    userId
){

    const owner =
        getUser(userId);

    return `

        <tr>

            <td>
                ${escapeHTML(type)}
            </td>

            <td>
                ${escapeHTML(
                    String(text || "").slice(0,100)
                )}
            </td>

            <td>
                @${escapeHTML(
                    owner?.username || "silinmiş"
                )}
            </td>

            <td>

                <button
                    class="btn danger"
                    data-admin-delete-content="${id}"
                    data-content-type="${escapeAttr(type)}"
                >
                    Sil
                </button>

            </td>

        </tr>

    `;

}

function adminDeleteContent(
    type,
    id
){

    const map = {

        "Gönderi":DB.posts,
        "Reel":DB.reels,
        "Şarkı":DB.songs,
        "Vitrin":DB.shop

    };

    const key =
        map[type];

    if(!key){
        return;
    }

    const items =
        read(key,[]);

    write(
        key,
        items.filter(
            x => x.id !== id
        )
    );

    adminLog(
        "delete_content",
        id,
        `${type} içeriği silindi.`
    );

    toast("İçerik silindi.");

    render();

}

function renderSearch(query){

    const q =
        query.trim().toLowerCase();

    if(!q){
        return "";
    }

    const users =
        getUsers()
            .filter(
                u =>
                    u.username.includes(q) ||
                    u.name.toLowerCase().includes(q)
            )
            .slice(0,20);

    const songs =
        getSongs()
            .filter(
                s =>
                    s.title.toLowerCase().includes(q)
            )
            .slice(0,20);

    return `

        <div
            class="card"
            style="
                position:absolute;
                top:55px;
                left:0;
                right:0;
                z-index:500;
                padding:8px;
            "
            id="searchDropdown"
        >

            ${
                users.length
                ? users.map(
                    u => `

                        <button
                            style="
                                width:100%;
                                border:0;
                                background:transparent;
                                color:white;
                                padding:10px;
                                text-align:left;
                                display:flex;
                                gap:10px;
                                align-items:center;
                            "
                            data-profile="${u.id}"
                        >

                            ${avatarHTML(u,true)}

                            <span>

                                <strong>
                                    ${escapeHTML(u.name)}
                                </strong>

                                <small
                                    style="
                                        display:block;
                                        color:var(--muted)
                                    "
                                >
                                    @${escapeHTML(u.username)}
                                </small>

                            </span>

                        </button>

                    `
                ).join("")
                : ""
            }

            ${
                songs.length
                ? `
                    <div
                        style="
                            padding:8px;
                            color:var(--muted)
                        "
                    >
                        Şarkılar
                    </div>

                    ${songs.map(
                        s => `

                                style="

/* =========================================================

   ========================================================= */

function render(){

    const user =
        currentUser();

    if(user){

        checkPro(user);

        applyTheme(
            getUser(user.id)
        );

    }

    const app =
        document.getElementById("app");

    if(!user){

        app.innerHTML =
            authHTML();

        return;

    }

    let pageHTML = "";

    switch(state.page){

        case "home":
            pageHTML = renderHome();
            break;

        case "posts":
            pageHTML = renderHome();
            break;

        case "reels":
            pageHTML = renderReels();
            break;

        case "songs":
            pageHTML = renderSongs();
            break;

        case "channels":
            pageHTML = renderChannels();
            break;

        case "shop":
            pageHTML = renderShop();
            break;

        case "profile":
            pageHTML = renderProfile();
            break;

        case "messages":
            pageHTML = renderMessages();
            break;

        case "notifications":
            pageHTML = renderNotifications();
            break;

        case "pro":
            pageHTML = renderPro();
            break;

        case "settings":
            pageHTML = renderSettings();
            break;

        case "admin":
            pageHTML = renderAdmin();
            break;

        default:
            pageHTML = renderHome();

    }

    app.innerHTML = `

        ${headerHTML()}

        <div class="container main-layout">

            ${navHTML()}

            <main class="content">

                ${pageHTML}

            </main>

        </div>

    `;

}

/* =========================================================
   EVENT SYSTEM
   ========================================================= */

document.addEventListener(
    "click",
    function(e){

        const nav =
            e.target.closest("[data-nav]");

        if(nav){

            navigate(
                nav.dataset.nav
            );

            return;

        }

        const auth =
            e.target.closest("[data-auth]");

        if(auth){

            state.authMode =
                auth.dataset.auth;

            render();

            return;

        }

        const profile =
            e.target.closest("[data-profile]");

        if(profile){

            state.profileUserId =
                profile.dataset.profile;

            state.channelTab =
                "posts";

            navigate("profile");

            return;

        }

        const follow =
            e.target.closest("[data-follow]");

        if(follow){

            followUser(
                follow.dataset.follow
            );

            return;

        }

        const block =
            e.target.closest("[data-block]");

        if(block){

            toggleBlock(
                block.dataset.block
            );

            return;

        }

        const message =
            e.target.closest("[data-message]");

        if(message){

            state.messageUserId =
                message.dataset.message;

            navigate("messages");

            return;

        }

        const messageUser =
            e.target.closest(
                "[data-message-user]"
            );

        if(messageUser){

            state.messageUserId =
                messageUser.dataset.messageUser;

            render();

            return;

        }

        const like =
            e.target.closest(
                "[data-like-post]"
            );

        if(like){

            likePost(
                like.dataset.likePost
            );

            return;

        }

        const action =
            e.target.closest(
                "[data-action]"
            );

        if(action){

            const type =
                action.dataset.action;

            if(type === "logout"){
                logout();
                return;
            }

            if(type === "close-modal"){
                closeModal();
                return;
            }

            if(type === "create-post"){
                createPost();
                return;
            }

            if(type === "create-song"){
                createSong();
                return;
            }

            if(type === "create-reel"){
                createReel();
                return;
            }

            if(type === "create-shop"){
                createShopItem();
                return;
            }

            if(type === "read-notifications"){

                const user =
                    currentUser();

                const notifications =
                    getNotifications();

                notifications.forEach(
                    n => {

                        if(
                            n.userId === user.id
                        ){
                            n.read = true;
                        }

                    }
                );

                write(
                    DB.notifications,
                    notifications
                );

                render();

                return;

            }

        }

        const boost =
            e.target.closest("[data-boost]");

        if(boost){

            boostContent(
                boost.dataset.boost,
                boost.dataset.id
            );

            return;

        }

        const buy =
            e.target.closest("[data-buy-pro]");

        if(buy){

            const type =
                buy.dataset.buyPro;

            openModal(`

                <div class="modal-head">

                    <h2>
                        PRO Aktivasyonu
                    </h2>

                    <button
                        class="modal-close"
                        data-action="close-modal"
                    >
                        X
                    </button>

                </div>

                <p class="muted" style="line-height:1.7">

                    Bu demo sürümünde gerçek ödeme alınmaz.
                    Onayladığında ${type === "monthly" ? "50 TL Aylık PRO" : "200 TL Yıllık PRO"}
                    yerel olarak hesabına tanımlanır.

                </p>

                <button
                    class="btn primary full"
                    style="margin-top:18px"
                    data-confirm-pro="${type}"
                >
                    PRO'yu Aktifleştir
                </button>

            `);

            return;

        }

        const confirmPro =
            e.target.closest(
                "[data-confirm-pro]"
            );

        if(confirmPro){

            activatePro(
                confirmPro.dataset.confirmPro
            );

            closeModal();

            return;

        }

        const shopTab =
            e.target.closest(
                "[data-shop-tab]"
            );

        if(shopTab){

            state.shopTab =
                shopTab.dataset.shopTab;

            render();

            return;

        }

        const channelTab =
            e.target.closest(
                "[data-channel-tab]"
            );

        if(channelTab){

            state.channelTab =
                channelTab.dataset.channelTab;

            render();

            return;

        }

        const theme =
            e.target.closest(
                "[data-theme]"
            );

        if(theme){

            saveTheme(
                Number(theme.dataset.theme)
            );

            return;

        }

        const adminBan =
            e.target.closest(
                "[data-admin-ban]"
            );

        if(adminBan){

            adminBanUser(
                adminBan.dataset.adminBan
            );

            return;

        }

        const adminUnban =
            e.target.closest(
                "[data-admin-unban]"
            );

        if(adminUnban){

            adminUnbanUser(
                adminUnban.dataset.adminUnban
            );

            return;

        }

        const adminDelete =
            e.target.closest(
                "[data-admin-delete]"
            );

        if(adminDelete){

            if(
                confirm(
                    "Bu hesabı ve içeriklerini silmek istediğine emin misin?"
                )
            ){

                adminDeleteUser(
                    adminDelete.dataset.adminDelete
                );

            }

            return;

        }

        const adminPro =
            e.target.closest(
                "[data-admin-pro]"
            );

        if(adminPro){

            adminGivePro(
                adminPro.dataset.id,
                adminPro.dataset.adminPro
            );

            return;

        }

        const removePro =
            e.target.closest(
                "[data-admin-remove-pro]"
            );

        if(removePro){

            adminRemovePro(
                removePro.dataset.adminRemovePro
            );

            return;

        }

        const deleteContent =
            e.target.closest(
                "[data-admin-delete-content]"
            );

        if(deleteContent){

            adminDeleteContent(
                deleteContent.dataset.contentType,
                deleteContent.dataset.adminDeleteContent
            );

            return;

        }

    }
);

/* =========================================================
   FORM EVENTLERİ
   ========================================================= */

document.addEventListener(
    "submit",
    function(e){

        e.preventDefault();

        if(e.target.id === "loginForm"){

            const form =
                new FormData(e.target);

            loginUser(
                form.get("identifier"),
                form.get("password")
            );

            return;

        }

        if(e.target.id === "registerForm"){

            const form =
                new FormData(e.target);

            registerUser({

                name:form.get("name"),
                email:form.get("email"),
                username:form.get("username"),
                password:form.get("password"),
                role:form.get("role")

            });

            return;

        }

        if(e.target.id === "postForm"){

            const form =
                new FormData(e.target);

            savePost(
                form.get("text"),
                form.get("media")
            );

            closeModal();

            return;

        }

        if(e.target.id === "songForm"){

            const form =
                new FormData(e.target);

            saveSong({

                title:form.get("title"),
                description:form.get("description"),
                audio:form.get("audio")

            });

            closeModal();

            return;

        }

        if(e.target.id === "reelForm"){

            const form =
                new FormData(e.target);

            saveReel({

                text:form.get("text"),
                video:form.get("video")

            });

            closeModal();

            return;

        }

        if(e.target.id === "shopForm"){

            const form =
                new FormData(e.target);

            saveShopItem({

                type:form.get("type"),
                title:form.get("title"),
                description:form.get("description"),
                price:form.get("price"),
                audio:form.get("audio"),
                image:form.get("image")

            });

            closeModal();

            return;

        }

        if(e.target.id === "messageForm"){

            const form =
                new FormData(e.target);

            sendMessage(
                state.messageUserId,
                form.get("text")
            );

            return;

        }

        if(
            e.target.id ===
            "profileSettingsForm"
        ){

            saveProfileSettings(
                new FormData(e.target)
            );

            return;

        }

    }
);

/* =========================================================
   PROFİL AYARLARINI KAYDET
   ========================================================= */

function saveProfileSettings(form){

    const user =
        currentUser();

    if(!user){
        return;
    }

    const newName =
        String(
            form.get("name") || ""
        ).trim();

    const newUsername =
        String(
            form.get("username") || ""
        )
        .trim()
        .toLowerCase();

    const bio =
        String(
            form.get("bio") || ""
        ).trim();

    const avatar =
        String(
            form.get("avatar") || ""
        ).trim();

    const profileBackground =
        String(
            form.get("profileBackground") || ""
        ).trim();

    const shopBackground =
        String(
            form.get("shopBackground") || ""
        ).trim();

    if(!newName || !newUsername){

        toast(
            "İsim ve kullanıcı adı boş bırakılamaz."
        );

        return;

    }

    const users =
        getUsers();

    const usernameTaken =
        users.some(
            u =>
                u.id !== user.id &&
                u.username === newUsername
        );

    if(usernameTaken){

        toast(
            "Bu kullanıcı adı zaten kullanılıyor."
        );

        return;

    }

    if(
        (
            newName !== user.name ||
            newUsername !== user.username
        ) &&
        !canChangeName(user)
    ){

        toast(
            "7 gün içinde toplam 3 değişiklik sınırına ulaştın."
        );

        return;

    }

    if(newName !== user.name){

        if(
            !registerNameChange(
                user,
                "name",
                user.name,
                newName
            )
        ){
            return;
        }

    }

    if(newUsername !== user.username){

        if(
            !registerNameChange(
                user,
                "username",
                user.username,
                newUsername
            )
        ){
            return;
        }

    }

    updateUser(
        user.id,
        u => {

            u.name = newName;

            u.username =
                newUsername;

            u.bio = bio;

            u.avatar =
                avatar || null;

            u.profileBackground =
                profileBackground || null;

            u.shopBackground =
                shopBackground || null;

        }
    );

    toast(
        "Profil güncellendi."
    );

    render();

}

/* =========================================================
   SEARCH EVENT
   ========================================================= */

document.addEventListener(
    "input",
    function(e){

        if(
            e.target.id !==
            "globalSearch"
        ){
            return;
        }

        const query =
            e.target.value;

        const parent =
            e.target.parentElement;

        const old =
            document.getElementById(
                "searchDropdown"
            );

        if(old){
            old.remove();
        }

        if(!query.trim()){
            return;
        }

        parent.insertAdjacentHTML(
            "beforeend",
            renderSearch(query)
        );

    }
);

/* =========================================================
   SETTINGS TAB
   ========================================================= */

document.addEventListener(
    "click",
    function(e){

        const tab =
            e.target.closest(
                "[data-settings-tab]"
            );

        if(!tab){
            return;
        }

        const content =
            document.getElementById(
                "settingsContent"
            );

        if(!content){
            return;
        }

        const user =
            currentUser();

        if(
            tab.dataset.settingsTab ===
            "appearance"
        ){

            content.innerHTML =
                renderAppearanceSettings();

        }

        if(
            tab.dataset.settingsTab ===
            "profile"
        ){

            content.innerHTML =
                renderProfileSettings(
                    user
                );

        }

        if(
            tab.dataset.settingsTab ===
            "account"
        ){

            content.innerHTML = `

                <h2>Hesap</h2>

                <div
                    class="card"
                    style="
                        padding:15px;
                        margin-top:15px;
                        background:var(--panel2)
                    "
                >

                    <p>
                        E-posta:
                        <strong>
                            ${escapeHTML(user.email)}
                        </strong>
                    </p>

                    <p style="margin-top:8px">
                        Hesap türü:
                        <strong>
                            ${escapeHTML(user.role)}
                        </strong>
                    </p>

                    <p style="margin-top:8px">
                        Plan:
                        <strong>
                            ${user.plan === "pro" ? "PRO" : "Free"}
                        </strong>
                    </p>

                    <p style="margin-top:8px">
                        Hesap oluşturma:
                        <strong>
                            ${dateText(user.createdAt)}
                        </strong>
                    </p>

                </div>

            `;

        }

    }
);

/* =========================================================
   GECE YARISI PRO KONTROLÜ
   ========================================================= */

function scheduleMidnightCheck(){

    const current =
        new Date();

    const next =
        new Date(current);

    next.setHours(
        24,
        0,
        5,
        0
    );

    const delay =
        next.getTime() -
        current.getTime();

    setTimeout(
        () => {

            const user =
                currentUser();

            if(user){

                checkPro(user);

                render();

            }

            scheduleMidnightCheck();

        },
        Math.max(
            1000,
            delay
        )
    );

}

/* =========================================================
   OTOMATİK PRO KONTROL
   ========================================================= */

setInterval(
    () => {

        const user =
            currentUser();

        if(user){

            checkPro(user);

        }

    },
    30000
);

/* =========================================================
   İLK ÇALIŞTIRMA
   ========================================================= */

(function init(){

    const user =
        currentUser();

    if(user){

        updateUser(
            user.id,
            u => {

                u.online = true;
                u.lastSeen = now();

            }
        );

    }

    /*
       İlk yönetici hesabı otomatik oluşturulmuyor.
       Admin hesabı gerçek sistemde backend tarafından
       güvenli biçimde atanmalıdır.
    */

    state.authMode =
        "login";

    applyTheme(
        user
    );

    render();

    scheduleMidnightCheck();

})();
