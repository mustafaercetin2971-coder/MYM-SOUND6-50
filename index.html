<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MYM SOUND</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#080808;
    --panel:#111111;
    --panel2:#171717;
    --border:#292929;
    --text:#ffffff;
    --muted:#999999;
    --purple:#8b5cf6;
    --purple2:#6d28d9;
    --danger:#ef4444;
    --success:#22c55e;
    --gray:#202020;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

/* AUTH */

#authScreen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top,#24103d 0,#0b0810 35%,#050505 70%);
}

.auth-box{
    width:100%;
    max-width:450px;
    background:rgba(17,17,17,.96);
    border:1px solid #333;
    border-radius:24px;
    padding:32px;
    box-shadow:0 25px 80px rgba(0,0,0,.6);
}

.auth-logo{
    text-align:center;
    font-size:34px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:8px;
}

.auth-logo span{
    color:var(--purple);
}

.auth-sub{
    text-align:center;
    color:var(--muted);
    margin-bottom:28px;
}

.auth-tabs{
    display:flex;
    gap:8px;
    margin-bottom:20px;
}

.auth-tab{
    flex:1;
    padding:12px;
    border:1px solid var(--border);
    background:#151515;
    color:#aaa;
    border-radius:12px;
}

.auth-tab.active{
    background:var(--purple);
    color:#fff;
    border-color:var(--purple);
}

.auth-form{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.auth-form input,
.auth-form select{
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid var(--border);
    background:#0b0b0b;
    color:#fff;
    outline:none;
}

.auth-form input:focus,
.auth-form select:focus{
    border-color:var(--purple);
}

.auth-button{
    border:0;
    padding:14px;
    border-radius:12px;
    background:var(--purple);
    color:#fff;
    font-weight:700;
    margin-top:5px;
}

.auth-button:hover{
    background:var(--purple2);
}

.auth-note{
    font-size:12px;
    color:#777;
    text-align:center;
    margin-top:15px;
}

/* APP */

.app{
    min-height:100vh;
}

.topbar{
    height:64px;
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    align-items:center;
    gap:15px;
    padding:0 18px;
    background:rgba(8,8,8,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--border);
}

.logo{
    font-weight:900;
    font-size:21px;
    white-space:nowrap;
}

.logo span{
    color:var(--purple);
}

.search-box{
    flex:1;
    max-width:520px;
    position:relative;
}

.search-box input{
    width:100%;
    padding:11px 15px;
    border:1px solid var(--border);
    border-radius:12px;
    background:#111;
    color:#fff;
    outline:none;
}

.top-actions{
    margin-left:auto;
    display:flex;
    gap:7px;
}

.icon-btn{
    width:40px;
    height:40px;
    border-radius:11px;
    border:1px solid var(--border);
    background:#111;
    color:#fff;
}

.icon-btn:hover{
    border-color:var(--purple);
}

.badge-count{
    position:absolute;
    top:-3px;
    right:-3px;
    background:var(--danger);
    color:#fff;
    font-size:10px;
    min-width:17px;
    height:17px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* LAYOUT */

.layout{
    display:flex;
    min-height:calc(100vh - 64px);
}

.sidebar{
    width:240px;
    flex-shrink:0;
    border-right:1px solid var(--border);
    padding:15px;
    position:sticky;
    top:64px;
    height:calc(100vh - 64px);
    overflow:auto;
    background:#090909;
}

.nav-group{
    margin-bottom:20px;
}

.nav-title{
    color:#666;
    font-size:11px;
    text-transform:uppercase;
    margin:8px 10px;
}

.nav-btn{
    width:100%;
    text-align:left;
    padding:12px;
    border:0;
    background:transparent;
    color:#bbb;
    border-radius:11px;
    margin-bottom:3px;
}

.nav-btn:hover,
.nav-btn.active{
    background:#1b1425;
    color:#fff;
}

.main{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:25px;
}

.page-title{
    font-size:28px;
    font-weight:800;
    margin-bottom:20px;
}

.page-subtitle{
    color:var(--muted);
    margin-top:-12px;
    margin-bottom:20px;
}

/* CARDS */

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:17px;
    padding:18px;
    margin-bottom:15px;
}

.card-title{
    font-weight:800;
    font-size:18px;
    margin-bottom:12px;
}

.btn{
    border:1px solid var(--border);
    background:#171717;
    color:#fff;
    padding:9px 14px;
    border-radius:10px;
}

.btn:hover{
    border-color:var(--purple);
}

.btn-primary{
    background:var(--purple);
    border-color:var(--purple);
}

.btn-danger{
    background:#291010;
    border-color:#612020;
    color:#ff7777;
}

.btn-success{
    background:#102415;
    border-color:#20592d;
    color:#6ee58b;
}

.btn-small{
    padding:7px 10px;
    font-size:13px;
}

.row{
    display:flex;
    align-items:center;
    gap:10px;
}

.between{
    justify-content:space-between;
}

.wrap{
    flex-wrap:wrap;
}

.muted{
    color:var(--muted);
}

.small{
    font-size:12px;
}

.empty{
    text-align:center;
    padding:45px 20px;
    color:#666;
}

/* AVATAR */

.avatar{
    width:44px;
    height:44px;
    min-width:44px;
    border-radius:50%;
    background:linear-gradient(135deg,#7c3aed,#111);
    border:1px solid #444;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    color:#fff;
}

.avatar.small{
    width:34px;
    height:34px;
    min-width:34px;
    font-size:12px;
}

.avatar.large{
    width:100px;
    height:100px;
    min-width:100px;
    font-size:28px;
    border:3px solid #111;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* POSTS */

.post-head{
    display:flex;
    align-items:center;
    gap:10px;
}

.post-user{
    font-weight:700;
}

.post-user small{
    display:block;
    color:#777;
    font-weight:400;
}

.post-text{
    margin:15px 0;
    line-height:1.55;
    white-space:pre-wrap;
}

.post-media{
    width:100%;
    max-height:600px;
    object-fit:contain;
    background:#050505;
    border-radius:13px;
}

.post-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:13px;
}

.comment-box{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.comment-box input{
    flex:1;
    background:#0c0c0c;
    color:#fff;
    border:1px solid var(--border);
    padding:10px;
    border-radius:10px;
}

.comments{
    margin-top:10px;
}

.comment{
    padding:9px;
    border-bottom:1px solid #202020;
}

.comment b{
    margin-right:5px;
}

/* SONG */

.song-card{
    display:flex;
    align-items:center;
    gap:15px;
}

.cover{
    width:74px;
    height:74px;
    border-radius:12px;
    object-fit:cover;
    background:#222;
    flex-shrink:0;
}

.song-info{
    flex:1;
    min-width:0;
}

.song-name{
    font-weight:800;
    font-size:17px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.song-description{
    color:#888;
    font-size:13px;
    margin-top:5px;
}

.song-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

/* CREATE */

.create-tabs,
.feed-tabs,
.channel-tabs{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-bottom:15px;
    scrollbar-width:none;
}

.create-tabs button,
.feed-tabs button,
.channel-tabs button{
    white-space:nowrap;
}

.tab-active{
    background:var(--purple)!important;
    border-color:var(--purple)!important;
}

textarea{
    resize:vertical;
    min-height:110px;
}

.field,
textarea,
.form-input,
.form-select{
    width:100%;
    background:#0b0b0b;
    color:#fff;
    border:1px solid var(--border);
    border-radius:11px;
    padding:12px;
    outline:none;
}

.field:focus,
textarea:focus,
.form-input:focus,
.form-select:focus{
    border-color:var(--purple);
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin-bottom:6px;
}

/* PROFILE */

.profile-cover{
    height:230px;
    border-radius:18px;
    background:
        linear-gradient(135deg,#201333,#101010);
    background-size:cover;
    background-position:center;
    border:1px solid var(--border);
    position:relative;
}

.profile-info{
    display:flex;
    gap:20px;
    align-items:end;
    margin-top:-50px;
    padding:0 25px;
    position:relative;
}

.profile-text{
    padding-bottom:10px;
}

.profile-name{
    font-size:25px;
    font-weight:900;
}

.username{
    color:#888;
}

.stats{
    display:flex;
    gap:25px;
    margin-top:13px;
}

.stat b{
    display:block;
}

.stat span{
    color:#777;
    font-size:12px;
}

/* CHANNEL */

.channel-header{
    overflow:hidden;
    border:1px solid var(--border);
    border-radius:18px;
    background:#111;
}

.channel-cover{
    height:210px;
    background:#1b1029;
    background-size:cover;
    background-position:center;
}

.channel-body{
    padding:20px;
}

.online-dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#555;
    margin-right:5px;
}

.online-dot.on{
    background:var(--success);
}

.plan{
    display:inline-block;
    padding:4px 8px;
    border-radius:6px;
    font-size:10px;
    font-weight:900;
}

.plan-free{
    background:#242424;
    color:#aaa;
}

.plan-pro{
    background:var(--purple);
    color:#fff;
}

/* PEOPLE */

.person{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 0;
    border-bottom:1px solid #222;
}

.person-info{
    flex:1;
}

.person-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

/* SHOP */

.shop-cover{
    height:190px;
    border-radius:17px;
    background:
        linear-gradient(135deg,#29143f,#101010);
    background-size:cover;
    background-position:center;
    border:1px solid var(--border);
    display:flex;
    align-items:end;
    padding:20px;
    margin-bottom:15px;
}

.shop-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.shop-item{
    background:#111;
    border:1px solid var(--border);
    border-radius:15px;
    padding:15px;
}

.shop-type{
    color:var(--purple);
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
}

.shop-item h3{
    margin:7px 0;
}

.shop-item p{
    color:#888;
    font-size:13px;
    min-height:38px;
}

/* REELS */

.reel{
    max-width:650px;
    margin:auto;
    background:#111;
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
    margin-bottom:20px;
}

.reel video{
    width:100%;
    max-height:720px;
    background:#000;
    display:block;
}

.reel-info{
    padding:15px;
}

/* MESSAGES */

.messages-layout{
    display:grid;
    grid-template-columns:300px 1fr;
    height:650px;
    border:1px solid var(--border);
    border-radius:17px;
    overflow:hidden;
    background:#101010;
}

.conversations{
    border-right:1px solid var(--border);
    overflow:auto;
}

.conversation{
    padding:13px;
    border-bottom:1px solid #222;
    cursor:pointer;
}

.conversation:hover,
.conversation.active{
    background:#1b1425;
}

.chat{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chat-head{
    padding:13px;
    border-bottom:1px solid var(--border);
}

.chat-messages{
    flex:1;
    overflow:auto;
    padding:15px;
}

.message{
    max-width:75%;
    margin-bottom:9px;
    padding:10px 12px;
    border-radius:14px;
    background:#202020;
    width:max-content;
}

.message.mine{
    margin-left:auto;
    background:#5b21b6;
}

.message-time{
    display:block;
    color:#aaa;
    font-size:9px;
    margin-top:3px;
}

.chat-input{
    display:flex;
    gap:7px;
    padding:12px;
    border-top:1px solid var(--border);
}

.chat-input input{
    flex:1;
    background:#0b0b0b;
    color:#fff;
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px;
}

/* SETTINGS */

.settings-list{
    display:grid;
    gap:8px;
}

.setting{
    padding:16px;
    border:1px solid var(--border);
    border-radius:13px;
    background:#111;
}

.setting h3{
    margin-bottom:5px;
}

.setting p{
    color:#777;
    font-size:13px;
    margin-bottom:12px;
}

/* PLAYER */

.player{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    height:76px;
    z-index:120;
    background:rgba(12,12,12,.97);
    backdrop-filter:blur(15px);
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 16px;
}

.player-cover{
    width:52px;
    height:52px;
    border-radius:9px;
    object-fit:cover;
    background:#222;
}

.player-info{
    width:180px;
    min-width:100px;
}

.player-title{
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-artist{
    font-size:11px;
    color:#777;
}

.player-main{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
}

.player-progress{
    flex:1;
}

.player-progress input{
    width:100%;
}

.player-buttons{
    display:flex;
    gap:5px;
}

.player button{
    background:#171717;
    color:#fff;
    border:1px solid var(--border);
    width:36px;
    height:36px;
    border-radius:9px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.75);
    z-index:200;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow:auto;
    background:#111;
    border:1px solid #333;
    border-radius:18px;
    padding:20px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

/* SEARCH RESULTS */

.search-results{
    position:absolute;
    top:50px;
    left:0;
    right:0;
    background:#111;
    border:1px solid #333;
    border-radius:13px;
    max-height:450px;
    overflow:auto;
    z-index:150;
    box-shadow:0 20px 50px #000;
}

.search-result{
    padding:11px;
    border-bottom:1px solid #222;
    cursor:pointer;
}

.search-result:hover{
    background:#1b1425;
}

/* TOAST */

#toastBox{
    position:fixed;
    right:20px;
    bottom:95px;
    z-index:500;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.toast{
    padding:12px 15px;
    background:#171717;
    border:1px solid #333;
    border-radius:10px;
    box-shadow:0 10px 30px #000;
    max-width:330px;
}

/* MOBILE */

@media(max-width:850px){
    .sidebar{
        position:fixed;
        bottom:0;
        left:0;
        right:0;
        top:auto;
        width:100%;
        height:63px;
        z-index:110;
        border-right:0;
        border-top:1px solid var(--border);
        padding:5px;
        display:flex;
        overflow-x:auto;
        background:#0a0a0a;
    }

    .nav-group{
        display:flex;
        margin:0;
    }

    .nav-title{
        display:none;
    }

    .nav-btn{
        width:auto;
        min-width:max-content;
        margin:0;
        padding:10px 12px;
        text-align:center;
    }

    .main{
        padding:17px;
        padding-bottom:95px;
    }

    .topbar{
        padding:0 10px;
    }

    .logo{
        font-size:17px;
    }

    .search-box{
        display:none;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .shop-grid{
        grid-template-columns:1fr;
    }

    .messages-layout{
        grid-template-columns:1fr;
        height:650px;
    }

    .conversations{
        display:none;
    }

    .player{
        bottom:63px;
    }

    .profile-info{
        align-items:center;
        flex-direction:column;
        text-align:center;
        margin-top:-45px;
    }

    .stats{
        justify-content:center;
    }

    .song-card{
        align-items:flex-start;
    }

    .song-actions{
        margin-top:8px;
    }

    .top-actions .hide-mobile{
        display:none;
    }
}
</style>
</head>

<body>

<!-- AUTH -->

<div id="authScreen">

    <div class="auth-box">

        <div class="auth-logo">
            MYM <span>SOUND</span>
        </div>

        <div class="auth-sub">
            Müzik, sanatçı ve prodüksiyon platformu
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="loginTab" onclick="showLogin()">
                Giriş Yap
            </button>

            <button class="auth-tab" id="registerTab" onclick="showRegister()">
                Kayıt Ol
            </button>
        </div>

        <form id="loginForm" class="auth-form" onsubmit="event.preventDefault();loginUser();">

            <input id="loginUsername"
                   placeholder="Kullanıcı adı"
                   autocomplete="username">

            <input id="loginPassword"
                   type="password"
                   placeholder="Şifre"
                   autocomplete="current-password">

            <button class="auth-button">
                Giriş Yap
            </button>

        </form>

        <form id="registerForm"
              class="auth-form hidden"
              onsubmit="event.preventDefault();registerUser();">

            <input id="registerName"
                   placeholder="Ad Soyad"
                   maxlength="40">

            <input id="registerUsername"
                   placeholder="Kullanıcı adı"
                   maxlength="24">

            <input id="registerPassword"
                   type="password"
                   placeholder="Şifre">

            <input id="registerPassword2"
                   type="password"
                   placeholder="Şifre tekrar">

            <select id="registerRole">
                <option value="Dinleyici">Dinleyici</option>
                <option value="Sanatçı">Sanatçı</option>
                <option value="Beat Maker">Beat Maker</option>
                <option value="Mix Engineer">Mix Engineer</option>
                <option value="Prodüktör">Prodüktör</option>
            </select>

            <button class="auth-button">
                Hesap Oluştur
            </button>

        </form>

        <div class="auth-note">
            Hesap bilgileri bu demo sürümünde yalnızca bu tarayıcıda saklanır.
        </div>

    </div>

</div>


<!-- APP -->

<div id="app" class="app hidden">

    <header class="topbar">

        <div class="logo">
            MYM <span>SOUND</span>
        </div>

        <div class="search-box">

            <input id="globalSearch"
                   placeholder="Kullanıcı, şarkı, gönderi ara..."
                   oninput="globalSearch(this.value)">

            <div id="searchResults" class="search-results hidden"></div>

        </div>

        <div class="top-actions">

            <button class="icon-btn"
                    title="Bildirimler"
                    onclick="showPage('notifications')">
                N
                <span id="notificationBadge" class="badge-count hidden">0</span>
            </button>

<script>

/* =========================================================
   DATABASE / STORAGE
========================================================= */

const LS = {
    users:"mym_users",
    posts:"mym_posts",
    reels:"mym_reels",
    songs:"mym_songs",
    comments:"mym_comments",
    shop:"mym_shop_items",
    messages:"mym_messages",
    activity:"mym_activity",
    notifications:"mym_notifications",
    history:"mym_listening_history",
    current:"mym_current_user"
};

function load(key, fallback=[]){
    try{
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
    }catch(e){
        return fallback;
    }
}

function save(key,value){
    localStorage.setItem(key,JSON.stringify(value));
}

function uid(prefix="id"){
    return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9);
}

let state = {
    page:"home",
    feed:"all",
    create:"post",
    channelUserId:null,
    channelTab:"general",
    currentChatUserId:null,
    search:"",
    songQueue:[],
    queueIndex:0,
    currentSongId:null,
    shuffle:false,
    repeat:false
};


/* =========================================================
   INDEXED DB
========================================================= */

let db;

function openDB(){

    return new Promise((resolve,reject)=>{

        const request = indexedDB.open("mym_sound_media",1);

        request.onupgradeneeded = e => {

            const database = e.target.result;

            if(!database.objectStoreNames.contains("media")){
                database.createObjectStore("media");
            }

        };

        request.onsuccess = e => {
            db = e.target.result;
            resolve();
        };

        request.onerror = reject;

    });

}

function putMedia(blob,id=uid("media")){

    return new Promise((resolve,reject)=>{

        if(!db){
            reject("DB hazır değil");
            return;
        }

        const tx = db.transaction("media","readwrite");
        tx.objectStore("media").put(blob,id);

        tx.oncomplete = () => resolve(id);
        tx.onerror = reject;

    });

}

function getMedia(id){

    return new Promise((resolve,reject)=>{

        if(!id){
            resolve(null);
            return;
        }

        const tx = db.transaction("media","readonly");
        const req = tx.objectStore("media").get(id);

        req.onsuccess = () => resolve(req.result || null);
        req.onerror = reject;

    });

}

function deleteMedia(id){

    return new Promise((resolve,reject)=>{

        if(!id){
            resolve();
            return;
        }

        const tx = db.transaction("media","readwrite");
        tx.objectStore("media").delete(id);

        tx.oncomplete = resolve;
        tx.onerror = reject;

    });

}

async function mediaURL(id){

    const blob = await getMedia(id);

    if(!blob) return "";

    return URL.createObjectURL(blob);

}


/* =========================================================
   USERS
========================================================= */

function users(){
    return load(LS.users,[]);
}

function getUser(id){
    return users().find(u=>u.id===id);
}

function updateUser(user){

    const list = users();
    const index = list.findIndex(u=>u.id===user.id);

    if(index >= 0){
        list[index] = user;
        save(LS.users,list);
    }

}

function me(){

    const id = localStorage.getItem(LS.current);

    if(!id) return null;

    return getUser(id);

}

function getCurrentUser(){
    return me();
}

function initials(name="U"){

    return name
        .split(" ")
        .filter(Boolean)
        .slice(0,2)
        .map(x=>x[0])
        .join("")
        .toUpperCase();

}

function avatarHTML(user,size=""){

    if(!user){
        return `<div class="avatar ${size}">?</div>`;
    }

    const inner = user.avatarMediaId
        ? `<img data-avatar="${user.avatarMediaId}" alt="">`
        : initials(user.name);

    return `<div class="avatar ${size}">${inner}</div>`;

}

async function hydrateImages(){

    const images = document.querySelectorAll("[data-avatar],[data-media-image]");

    for(const img of images){

        const id = img.dataset.avatar || img.dataset.mediaImage;

        try{

            const url = await mediaURL(id);

            if(url){
                img.src = url;
            }

        }catch(e){}

    }

}

function isBlocked(userId){

    const a = me();
    const b = getUser(userId);

    if(!a || !b) return false;

    return (
        (a.blockedUsers || []).includes(userId) ||
        (b.blockedUsers || []).includes(a.id)
    );

}

function isFollowing(userId){

    const u = me();

    return !!(
        u &&
        (u.following || []).includes(userId)
    );

}


/* =========================================================
   ACTIVITY / NOTIFICATION
========================================================= */

function addActivity(type,text,meta={}){

    const list = load(LS.activity,[]);

    list.unshift({
        id:uid("act"),
        userId:me()?.id,
        type,
        text,
        meta,
        createdAt:Date.now()
    });

    save(LS.activity,list.slice(0,1000));

}

function addNotification(userId,type,text,meta={}){

    const list = load(LS.notifications,[]);

    list.unshift({
        id:uid("not"),
        userId,
        type,
        text,
        meta,
        read:false,
        createdAt:Date.now()
    });

    save(LS.notifications,list.slice(0,1000));

    updateBadges();

}


/* =========================================================
   TOAST
========================================================= */

function toast(text){

    const box = document.getElementById("toastBox");

    const el = document.createElement("div");

    el.className = "toast";
    el.textContent = text;

    box.appendChild(el);

    setTimeout(()=>{
        el.remove();
    },3000);

}


/* =========================================================
   AUTH
========================================================= */

function showLogin(){

    document.getElementById("loginForm").classList.remove("hidden");
    document.getElementById("registerForm").classList.add("hidden");

    document.getElementById("loginTab").classList.add("active");
    document.getElementById("registerTab").classList.remove("active");

}

function showRegister(){

    document.getElementById("loginForm").classList.add("hidden");
    document.getElementById("registerForm").classList.remove("hidden");

    document.getElementById("loginTab").classList.remove("active");
    document.getElementById("registerTab").classList.add("active");

}

function showAuth(){

    document.getElementById("authScreen").classList.remove("hidden");
    document.getElementById("app").classList.add("hidden");

}

function hideAuth(){

    document.getElementById("authScreen").classList.add("hidden");
    document.getElementById("app").classList.remove("hidden");

}

function registerUser(){

    const name = document.getElementById("registerName").value.trim();
    const username = document.getElementById("registerUsername").value.trim();
    const password = document.getElementById("registerPassword").value;
    const password2 = document.getElementById("registerPassword2").value;
    const role = document.getElementById("registerRole").value;

    if(name.length < 2){
        toast("Ad soyad en az 2 karakter olmalı");
        return;
    }

    if(!/^[a-zA-Z0-9_.-]{3,24}$/.test(username)){
        toast("Kullanıcı adı 3-24 karakter olmalı");
        return;
    }

    if(password.length < 6){
        toast("Şifre en az 6 karakter olmalı");
        return;
    }

    if(password !== password2){
        toast("Şifreler aynı değil");
        return;
    }

    const list = users();

    if(list.some(u=>u.username.toLowerCase()===username.toLowerCase())){
        toast("Bu kullanıcı adı zaten kullanılıyor");
        return;
    }

    const user = {
        id:uid("user"),
        name,
        username,
        password,
        role,
        plan:"free",
        avatarMediaId:null,
        profileBackgroundMediaId:null,
        shopBackgroundMediaId:null,
        bio:"",
        followers:[],
        following:[],
        blockedUsers:[],
        nameChanges:[],
        archive:[],
        likedSongs:[],
        favoritePosts:[],
        online:true,
        lastSeen:Date.now(),
        settings:{
            notifications:true,
            autoplay:false
        }
    };

    list.push(user);

    save(LS.users,list);

    localStorage.setItem(LS.current,user.id);

    addActivity("register","Hesap oluşturuldu");

    hideAuth();
    render();

    toast("Hesabın oluşturuldu");

}

function loginUser(){

    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;

    const user = users().find(
        u =>
            u.username.toLowerCase()===username.toLowerCase() &&
            u.password===password
    );

    if(!user){
        toast("Kullanıcı adı veya şifre yanlış");
        return;
    }

    user.online = true;
    user.lastSeen = Date.now();

    updateUser(user);

    localStorage.setItem(LS.current,user.id);

    addActivity("login","Giriş yapıldı");

    hideAuth();
    render();

}

function logout(){

    const user = me();

    if(user){

        user.online = false;
        user.lastSeen = Date.now();

        updateUser(user);

    }

    localStorage.removeItem(LS.current);

    state.currentChatUserId = null;

    showAuth();

}


/* =========================================================
   FOLLOW
========================================================= */

function toggleFollow(userId){

    const current = me();
    const target = getUser(userId);

    if(!current || !target) return;

    if(current.id===userId){
        toast("Kendini takip edemezsin");
        return;
    }

    if(isBlocked(userId)){
        toast("Engellenen kullanıcıyla takip işlemi yapılamaz");
        return;
    }

    current.following = current.following || [];
    target.followers = target.followers || [];

    const following = current.following.includes(userId);

    if(following){

        current.following =
            current.following.filter(id=>id!==userId);

        target.followers =
            target.followers.filter(id=>id!==current.id);

        addActivity(
            "unfollow",
            `${target.name} takipten çıkarıldı`
        );

    }else{

        current.following.push(userId);

        if(!target.followers.includes(current.id)){
            target.followers.push(current.id);
        }

        addActivity(
            "follow",
            `${target.name} takip edildi`
        );

        addNotification(
            userId,
            "follow",
            `${current.name} seni takip etmeye başladı`,
            {fromId:current.id}
        );

    }

    updateUser(current);
    updateUser(target);

    render();

}


/* =========================================================
   BLOCK
========================================================= */

function toggleBlock(userId){

    const current = me();
    const target = getUser(userId);

    if(!current || !target) return;

    current.blockedUsers = current.blockedUsers || [];

    const blocked = current.blockedUsers.includes(userId);

    if(blocked){

        current.blockedUsers =
            current.blockedUsers.filter(id=>id!==userId);

        addActivity(
            "unblock",
            `${target.name} engeli kaldırıldı`
        );

        toast("Engel kaldırıldı");

    }else{

        current.blockedUsers.push(userId);

        current.following =
            (current.following||[]).filter(id=>id!==userId);

        target.following =
            (target.following||[]).filter(id=>id!==current.id);

        target.followers =
            (target.followers||[]).filter(id=>id!==current.id);

        current.followers =
            (current.followers||[]).filter(id=>id!==userId);

        updateUser(target);

        addActivity(
            "block",
            `${target.name} engellendi`
        );

        toast("Kullanıcı engellendi");

    }

    updateUser(current);

    if(state.currentChatUserId===userId){
        state.currentChatUserId=null;
    }

    render();

}


/* =========================================================
   MESSAGES
========================================================= */

function sendMessage(){

    const input = document.getElementById("messageInput");

    if(!input) return;

    const text = input.value.trim();
    const toId = state.currentChatUserId;

    if(!text || !toId) return;

    const current = me();
    const target = getUser(toId);

    if(!current || !target) return;

    if(current.id===toId){
        toast("Kendine mesaj gönderemezsin");
        return;
    }

    if(isBlocked(toId)){
        toast("Bu kullanıcıyla mesajlaşamazsın");
        return;
    }

    const list = load(LS.messages,[]);

    list.push({
        id:uid("msg"),
        fromId:current.id,
        toId,
        text,
        createdAt:Date.now(),
        read:false
    });

    save(LS.messages,list);

    addActivity(
        "message",
        `${target.name} kişisine mesaj gönderildi`
    );

    addNotification(
        toId,
        "message",
        `${current.name} sana mesaj gönderdi`,
        {fromId:current.id}
    );

    input.value="";

    renderMessages();

}

function openChat(userId){

    if(!getUser(userId)) return;

    if(isBlocked(userId)){
        toast("Bu kullanıcıyla mesajlaşamazsın");
        return;
    }

    state.currentChatUserId=userId;

    showPage("messages");

}

function getConversationMessages(userId){

    const current = me();

    return load(LS.messages,[]).filter(
        m =>
            (
                m.fromId===current.id &&
                m.toId===userId
            ) ||
            (
                m.fromId===userId &&
                m.toId===current.id
            )
    );

}

function markChatRead(userId){

    const current = me();

    const list = load(LS.messages,[]);

    let changed=false;

    list.forEach(m=>{

        if(
            m.toId===current.id &&
            m.fromId===userId &&
            !m.read
        ){
            m.read=true;
            changed=true;
        }

    });

    if(changed){
        save(LS.messages,list);
    }

}

function renderMessages(){

    const main = document.getElementById("main");

    const current = me();

    if(!current) return;

    const allMessages = load(LS.messages,[]);

    const peopleIds = new Set();

    allMessages.forEach(m=>{

        if(m.fromId===current.id) peopleIds.add(m.toId);
        if(m.toId===current.id) peopleIds.add(m.fromId);

    });

    const people = [...peopleIds]
        .map(id=>getUser(id))
        .filter(Boolean)
        .filter(u=>!isBlocked(u.id));

    const chatUser = state.currentChatUserId
        ? getUser(state.currentChatUserId)
        : null;

    if(chatUser && !isBlocked(chatUser.id)){
        markChatRead(chatUser.id);
    }

    main.innerHTML = `

        <div class="page-title">
            Mesajlar
        </div>

        <div class="messages-layout">

            <div class="conversations">

                <div style="padding:12px">
                    <input
                        class="form-input"
                        placeholder="Konuşma ara..."
                        oninput="filterConversations(this.value)">
                </div>

                <div id="conversationList">

                    ${
                        people.length
                        ? people.map(u=>`

                            <div
                                class="conversation ${chatUser?.id===u.id?"active":""}"
                                data-conversation-name="${escapeHTML(u.name)}"
                                onclick="openChat('${u.id}')">

                                <div class="row">

                                    ${avatarHTML(u,"small")}

                                    <div>
                                        <b>${escapeHTML(u.name)}</b>
                                        <div class="small muted">
                                            @${escapeHTML(u.username)}
                                        </div>
                                    </div>

                                </div>

                            </div>

                        `).join("")
                        : `<div class="empty">Henüz mesaj yok.</div>`
                    }

                </div>

            </div>


            <div class="chat">

                ${
                    chatUser
                    ? renderChatHTML(chatUser)
                    : `
                        <div class="empty" style="margin:auto">
                            Mesajlaşmak için Kişiler bölümünden bir kullanıcı seç.
                        </div>
                    `
                }

            </div>

        </div>

    `;

    hydrateImages();

}

function renderChatHTML(chatUser){

    const current = me();

    const messages = getConversationMessages(chatUser.id);

    return `

        <div class="chat-head">

            <div class="row between">

                <div class="row">

                    ${avatarHTML(chatUser,"small")}

                    <div>

                        <b>${escapeHTML(chatUser.name)}</b>

                        <div class="small muted">
                            @${escapeHTML(chatUser.username)}
                        </div>

                    </div>

                </div>

                <button
                    class="btn btn-small"
                    onclick="openChannel('${chatUser.id}')">
                    Kanal
                </button>

            </div>

        </div>


        <div id="chatMessages" class="chat-messages">

            ${
                messages.length
                ? messages.map(m=>`

                    <div class="message ${m.fromId===current.id?"mine":""}">

                        ${escapeHTML(m.text)}

                        <span class="message-time">
                            ${formatDate(m.createdAt)}
                        </span>

                    </div>

                `).join("")
                : `<div class="empty">Henüz mesaj yok.</div>`
            }

        </div>


        <form
            class="chat-input"
            onsubmit="event.preventDefault();sendMessage();">

            <input
                id="messageInput"
                placeholder="Mesaj yaz..."
                autocomplete="off">

            <button class="btn btn-primary">
                Gönder
            </button>

        </form>

    `;

}

function filterConversations(value){

    document
        .querySelectorAll(".conversation")
        .forEach(el=>{

            const name =
                (el.dataset.conversationName||"").toLowerCase();

            el.style.display =
                name.includes(value.toLowerCase())
                ? ""
                : "none";

        });

}


/* =========================================================
   POSTS
========================================================= */

function posts(){
    return load(LS.posts,[]);
}

async function createPost(){

    const text =
        document.getElementById("postText")?.value.trim() || "";

    const file =
        document.getElementById("postMedia")?.files?.[0];

    if(!text && !file){
        toast("Gönderi için yazı veya medya ekle");
        return;
    }

    let mediaId=null;

    if(file){
        mediaId=await putMedia(file);
    }

    const list=posts();

    list.unshift({
        id:uid("post"),
        userId:me().id,
        text,
        mediaId,
        mediaType:file ? file.type : null,
        createdAt:Date.now(),
        likes:[]
    });

    save(LS.posts,list);

    addActivity("post","Yeni gönderi oluşturuldu");

    toast("Gönderi paylaşıldı");

    showPage("home");

}

function togglePostLike(postId){

    const current=me();

    const list=posts();
    const post=list.find(p=>p.id===postId);

    if(!post || isBlocked(post.userId)) return;

    post.likes=post.likes||[];

    if(post.likes.includes(current.id)){

        post.likes=post.likes.filter(id=>id!==current.id);

    }else{

        post.likes.push(current.id);

        if(post.userId!==current.id){

            addNotification(
                post.userId,
                "like",
                `${current.name} gönderini beğendi`,
                {postId}
            );

        }

    }

    save(LS.posts,list);

    render();

}

function addComment(postId,inputId){

    const input=document.getElementById(inputId);

    if(!input) return;

    const text=input.value.trim();

    if(!text) return;

    const post=posts().find(p=>p.id===postId);

    if(!post || isBlocked(post.userId)) return;

    const list=load(LS.comments,[]);

    list.push({
        id:uid("comment"),
        postId,
        userId:me().id,
        text,
        createdAt:Date.now()
    });

    save(LS.comments,list);

    if(post.userId!==me().id){

        addNotification(
            post.userId,
            "comment",
            `${me().name} gönderine yorum yaptı`,
            {postId}
        );

    }

    input.value="";

    render();

}

function deletePost(postId){

    const current=me();

    const list=posts();

    const post=list.find(p=>p.id===postId);

    if(!post || post.userId!==current.id) return;

    save(
        LS.posts,
        list.filter(p=>p.id!==postId)
    );

    const comments=load(LS.comments,[]);

    save(
        LS.comments,
        comments.filter(c=>c.postId!==postId)
    );

    addActivity("delete_post","Gönderi silindi");

    render();

}

function archivePost(postId){

    const current=me();

    const post=posts().find(p=>p.id===postId);

    if(!post || post.userId!==current.id) return;

    current.archive=current.archive||[];

    if(!current.archive.includes(postId)){
        current.archive.push(postId);
    }

    updateUser(current);

    addActivity("archive","Gönderi arşivlendi");

    render();

}

   SONGS

function songs(){
    return load(LS.songs,[]);
}

async function createSong(){

    const name =
        document.getElementById("songName")?.value.trim();

    const description =
        document.getElementById("songDescription")?.value.trim() || "";

    const cover =
        document.getElementById("songCover")?.files?.[0];

    const audio =
        document.getElementById("songAudio")?.files?.[0];

    if(!name){
        toast("Şarkı adı zorunlu");
        return;
    }

    if(!cover){
        toast("Kapak resmi zorunlu");
        return;
    }

    if(!audio){
        toast("Ses dosyası zorunlu");
        return;
    }

    const coverMediaId=await putMedia(cover);
    const mediaId=await putMedia(audio);

    const list=songs();

    list.unshift({
        id:uid("song"),
        userId:me().id,
        name,
        description,
        coverMediaId,
        mediaId,
        createdAt:Date.now(),
        likes:[],
        plays:0
    });

    save(LS.songs,list);

    addActivity(
        "song",
        `"${name}" şarkısı yüklendi`
    );

    toast("Şarkı eklendi");

    showPage("home");

}

function toggleSongLike(songId){

    const current=me();

    const list=songs();
    const song=list.find(s=>s.id===songId);

    if(!song || isBlocked(song.userId)) return;

    song.likes=song.likes||[];

    if(song.likes.includes(current.id)){

        song.likes =
            song.likes.filter(id=>id!==current.id);

        current.likedSongs =
            (current.likedSongs||[]).filter(id=>id!==songId);

    }else{

        song.likes.push(current.id);

        current.likedSongs =
            current.likedSongs||[];

        if(!current.likedSongs.includes(songId)){
            current.likedSongs.push(songId);
        }

    }

    save(LS.songs,list);
    updateUser(current);

    render();

}

function deleteSong(songId){

    const current=me();

    const list=songs();
    const song=list.find(s=>s.id===songId);

    if(!song || song.userId!==current.id) return;

    save(
        LS.songs,
        list.filter(s=>s.id!==songId)
    );

    deleteMedia(song.coverMediaId).catch(()=>{});
    deleteMedia(song.mediaId).catch(()=>{});

    addActivity("delete_song","Şarkı silindi");

    if(state.currentSongId===songId){
        stopPlayer();
    }

    render();

}


/* =========================================================
   PLAYER
========================================================= */

const audio=document.getElementById("globalAudio");

audio.addEventListener("timeupdate",()=>{

    if(!audio.duration) return;

    const range=document.getElementById("playerRange");

    if(range){
        range.value=(audio.currentTime/audio.duration)*100;
    }

});

audio.addEventListener("ended",()=>{

    if(state.repeat){

        audio.currentTime=0;
        audio.play();

    }else{

        nextSong();

    }

});

async function playSong(songId){

    const song=songs().find(s=>s.id===songId);

    if(!song || isBlocked(song.userId)) return;

    const artist=getUser(song.userId);

    state.currentSongId=songId;

    const queue=songs()
        .filter(s=>!isBlocked(s.userId))
        .sort((a,b)=>b.createdAt-a.createdAt);

    state.songQueue=queue;

    state.queueIndex=Math.max(
        0,
        queue.findIndex(s=>s.id===songId)
    );

    const blob=await getMedia(song.mediaId);

    if(!blob){
        toast("Ses dosyası bulunamadı");
        return;
    }

    audio.src=URL.createObjectURL(blob);

    document.getElementById("playerTitle").textContent=song.name;
    document.getElementById("playerArtist").textContent=
        artist ? artist.name : "";

    const cover=document.getElementById("playerCover");

    const url=await mediaURL(song.coverMediaId);

    cover.src=url || "";

    document.getElementById("player").classList.remove("hidden");

    try{
        await audio.play();
        document.getElementById("playerPlay").textContent="||";
    }catch(e){
        document.getElementById("playerPlay").textContent=">";
    }

    song.plays=(song.plays||0)+1;

    save(LS.songs,songs());

    const history=load(LS.history,[]);

    history.unshift({
        id:uid("history"),
        userId:me().id,
        songId,
        createdAt:Date.now()
    });

    save(LS.history,history.slice(0,500));

}

function togglePlayer(){

    if(!audio.src){
        return;
    }

    if(audio.paused){

        audio.play();

        document.getElementById("playerPlay").textContent="||";

    }else{

        audio.pause();

        document.getElementById("playerPlay").textContent=">";

    }

}

function stopPlayer(){

    audio.pause();
    audio.removeAttribute("src");
    state.currentSongId=null;

    document.getElementById("player").classList.add("hidden");

}

function seekPlayer(value){

    if(audio.duration){
        audio.currentTime =
            (value/100)*audio.duration;
    }

}

function nextSong(){

    if(!state.songQueue.length){
        return;
    }

    if(state.shuffle){

        state.queueIndex =
            Math.floor(
                Math.random()*state.songQueue.length
            );

    }else{

        state.queueIndex++;

        if(state.queueIndex>=state.songQueue.length){

            state.queueIndex=0;

        }

    }

    playSong(
        state.songQueue[state.queueIndex].id
    );

}

function previousSong(){

    if(!state.songQueue.length){
        return;
    }

    state.queueIndex--;

    if(state.queueIndex<0){
        state.queueIndex=state.songQueue.length-1;
    }

    playSong(
        state.songQueue[state.queueIndex].id
    );

}

function toggleShuffle(){

    state.shuffle=!state.shuffle;

    toast(
        state.shuffle
        ? "Karışık çalma açıldı"
        : "Karışık çalma kapatıldı"
    );

}

function toggleRepeat(){

    state.repeat=!state.repeat;

    toast(
        state.repeat
        ? "Tekrar açıldı"
        : "Tekrar kapatıldı"
    );

}

function shop(){

function shopCountForUser(userId){

    return shop().filter(
        x =>
            x.userId===userId &&
            (
                x.type==="Beat" ||
                x.type==="Mix"
            )
    ).length;

}

async function createShopItem(){

    const current=me();

    const type=
        document.getElementById("shopType").value;

    const name=
        document.getElementById("shopName").value.trim();

    const description=
        document.getElementById("shopDescription").value.trim();

    const audioFile=
        document.getElementById("shopAudio").files?.[0];

    if(!name){
        toast("Shop ürün adı zorunlu");
        return;
    }

    if(!audioFile){
        toast("Ses dosyası seç");
        return;
    }

    if(
        current.plan==="free" &&
        shopCountForUser(current.id)>=50 &&
        (
            type==="Beat" ||
            type==="Mix"
        )
    ){

        toast("Free hesapta Beat + Mix toplam limiti 50");
        return;

    }

    if(
        ![
            "Beat",
            "Mix",
            "Instrumental",
            "Diğer"
        ].includes(type)
    ){
        toast("Geçersiz Shop türü");
        return;
    }

    if(
        (type==="Beat" || type==="Mix") &&
        ![
            "Beat Maker",
            "Mix Engineer",
            "Prodüktör"
        ].includes(current.role)
    ){

        toast(
            "Bu Shop türünü yüklemek için uygun rolün yok"
        );

        return;

    }

    const mediaId=await putMedia(audioFile);

    const list=shop();

    list.unshift({
        id:uid("shop"),
        userId:current.id,
        type,
        name,
        description,
        mediaId,
        createdAt:Date.now(),
        plays:0
    });

    save(LS.shop,list);

    addActivity(
        "shop",
        `"${name}" Shop'a eklendi`
    );

    toast("Shop ürünü eklendi");

    showPage("shop");

}

/* =========================================================
   PROFILE
========================================================= */

function nameChangeAllowed(){

    const current=me();

    if(!current) return false;

    const week=7*24*60*60*1000;

    const now=Date.now();

    current.nameChanges =
        (current.nameChanges||[])
        .filter(t=>now-t<week);

    updateUser(current);

    return current.nameChanges.length<3;

}

async function saveProfile(){

    const current=me();

    const name=
        document.getElementById("profileName")
        ?.value.trim();

    const username=
        document.getElementById("profileUsername")
        ?.value.trim();

    const bio=
        document.getElementById("profileBio")
        ?.value.trim() || "";

    if(!name || !username){
        toast("Ad ve kullanıcı adı gerekli");
        return;
    }

    const identityChanged =
        name!==current.name ||
        username!==current.username;

    if(identityChanged){

        if(!nameChangeAllowed()){

            toast(
                "Ad/kullanıcı adı 7 günde en fazla 3 kez değiştirilebilir"
            );

            return;

        }

        const duplicate=users().find(
            u =>
                u.id!==current.id &&
                u.username.toLowerCase()===username.toLowerCase()
        );

        if(duplicate){
            toast("Bu kullanıcı adı alınmış");
            return;
        }

        current.nameChanges.push(Date.now());

    }

    current.name=name;
    current.username=username;
    current.bio=bio;

    const avatar=
        document.getElementById("profileAvatar")
        ?.files?.[0];

    const background=
        document.getElementById("profileBackground")
        ?.files?.[0];

    const shopBackground=
        document.getElementById("shopBackground")
        ?.files?.[0];

    if(avatar){

        if(current.avatarMediaId){
            deleteMedia(current.avatarMediaId).catch(()=>{});
        }

        current.avatarMediaId =
            await putMedia(avatar);

    }

    if(background){

        if(current.profileBackgroundMediaId){
            deleteMedia(
                current.profileBackgroundMediaId
            ).catch(()=>{});
        }

        current.profileBackgroundMediaId =
            await putMedia(background);

    }

    if(shopBackground){

        if(current.shopBackgroundMediaId){
            deleteMedia(
                current.shopBackgroundMediaId
            ).catch(()=>{});
        }

        current.shopBackgroundMediaId =
            await putMedia(shopBackground);

    }

    updateUser(current);

    addActivity(
        "profile",
        "Profil güncellendi"
    );

    toast("Profil kaydedildi");

    showPage("profile");

}

async function hydrateChannelBackground(){

    const el=document.getElementById("channelCover");

    if(!el) return;

    const id=el.dataset.bg;

    if(!id) return;

    const url=await mediaURL(id);

    if(url){
        el.style.backgroundImage=
            `url("${url}")`;
    }

}

function setChannelTab(tab){

    state.channelTab=tab;

    renderChannel();

}

function renderChannelContent(tab,user){

    const box=document.getElementById("channelContent");

    if(!box) return;

    if(tab==="posts"){

        box.innerHTML=
            posts()
            .filter(p=>p.userId===user.id)
            .map(renderPost)
            .join("") ||
            `<div class="empty">Gönderi yok.</div>`;

        hydrateImages();

        return;

    }

    if(tab==="songs"){

        box.innerHTML=
            songs()
            .filter(s=>s.userId===user.id)
            .map(renderSong)
            .join("") ||
            `<div class="empty">Şarkı yok.</div>`;

        hydrateSongCovers();

        return;

    }

    if(tab==="reels"){

            reels()
            .filter(r=>r.userId===user.id)
            .map(renderReel)
            .join("") ||
            `<div class="empty">Reels yok.</div>`;

                    .filter(s=>s.userId===user.id)
                    .map(renderShopItem)
                    .join("")
                    ||
                    `<div class="empty">Shop boş.</div>`

            .filter(p=>p.userId===user.id)
            .slice(0,3)

async function hydrateSongCovers(){

    const images=
        document.querySelectorAll("[data-song-cover]");

    for(const img of images){

        const url=
            await mediaURL(img.dataset.songCover);

        if(url){
            img.src=url;
        }

    }

}

async function hydratePostMedia(){

    const boxes=
        document.querySelectorAll("[data-post-media]");

    for(const box of boxes){

        const id=box.dataset.postMedia;
        const type=box.dataset.postType||"";

        const url=await mediaURL(id);

        if(!url) continue;

        if(type.startsWith("video")){

            box.innerHTML=`
                <video
                    class="post-media"
                    controls
                    src="${url}">
                </video>
            `;

        }else{

            box.innerHTML=`
                <img
                    class="post-media"
                    src="${url}"
                    alt="">
            `;

        }

    }

}

function renderReel(reel){

    const user=getUser(reel.userId);

    if(!user || isBlocked(reel.userId)) return "";

    const liked=(reel.likes||[]).includes(me().id);

    return `

        <div class="reel">

            <video
                controls
                data-reel-video="${reel.mediaId}">
            </video>

            <div class="reel-info">

                <div class="row">

                    ${avatarHTML(user,"small")}

                    <div>

                        <b>${escapeHTML(user.name)}</b>

                            @${escapeHTML(user.username)}
                        </div>

                    </div>

                </div>

                ${
                    reel.description
                    ? `
                        <p style="margin-top:12px">
                            ${escapeHTML(reel.description)}
                        </p>
                    `
                    : ""
                }

                <div class="post-actions">

                    <button
                        class="btn btn-small"
                        onclick="toggleReelLike('${reel.id}')">
                        ${liked?"Beğenildi":"Beğen"}
                        ${reel.likes?.length||0}
                    </button>

                    ${
                        reel.userId===me().id
                        ? `
                            <button
                                class="btn btn-danger btn-small"
                                onclick="deleteReel('${reel.id}')">
                                Sil

async function hydrateReelVideos(){

    const videos=
        document.querySelectorAll("[data-reel-video]");

    for(const video of videos){

        const blob=
            await getMedia(video.dataset.reelVideo);

        if(blob){
            video.src=URL.createObjectURL(blob);
        }

    }

}

function renderShopItem(item){

    const user=getUser(item.userId);

    if(!user || isBlocked(item.userId)) return "";

    return `

async function playShop(id){

    const item=shop().find(x=>x.id===id);

    if(!item) return;

    const blob=await getMedia(item.mediaId);

    if(!blob){
        toast("Ses dosyası bulunamadı");
        return;
    }

    const url=URL.createObjectURL(blob);

    audio.src=url;

    document.getElementById("playerTitle").textContent=item.name;

    const user=getUser(item.userId);

    document.getElementById("playerArtist").textContent=
        user?.name||"";

    document.getElementById("playerCover").src="";

    document.getElementById("player").classList.remove("hidden");

    audio.play();

    item.plays=(item.plays||0)+1;

    save(LS.shop,shop());

}

function toggleSetting(setting){

    const current=me();

    current.settings=current.settings||{};

    current.settings[setting]=
        !current.settings[setting];

    updateUser(current);

    render();

}

function exportData(){

    const data={};

    Object.keys(LS).forEach(key=>{
        data[key]=load(LS[key],[]);
    });

    const blob=new Blob(
        [JSON.stringify(data,null,2)],
        {type:"application/json"}
    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;
    a.download="mym-sound-backup.json";

    a.click();

    URL.revokeObjectURL(url);

}

function resetDemo(){

    const ok=confirm(
        "Tüm MYM SOUND demo verileri silinsin mi?"
    );

    if(!ok) return;

    Object.values(LS).forEach(key=>{
        localStorage.removeItem(key);
    });

    indexedDB.deleteDatabase("mym_sound_media");

    location.reload();

}

/* =========================================================
   SEARCH
========================================================= */

function globalSearch(value){

    state.search=value;

    const box=document.getElementById("searchResults");

    if(!value.trim()){

        box.classList.add("hidden");
        box.innerHTML="";

        return;

    }

    const q=value.toLowerCase();

    const foundUsers=
        users()
        .filter(u=>!isBlocked(u.id))
        .filter(
            u =>
                u.name.toLowerCase().includes(q) ||
                u.username.toLowerCase().includes(q)
        )
        .slice(0,5);

    const foundSongs=
        songs()
        .filter(s=>!isBlocked(s.userId))
        .filter(
            s =>
                s.name.toLowerCase().includes(q) ||
                (s.description||"").toLowerCase().includes(q)
        )
        .slice(0,5);

    const foundPosts=
        posts()
        .filter(p=>!isBlocked(p.userId))
        .filter(
            p =>
                (p.text||"").toLowerCase().includes(q)
        )
        .slice(0,5);

    box.innerHTML=`

        ${
            foundUsers.length
            ? `
                <div class="small muted" style="padding:10px">
                    Kullanıcılar
                </div>

                ${foundUsers.map(u=>`

                    <div
                        class="search-result"
                        onclick="openChannel('${u.id}');closeSearch()">

                        <div class="row">

                            ${avatarHTML(u,"small")}

                            <div>
                                <b>${escapeHTML(u.name)}</b>

                                <div class="small muted">
                                    @${escapeHTML(u.username)}
                                </div>
                            </div>

                        </div>

                    </div>

                `).join("")}
            `
            : ""
        }


        ${
            foundSongs.length
            ? `
                <div class="small muted" style="padding:10px">
                    Şarkılar
                </div>

                ${foundSongs.map(s=>`

                    <div
                        class="search-result"
                        onclick="playSong('${s.id}');closeSearch()">

                        <b>${escapeHTML(s.name)}</b>

                        <div class="small muted">
                            Şarkı
                        </div>

                    </div>

                `).join("")}
            `
            : ""
        }


        ${
            foundPosts.length
            ? `
                <div class="small muted" style="padding:10px">
                    Gönderiler
                </div>

                ${foundPosts.map(p=>`

                    <div
                        class="search-result"
                        onclick="showPage('home');closeSearch()">

                        ${escapeHTML(
                            (p.text||"Gönderi").slice(0,100)
                        )}

                    </div>

                `).join("")}
            `
            : ""
        }


        ${
            !foundUsers.length &&
            !foundSongs.length &&
            !foundPosts.length
            ? `<div class="empty">Sonuç bulunamadı.</div>`
            : ""
        }

    `;

    box.classList.remove("hidden");

    hydrateImages();

}

function closeSearch(){

    document
        .getElementById("searchResults")
        .classList.add("hidden");

}

function sharePost(postId){

    const post=posts().find(p=>p.id===postId);

    if(!post) return;

    addActivity(
        "share",
        "Bir gönderi paylaşıldı",
        {postId}
    );

    if(navigator.clipboard){

        navigator.clipboard.writeText(
            location.href+"#post-"+postId
        ).catch(()=>{});

    }

    toast("Gönderi bağlantısı kopyalandı");

}


/* =========================================================
   PAGE ROUTER
========================================================= */

function showPage(page){

    if(!me()){
        showAuth();
        return;
    }

    state.page=page;

    document
        .querySelectorAll(".nav-btn")
        .forEach(btn=>{
            btn.classList.toggle(
                "active",
                btn.dataset.page===page
            );
        });

    if(page==="home"){
        renderHome();
        return;
    }

    if(page==="reels"){
        renderReels();
        return;
    }

    if(page==="channels"){
        renderChannels();
        return;
    }

    if(page==="channel"){
        renderChannel();
        return;
    }

    if(page==="shop"){
        renderShop();
        return;
    }

    if(page==="people"){
        renderPeople();
        return;
    }

    if(page==="messages"){
        renderMessages();
        scrollChatBottom();
        return;
    }

    if(page==="profile"){
        renderProfile();
        return;
    }

    if(page==="settings"){
        renderSettings();
        return;
    }

    if(page==="activity"){
        renderActivity();
        return;
    }

    if(page==="archive"){
        renderArchive();
        return;
    }

    if(page==="blocked"){
        renderBlocked();
        return;
    }

    if(page==="notifications"){
        renderNotifications();
        return;
    }

}

function render(){

    if(!me()){

        showAuth();
        return;

    }

    hideAuth();

    showPage(state.page);

    updateBadges();

}

function renderMessagesPage(){
    showPage("messages");
}


/* =========================================================
   BADGES
========================================================= */

function updateBadges(){

    const current=me();

    if(!current) return;

    const notifications=
        load(LS.notifications,[])
        .filter(
            n =>
                n.userId===current.id &&
                !n.read
        );

    const messages=
        load(LS.messages,[])
        .filter(
            m =>
                m.toId===current.id &&
                !m.read
        );

    const nb=document.getElementById("notificationBadge");
    const mb=document.getElementById("messageBadge");

    if(notifications.length){

        nb.textContent=
            notifications.length>99
            ? "99+"
            : notifications.length;

        nb.classList.remove("hidden");

    }else{

        nb.classList.add("hidden");

    }

    if(messages.length){

        mb.textContent=
            messages.length>99
            ? "99+"
            : messages.length;

        mb.classList.remove("hidden");

    }else{

        mb.classList.add("hidden");

    }

}


/* =========================================================
   EVENT DELEGATION
   FOLLOW / MESSAGE / BLOCK
========================================================= */

document.addEventListener("click",event=>{

    const follow=event.target.closest("[data-follow-id]");

    if(follow){

        toggleFollow(
            follow.dataset.followId
        );

        return;

    }

    const message=event.target.closest("[data-message-id]");

    if(message){

        openChat(
            message.dataset.messageId
        );

        return;

    }

    const block=event.target.closest("[data-block-id]");

    if(block){

        toggleBlock(
            block.dataset.blockId
        );

        return;

    }

});


/* =========================================================
   UTILS
========================================================= */

function escapeHTML(value){

    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

function escapeAttr(value){

    return escapeHTML(value);

}

function formatDate(time){

    if(!time) return "";

    return new Date(time).toLocaleString(
        "tr-TR",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}

function scrollChatBottom(){

    setTimeout(()=>{

        const box=document.getElementById("chatMessages");

        if(box){
            box.scrollTop=box.scrollHeight;
        }

    },50);

}

        console.error(e);

    }
