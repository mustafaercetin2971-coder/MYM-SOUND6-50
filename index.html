<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MYM SOUND</title>

<style>
:root{
  --theme:#8b5cf6;
  --bg:#080808;
  --card:#111;
  --card2:#171717;
  --border:#292929;
  --text:#fff;
  --muted:#999;
  --danger:#ef4444;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
}

button,
input,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

/* AUTH */

#authPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:
    radial-gradient(circle at top,#24113f 0,#080808 45%);
}

.auth-box{
  width:min(430px,100%);
  background:#101010;
  border:1px solid var(--border);
  border-radius:24px;
  padding:30px;
  box-shadow:0 20px 80px rgba(0,0,0,.55);
}

.logo{
  text-align:center;
  font-size:34px;
  font-weight:900;
  letter-spacing:2px;
  margin-bottom:8px;
}

.logo span{
  color:var(--theme);
}

.auth-sub{
  text-align:center;
  color:var(--muted);
  margin-bottom:25px;
}

.input{
  width:100%;
  background:#181818;
  color:#fff;
  border:1px solid #303030;
  border-radius:12px;
  padding:13px;
  outline:none;
  margin-bottom:12px;
}

.input:focus{
  border-color:var(--theme);
}

textarea.input{
  min-height:110px;
  resize:vertical;
}

.primary{
  width:100%;
  border:0;
  background:var(--theme);
  color:white;
  border-radius:12px;
  padding:13px;
  font-weight:700;
}

.secondary{
  width:100%;
  border:1px solid #333;
  background:#181818;
  color:white;
  border-radius:12px;
  padding:13px;
}

.switch-auth{
  text-align:center;
  margin-top:17px;
  color:var(--muted);
}

.switch-auth span{
  color:var(--theme);
  cursor:pointer;
}

/* APP */

#app{
  min-height:100vh;
  padding-bottom:80px;
}

.topbar{
  height:64px;
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(8,8,8,.9);
  backdrop-filter:blur(15px);
  border-bottom:1px solid #202020;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
}

.brand{
  font-size:21px;
  font-weight:900;
  letter-spacing:1px;
}

.brand span{
  color:var(--theme);
}

.top-user{
  color:#aaa;
  font-size:13px;
}

.container{
  width:min(700px,100%);
  margin:auto;
  padding:18px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* POST */

.create-post{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px;
  margin-bottom:18px;
}

.create-post textarea{
  width:100%;
  min-height:80px;
  background:#181818;
  border:1px solid #2b2b2b;
  border-radius:13px;
  color:#fff;
  padding:12px;
  resize:none;
  outline:none;
  margin-bottom:10px;
}

.post{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
  margin-bottom:14px;
}

.post-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:13px;
}

.user-info{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:var(--theme);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.username{
  font-weight:700;
}

.role{
  font-size:11px;
  color:var(--theme);
  margin-top:3px;
}

.post-text{
  line-height:1.5;
  white-space:pre-wrap;
  margin-bottom:14px;
}

.post-actions{
  display:flex;
  gap:8px;
}

.action{
  border:0;
  background:#1a1a1a;
  color:#ccc;
  border-radius:10px;
  padding:9px 12px;
}

.action:hover{
  background:#262626;
}

.action.active{
  color:var(--theme);
}

.delete-action{
  color:#f87171;
}

/* REELS */

.reel{
  height:560px;
  background:#000;
  border:1px solid #292929;
  border-radius:20px;
  overflow:hidden;
  position:relative;
  margin-bottom:20px;
}

.reel video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

.reel-info{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  padding:20px;
  background:linear-gradient(transparent,rgba(0,0,0,.9));
  pointer-events:none;
}

.reel-user{
  font-weight:800;
  margin-bottom:7px;
}

.reel-text{
  color:#ddd;
  white-space:pre-wrap;
}

/* SONG */

.section-title{
  font-size:20px;
  font-weight:800;
  margin:24px 0 12px;
}

.song-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px;
  margin-bottom:14px;
}

.song-top{
  display:flex;
  gap:14px;
  align-items:center;
}

.song-cover{
  width:82px;
  height:82px;
  object-fit:cover;
  border-radius:12px;
  background:#222;
}

.song-info{
  min-width:0;
  flex:1;
}

.song-name{
  font-size:18px;
  font-weight:800;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.song-author{
  color:var(--muted);
  margin-top:5px;
  font-size:13px;
}

.song-description{
  color:#bbb;
  margin-top:10px;
  line-height:1.4;
}

.song-audio{
  width:100%;
  margin-top:14px;
}

/* PROFILE */

.profile-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:25px;
  text-align:center;
}

.big-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  background:var(--theme);
  display:flex;
  justify-content:center;
  align-items:center;
  margin:auto auto 12px;
  font-size:30px;
  font-weight:900;
}

.profile-name{
  font-size:23px;
  font-weight:800;
}

.profile-role{
  color:var(--theme);
  margin-top:5px;
}

.stats{
  display:flex;
  justify-content:center;
  gap:35px;
  margin-top:22px;
}

.stat strong{
  display:block;
  font-size:20px;
}

.stat span{
  color:var(--muted);
  font-size:12px;
}

/* SETTINGS */

.setting-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:17px;
  margin-bottom:12px;
}

.setting-card h3{
  margin-bottom:8px;
}

.setting-card p{
  color:var(--muted);
  font-size:13px;
  margin-bottom:13px;
}

.theme-buttons{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

.theme-btn{
  border:1px solid #333;
  background:#191919;
  color:white;
  padding:10px 14px;
  border-radius:10px;
}

/* BOTTOM NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  background:rgba(12,12,12,.96);
  border-top:1px solid #292929;
  display:flex;
  justify-content:center;
  z-index:100;
}

.nav-inner{
  width:min(700px,100%);
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav-btn{
  border:0;
  background:none;
  color:#777;
  padding:8px 16px;
}

.nav-btn.active{
  color:var(--theme);
}

/* SHARE FAB */

.share-fab{
  position:fixed;
  right:20px;
  bottom:82px;
  width:58px;
  height:58px;
  border-radius:50%;
  border:0;
  background:var(--theme);
  color:#fff;
  font-size:32px;
  font-weight:700;
  z-index:120;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.share-menu{
  position:fixed;
  right:20px;
  bottom:150px;
  width:min(270px,calc(100vw - 40px));
  background:#151515;
  border:1px solid #333;
  border-radius:16px;
  padding:8px;
  z-index:121;
  display:none;
  box-shadow:0 15px 40px #000;
}

.share-menu.active{
  display:block;
}

.share-menu button{
  width:100%;
  text-align:left;
  border:0;
  background:none;
  color:#fff;
  padding:13px;
  border-radius:10px;
}

.share-menu button:hover{
  background:#252525;
}

/* MODAL */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  display:none;
  align-items:center;
  justify-content:center;
  padding:18px;
  z-index:200;
}

.modal.active{
  display:flex;
}

.modal-box{
  width:min(480px,100%);
  max-height:90vh;
  overflow:auto;
  background:#111;
  border:1px solid #303030;
  border-radius:20px;
  padding:20px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px;
}

.modal-head h2{
  font-size:20px;
}

.close{
  border:0;
  background:#222;
  color:#fff;
  width:35px;
  height:35px;
  border-radius:9px;
}

.file-label{
  display:block;
  color:#aaa;
  font-size:13px;
  margin:12px 0 7px;
}

.char-count{
  text-align:right;
  color:#777;
  font-size:12px;
  margin-top:-7px;
  margin-bottom:10px;
}

.repost-item{
  border:1px solid #292929;
  background:#171717;
  padding:13px;
  border-radius:13px;
  margin-bottom:9px;
}

.repost-author{
  font-size:13px;
  color:var(--theme);
  margin-bottom:6px;
}

.repost-text{
  color:#ddd;
  margin-bottom:10px;
}

/* EMPTY */

.empty{
  text-align:center;
  color:#777;
  padding:50px 20px;
}

/* MOBILE */

@media(max-width:600px){
  .container{
    padding:12px;
  }

  .reel{
    height:520px;
  }

  .share-fab{
    right:14px;
  }

  .share-menu{
    right:14px;
  }
}
</style>
</head>

<script>

/* =========================
   DATABASE
========================= */

const MEDIA_DB_NAME = "mym_media_db";
const MEDIA_STORE = "media";

function openMediaDB(){

  return new Promise((resolve,reject)=>{

    const request =
      indexedDB.open(MEDIA_DB_NAME,1);

    request.onupgradeneeded = function(){

      const db = request.result;

      if(!db.objectStoreNames.contains(MEDIA_STORE)){

        db.createObjectStore(MEDIA_STORE);
      }
    };

    request.onsuccess =
      ()=>resolve(request.result);

    request.onerror =
      ()=>reject(request.error);

  });

}


function saveMediaBlob(id,blob){

  return openMediaDB().then(db=>{

    return new Promise((resolve,reject)=>{

      const tx =
        db.transaction(MEDIA_STORE,"readwrite");

      tx.objectStore(MEDIA_STORE)
        .put(blob,id);

      tx.oncomplete =
        ()=>resolve();

      tx.onerror =
        ()=>reject(tx.error);

    });

  });

}


function getMediaBlob(id){

  return openMediaDB().then(db=>{

    return new Promise((resolve,reject)=>{

      const tx =
        db.transaction(MEDIA_STORE,"readonly");

      const request =
        tx.objectStore(MEDIA_STORE).get(id);

      request.onsuccess =
        ()=>resolve(request.result);

      request.onerror =
        ()=>reject(request.error);

    });

  });

}


function deleteMediaBlob(id){

  return openMediaDB().then(db=>{

    const tx =
      db.transaction(MEDIA_STORE,"readwrite");

    tx.objectStore(MEDIA_STORE).delete(id);

  });

}


/* =========================
   DATA
========================= */

let users =
  JSON.parse(
    localStorage.getItem("mym_users") || "[]"
  );

let posts =
  JSON.parse(
    localStorage.getItem("mym_posts") || "[]"
  );

let reels =
  JSON.parse(
    localStorage.getItem("mym_reels") || "[]"
  );

let songs =
  JSON.parse(
    localStorage.getItem("mym_songs") || "[]"
  );

let currentUser = null;

let currentShareType = "text";


/* =========================
   STORAGE
========================= */

function saveAll(){

  localStorage.setItem(
    "mym_users",
    JSON.stringify(users)
  );

  localStorage.setItem(
    "mym_posts",
    JSON.stringify(posts)
  );

  localStorage.setItem(
    "mym_reels",
    JSON.stringify(reels)
  );

  localStorage.setItem(
    "mym_songs",
    JSON.stringify(songs)
  );
}


/* =========================
   AUTH
========================= */

function showRegister(){

  document
    .getElementById("loginForm")
    .classList.add("hidden");

  document
    .getElementById("registerForm")
    .classList.remove("hidden");

}


function showLogin(){

  document
    .getElementById("registerForm")
    .classList.add("hidden");

  document
    .getElementById("loginForm")
    .classList.remove("hidden");

}


function register(){

  const name =
    document
      .getElementById("registerName")
      .value.trim();

  const password =
    document
      .getElementById("registerPassword")
      .value;

  const role =
    document
      .getElementById("registerRole")
      .value;

  if(!name || !password){

    alert("Kullanıcı adı ve şifre gerekli.");

    return;
  }

  if(users.some(u=>u.name.toLowerCase()===name.toLowerCase())){

    alert("Bu kullanıcı adı zaten kullanılıyor.");

    return;
  }

  const user = {

    id:Date.now(),

    name:name,

    password:password,

    role:role,

    repostedPosts:[]

  };

  users.push(user);

  saveAll();

  alert("Hesap oluşturuldu.");

  showLogin();

}


function login(){

  const name =
    document
      .getElementById("loginName")
      .value.trim();

  const password =
    document
      .getElementById("loginPassword")
      .value;

  const user =
    users.find(
      u =>
        u.name.toLowerCase()===name.toLowerCase()
        &&
        u.password===password
    );

  if(!user){

    alert("Kullanıcı adı veya şifre yanlış.");

    return;
  }

  currentUser = user;

  enterApp();

}


function logout(){

  currentUser = null;

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("authPage")
    .classList.remove("hidden");

}


/* =========================
   APP
========================= */

function enterApp(){

  document
    .getElementById("authPage")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

  document
    .getElementById("topUser")
    .textContent =
      currentUser.name;

  updateProfile();

  renderFeed();

  renderReels();

  renderSongs();

}


function showPage(page,button){

  document
    .querySelectorAll(".page")
    .forEach(p=>p.classList.remove("active"));

  document
    .getElementById(page+"Page")
    .classList.add("active");

  document
    .querySelectorAll(".nav-btn")
    .forEach(b=>b.classList.remove("active"));

  if(button){

    button.classList.add("active");

  }

  if(page==="reels"){

    renderReels();

  }

  if(page==="profile"){

    updateProfile();

  }

}


/* =========================
   POSTS
========================= */

function createPost(){

  const input =
    document.getElementById("postText");

  const text =
    input.value.trim();

  if(!text){

    alert("Bir şeyler yaz.");

    return;
  }

  const post = {

    id:Date.now(),

    userId:currentUser.id,

    userName:currentUser.name,

    role:currentUser.role,

    text:text,

    likes:0,

    likedBy:[],

    comments:0,

    type:"post",

    createdAt:new Date().toISOString()

  };

  posts.unshift(post);

  saveAll();

  input.value="";

  renderFeed();

}


function publishModalPost(){

  const text =
    document
      .getElementById("modalPostText")
      .value.trim();

  if(!text){

    alert("Gönderi boş olamaz.");

    return;
  }

  const post = {

    id:Date.now(),

    userId:currentUser.id,

    userName:currentUser.name,

    role:currentUser.role,

    text:text,

    likes:0,

    likedBy:[],

    comments:0,

    type:"post",

    createdAt:new Date().toISOString()

  };

  posts.unshift(post);

  saveAll();

  document
    .getElementById("modalPostText")
    .value="";

  closeModal("shareModal");

  renderFeed();

}


function toggleLike(id){

  const post =
    posts.find(p=>p.id===id);

  if(!post)return;

  post.likedBy =
    post.likedBy || [];

  const index =
    post.likedBy.indexOf(currentUser.id);

  if(index===-1){

    post.likedBy.push(currentUser.id);

  }else{

    post.likedBy.splice(index,1);

  }

  post.likes =
    post.likedBy.length;

  saveAll();

  renderFeed();

}


function deletePost(id){

  posts =
    posts.filter(p=>p.id!==id);

  saveAll();

  renderFeed();

}


/* =========================
   REPOST
========================= */

function openRepostModal(){

  toggleShareMenu();

  renderRepostList();

  document
    .getElementById("repostModal")
    .classList.add("active");

}


function renderRepostList(){

  const box =
    document.getElementById("repostList");

  if(!posts.length){

    box.innerHTML =
      `<div class="empty">Henüz paylaşılacak post yok.</div>`;

    return;
  }

  box.innerHTML =
    posts.map(post=>{

      const already =
        posts.some(
          p =>
            p.type==="repost"
            &&
            p.originalPostId===post.id
            &&
            p.userId===currentUser.id
        );

      return `

        <div class="repost-item">

          <div class="repost-author">
            ${escapeHTML(post.userName)}
          </div>

          <div class="repost-text">
            ${escapeHTML(post.text)}
          </div>

          <button
            class="primary"
            onclick="repostPost(${post.id})"
            ${already ? "disabled" : ""}>

            ${already ? "Zaten paylaşıldı" : "Yeniden Paylaş"}

          </button>

        </div>

      `;

    }).join("");

}


function repostPost(id){

  const original =
    posts.find(p=>p.id===id);

  if(!original)return;

  const already =
    posts.some(
      p =>
        p.type==="repost"
        &&
        p.originalPostId===id
        &&
        p.userId===currentUser.id
    );

  if(already){

    alert("Bu gönderiyi zaten yeniden paylaştın.");

    return;
  }

  const repost = {

    id:
      Date.now()
      +
      Math.floor(Math.random()*1000),

    userId:currentUser.id,

    userName:currentUser.name,

    role:currentUser.role,

    text:original.text,

    likes:0,

    likedBy:[],

    comments:0,

    type:"repost",

    originalPostId:original.id,

    originalUserName:original.userName,

    createdAt:new Date().toISOString()

  };

  posts.unshift(repost);

  saveAll();

  closeModal("repostModal");

  renderFeed();

}


/* =========================
   FEED
========================= */

function renderFeed(){

  const feed =
    document.getElementById("feed");

  if(!posts.length){

    feed.innerHTML =
      `<div class="empty">
        Henüz gönderi yok.
      </div>`;

    return;
  }

  feed.innerHTML =
    posts.map(createPostHTML).join("");

}


function createPostHTML(post){

  const liked =
    post.likedBy &&
    post.likedBy.includes(currentUser.id);

  const isMine =
    post.userId===currentUser.id;

  let repostHeader="";

  if(post.type==="repost"){

    repostHeader = `

      <div style="
        color:var(--theme);
        font-size:12px;
        margin-bottom:12px;
        font-weight:700;">

        Yeniden paylaşıldı ·
        ${escapeHTML(post.originalUserName || "")}

      </div>

    `;

  }

  return `

    <article class="post">

      ${repostHeader}

      <div class="post-head">

        <div class="user-info">

          <div class="avatar">
            ${escapeHTML(
              post.userName
                .charAt(0)
                .toUpperCase()
            )}
          </div>

          <div>

            <div class="username">
              ${escapeHTML(post.userName)}
            </div>

            <div class="role">
              ${escapeHTML(post.role || "Kullanıcı")}
            </div>

          </div>

        </div>

      </div>

      <div class="post-text">
        ${escapeHTML(post.text)}
      </div>

      <div class="post-actions">

        <button
          class="action ${liked ? "active":""}"
          onclick="toggleLike(${post.id})">

          Beğen ${post.likes || 0}

        </button>

        <button class="action">
          Yorum ${post.comments || 0}
        </button>

        <button
          class="action"
          onclick="openRepostModal()">

          Yeniden Paylaş

        </button>

        ${
          isMine
          ?
          `<button
             class="action delete-action"
             onclick="deletePost(${post.id})">
             Sil
           </button>`
          :
          ""
        }

      </div>

    </article>

  `;

}


/* =========================
   REELS
========================= */

async function publishReel(){

  const file =
    document
      .getElementById("reelVideo")
      .files[0];

  const text =
    document
      .getElementById("reelText")
      .value.trim();

  if(!file){

    alert("Bir video seç.");

    return;
  }

  if(!file.type.startsWith("video/")){

    alert("Sadece video dosyası yükleyebilirsin.");

    return;
  }

  const id =
    "reel_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2);

  await saveMediaBlob(id,file);

  reels.unshift({

    id:Date.now(),

    userId:currentUser.id,

    userName:currentUser.name,

    role:currentUser.role,

    text:text,

    videoMediaId:id,

    likes:0,

    createdAt:new Date().toISOString()

  });

  saveAll();

  document
    .getElementById("reelVideo")
    .value="";

  document
    .getElementById("reelText")
    .value="";

  closeModal("shareModal");

  renderReels();

  showPage("reels");

}


async function renderReels(){

  const box =
    document.getElementById("reels");

  if(!reels.length){

    box.innerHTML =
      `<div class="empty">
        Henüz Reels videosu yok.
      </div>`;

    return;
  }

  box.innerHTML="";

  for(const reel of reels){

    const blob =
      await getMediaBlob(
        reel.videoMediaId
      );

    if(!blob)continue;

    const url =
      URL.createObjectURL(blob);

    const div =
      document.createElement("div");

    div.className="reel";

    div.innerHTML = `

      <video
        src="${url}"
        controls
        playsinline
        preload="metadata">
      </video>

      <div class="reel-info">

        <div class="reel-user">
          ${escapeHTML(reel.userName)}
        </div>

        <div class="reel-text">
          ${escapeHTML(reel.text || "")}
        </div>

      </div>

    `;

    box.appendChild(div);

  }

}


/* =========================
   SONGS
========================= */

async function publishSong(){

  const cover =
    document
      .getElementById("songCover")
      .files[0];

  const name =
    document
      .getElementById("songName")
      .value.trim();

  const description =
    document
      .getElementById("songDescription")
      .value.trim();

  const audio =
    document
      .getElementById("songFile")
      .files[0];


  if(!cover){

    alert("JPG kapak görseli zorunlu.");

    return;
  }

  const isJPG =
    cover.type==="image/jpeg"
    ||
    /\.(jpg|jpeg)$/i.test(cover.name);

  if(!isJPG){

    alert("Kapak görseli sadece JPG olmalı.");

    return;
  }

  if(!name){

    alert("Şarkı adı zorunlu.");

    return;
  }

  if(name.length>40){

    alert("Şarkı adı en fazla 40 karakter olabilir.");

    return;
  }

  if(!audio){

    alert("Şarkı dosyasını seç.");

    return;
  }

  if(!audio.type.startsWith("audio/")){

    alert("Geçerli bir ses dosyası seç.");

    return;
  }


  const coverId =
    "cover_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2);

  const audioId =
    "audio_" +
    Date.now() +
    "_" +
    Math.random()
      .toString(36)
      .slice(2);


  await saveMediaBlob(
    coverId,
    cover
  );

  await saveMediaBlob(
    audioId,
    audio
  );


  songs.unshift({

    id:Date.now(),

    userId:currentUser.id,

    userName:currentUser.name,

    role:currentUser.role,

    name:name,

    description:description,

    coverMediaId:coverId,

    audioMediaId:audioId,

    createdAt:new Date().toISOString(),

    likes:0

  });


  saveAll();


  document
    .getElementById("songCover")
    .value="";

  document
    .getElementById("songName")
    .value="";

  document
    .getElementById("songDescription")
    .value="";

  document
    .getElementById("songFile")
    .value="";

  document
    .getElementById("songNameCount")
    .textContent="0 / 40";


  closeModal("shareModal");

  renderSongs();

  alert("Şarkı başarıyla yayınlandı.");

}


async function renderSongs(){

  const box =
    document.getElementById("songs");

  if(!songs.length){

    box.innerHTML =
      `<div class="empty">
        Henüz şarkı yayınlanmamış.
      </div>`;

    return;
  }

  box.innerHTML="";

  for(const song of songs){

    const cover =
      await getMediaBlob(
        song.coverMediaId
      );

    const audio =
      await getMediaBlob(
        song.audioMediaId
      );

    if(!cover || !audio)continue;

    const coverURL =
      URL.createObjectURL(cover);

    const audioURL =
      URL.createObjectURL(audio);

    const card =
      document.createElement("div");

    card.className="song-card";

    card.innerHTML = `

      <div class="song-top">

        <img
          class="song-cover"
          src="${coverURL}">

        <div class="song-info">

          <div class="song-name">
            ${escapeHTML(song.name)}
          </div>

          <div class="song-author">
            ${escapeHTML(song.userName)}
          </div>

        </div>

      </div>

      ${
        song.description
        ?
        `<div class="song-description">
          ${escapeHTML(song.description)}
         </div>`
        :
        ""
      }

      <audio
        class="song-audio"
        src="${audioURL}"
        controls>
      </audio>

    `;

    box.appendChild(card);

  }

}


/* =========================
   SHARE MENU
========================= */

function toggleShareMenu(){

  document
    .getElementById("shareMenu")
    .classList.toggle("active");

}


function openShareModal(type){

  currentShareType=type;

  toggleShareMenu();

  document
    .getElementById("shareModal")
    .classList.add("active");

  document
    .getElementById("textShareForm")
    .classList.add("hidden");

  document
    .getElementById("reelShareForm")
    .classList.add("hidden");

  document
    .getElementById("songShareForm")
    .classList.add("hidden");


  if(type==="text"){

    document
      .getElementById("shareModalTitle")
      .textContent="Gönderi Paylaş";

    document
      .getElementById("textShareForm")
      .classList.remove("hidden");

  }


  if(type==="reel"){

    document
      .getElementById("shareModalTitle")
      .textContent="Reels Video Paylaş";

    document
      .getElementById("reelShareForm")
      .classList.remove("hidden");

  }


  if(type==="song"){

    document
      .getElementById("shareModalTitle")
      .textContent="Şarkı Yayınla";

    document
      .getElementById("songShareForm")
      .classList.remove("hidden");

  }

}


function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("active");

}


/* =========================
   PROFILE
========================= */

function updateProfile(){

  if(!currentUser)return;

  const myPosts =
    posts.filter(
      p=>p.userId===currentUser.id
    ).length;

  const mySongs =
    songs.filter(
      s=>s.userId===currentUser.id
    ).length;

  const myReels =
    reels.filter(
      r=>r.userId===currentUser.id
    ).length;


  document
    .getElementById("profileAvatar")
    .textContent =
      currentUser.name
        .charAt(0)
        .toUpperCase();

  document
    .getElementById("profileName")
    .textContent =
      currentUser.name;

  document
    .getElementById("profileRole")
    .textContent =
      currentUser.role;

  document
    .getElementById("profilePosts")
    .textContent =
      myPosts;

  document
    .getElementById("profileSongs")
    .textContent =
      mySongs;

  document
    .getElementById("profileReels")
    .textContent =
      myReels;

}


/* =========================
   THEME
========================= */

function setTheme(color){

  document
    .documentElement
    .style
    .setProperty("--theme",color);

  localStorage.setItem(
    "mym_theme",
    color
  );

}


const savedTheme =
  localStorage.getItem("mym_theme");

if(savedTheme){

  setTheme(savedTheme);

}


/* =========================
   CHARACTER COUNT
========================= */

document
  .getElementById("songName")
  .addEventListener(
    "input",
    function(){

      document
        .getElementById("songNameCount")
        .textContent =
          this.value.length + " / 40";

    }
  );


/* =========================
   ESCAPE HTML
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   MODAL CLICK OUTSIDE
========================= */

document
  .querySelectorAll(".modal")
  .forEach(modal=>{

    modal.addEventListener(
      "click",
      function(e){

        if(e.target===modal){

          modal.classList.remove("active");

        }

      }
    );

  });


/* =========================
   AUTO SESSION
========================= */

const savedUserId =
  localStorage.getItem("mym_current_user");

if(savedUserId){

  const found =
    users.find(
      u=>String(u.id)===String(savedUserId)
    );

  if(found){

    currentUser=found;

    enterApp();

  }

}


/* save current user */

function setCurrentUser(){

  if(currentUser){

    localStorage.setItem(
      "mym_current_user",
      currentUser.id
    );

  }

}

========================= */

document.addEventListener(
  "click",
  function(e){

    const menu =
      document.getElementById("shareMenu");
