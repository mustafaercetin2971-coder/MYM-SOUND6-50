```html
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MYM SOUND</title>

<style>
:root{
    --p:#7c3aed;
    --p2:#a855f7;
    --a:#c084fc;
    --bg:#09090b;
    --panel:#111113;
    --panel2:#18181b;
    --text:#fff;
    --muted:#a1a1aa;
    --border:#27272a;
    --danger:#ef4444;
    --success:#22c55e;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

.hidden{
    display:none!important;
}

.app{
    min-height:100vh;
}

/* TOPBAR */

.topbar{
    height:64px;
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(9,9,11,.94);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 22px;
}

.page-title{
    font-size:21px;
    font-weight:800;
}

.top-actions{
    display:flex;
    align-items:center;
    gap:8px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    background:var(--panel);
    color:white;
    border-radius:12px;
}

.icon-btn:hover{
    border-color:var(--p);
}

/* LAYOUT */

.layout{
    display:flex;
    min-height:calc(100vh - 64px);
}

.sidebar{
    width:250px;
    border-right:1px solid var(--border);
    background:#0d0d0f;
    padding:18px 12px;
    position:fixed;
    top:64px;
    bottom:0;
    overflow:auto;
}

.logo{
    font-size:24px;
    font-weight:900;
    padding:10px 12px 20px;
}

.logo span{
    color:var(--p2);
}

.nav{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.nav button{
    width:100%;
    border:0;
    background:transparent;
    color:#d4d4d8;
    text-align:left;
    padding:12px 14px;
    border-radius:12px;
    font-weight:600;
}

.nav button:hover,
.nav button.active{
    background:var(--panel2);
    color:white;
}

.main{
    width:100%;
    margin-left:250px;
    padding:24px;
    max-width:1500px;
}

.container{
    width:100%;
    max-width:1100px;
    margin:auto;
}

/* CARDS */

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:18px;
    margin-bottom:16px;
}

.card-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:12px;
}

.muted{
    color:var(--muted);
}

/* BUTTONS */

.btn{
    border:0;
    border-radius:11px;
    padding:10px 15px;
    color:white;
    background:var(--p);
    font-weight:700;
}

.btn:hover{
    filter:brightness(1.12);
}

.btn.secondary{
    background:var(--panel2);
    border:1px solid var(--border);
}

.btn.danger{
    background:var(--danger);
}

.btn.success{
    background:var(--success);
    color:#041008;
}

.btn.pro{
    background:linear-gradient(135deg,#7c3aed,#a855f7);
}

/* INPUTS */

.input,
textarea,
select{
    width:100%;
    background:#09090b;
    border:1px solid var(--border);
    color:white;
    border-radius:11px;
    padding:12px;
    outline:none;
}

.input:focus,
textarea:focus,
select:focus{
    border-color:var(--p);
}

textarea{
    resize:vertical;
    min-height:100px;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    display:block;
    margin-bottom:7px;
    color:#d4d4d8;
    font-size:14px;
    font-weight:700;
}

/* GRID */

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.grid2{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

/* PROFILE */

.profile-head{
    min-height:240px;
    border-radius:20px;
    overflow:hidden;
    position:relative;
    background:linear-gradient(135deg,#18181b,#27272a);
    border:1px solid var(--border);
    margin-bottom:18px;
}

.profile-bg{
    position:absolute;
    inset:0;
    background-size:cover;
    background-position:center;
    opacity:.65;
}

.profile-info{
    position:relative;
    min-height:240px;
    display:flex;
    align-items:flex-end;
    padding:24px;
    background:linear-gradient(transparent,rgba(0,0,0,.9));
}

.avatar{
    width:78px;
    height:78px;
    border-radius:50%;
    object-fit:cover;
    background:#27272a;
    border:3px solid var(--p);
}

.profile-text{
    margin-left:16px;
}

.profile-name{
    font-size:24px;
    font-weight:900;
}

.username{
    color:var(--muted);
    margin-top:3px;
}

.pro-badge{
    display:inline-block;
    margin-left:7px;
    padding:4px 8px;
    border-radius:8px;
    background:linear-gradient(135deg,#7c3aed,#a855f7);
    font-size:11px;
    font-weight:900;
}

/* POSTS */

.post{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:18px;
    padding:17px;
    margin-bottom:15px;
}

.post-head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:13px;
}

.small-avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    object-fit:cover;
    background:#27272a;
}

.post-user{
    font-weight:800;
}

.post-time{
    color:var(--muted);
    font-size:12px;
}

.post-image{
    width:100%;
    max-height:500px;
    object-fit:cover;
    border-radius:13px;
    margin-top:12px;
}

.post-actions{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
}

/* AUDIO */

.audio-player{
    width:100%;
    margin-top:12px;
}

.song-cover{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    border-radius:15px;
    background:#27272a;
}

.song-title{
    font-weight:900;
    font-size:18px;
    margin-top:10px;
}

.song-meta{
    color:var(--muted);
    margin-top:5px;
}

/* SHOP */

.shop-card{
    overflow:hidden;
}

.shop-cover{
    width:100%;
    height:170px;
    object-fit:cover;
    border-radius:13px;
    background:#27272a;
}

.price{
    font-size:21px;
    font-weight:900;
    color:var(--a);
    margin:10px 0;
}

/* STATS */

.stats{
    display:flex;
    gap:22px;
    margin-top:12px;
    flex-wrap:wrap;
}

.stat{
    text-align:center;
}

.stat strong{
    display:block;
    font-size:20px;
}

.stat span{
    color:var(--muted);
    font-size:12px;
}

/* MODAL */

.modal-wrap{
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(0,0,0,.75);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal{
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:20px;
    padding:22px;
}

.modal-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.close{
    border:0;
    background:transparent;
    color:white;
    font-size:24px;
}

/* FILE PICKER */

.file-box{
    border:1px dashed #52525b;
    border-radius:13px;
    padding:18px;
    text-align:center;
    background:#0d0d0f;
}

.file-box input{
    width:100%;
    color:#d4d4d8;
}

/* TOAST */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:1000;
    background:#18181b;
    border:1px solid var(--border);
    border-radius:12px;
    padding:13px 16px;
    display:none;
}

/* AUTH */

.auth{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at 20% 20%,rgba(124,58,237,.18),transparent 35%),
        radial-gradient(circle at 80% 80%,rgba(168,85,247,.12),transparent 35%),
        #09090b;
}

.auth-box{
    width:100%;
    max-width:450px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:22px;
    padding:28px;
}

.auth-logo{
    text-align:center;
    font-size:32px;
    font-weight:900;
    margin-bottom:25px;
}

.auth-logo span{
    color:var(--p2);
}

/* MOBILE */

.mobile-nav{
    display:none;
}

@media(max-width:850px){

    .sidebar{
        display:none;
    }

    .main{
        margin-left:0;
        padding:15px;
        padding-bottom:90px;
    }

    .grid{
        grid-template-columns:1fr 1fr;
    }

    .grid2{
        grid-template-columns:1fr;
    }

    .mobile-nav{
        position:fixed;
        display:flex;
        bottom:0;
        left:0;
        right:0;
        height:65px;
        background:rgba(13,13,15,.96);
        border-top:1px solid var(--border);
        z-index:200;
        justify-content:space-around;
        align-items:center;
    }

    .mobile-nav button{
        background:transparent;
        border:0;
        color:#a1a1aa;
        font-size:11px;
    }

    .mobile-nav button.active{
        color:white;
    }
}

@media(max-width:520px){

    .grid{
        grid-template-columns:1fr;
    }

    .topbar{
        padding:0 14px;
    }

    .main{
        padding:12px;
    }

    .profile-name{
        font-size:20px;
    }
}
</style>
</head>

<body>

<div id="root"></div>
<div id="toast" class="toast"></div>

<script>
"use strict";

/* =========================================================
   MYM SOUND
   ========================================================= */

const KEY={
    users:"mym_users_v10",
    posts:"mym_posts_v10",
    songs:"mym_songs_v10",
    reels:"mym_reels_v10",
    shop:"mym_shop_v10",
    messages:"mym_messages_v10",
    activities:"mym_activities_v10",
    notifications:"mym_notifications_v10",
    current:"mym_current_v10",
    archive:"mym_archive_v10"
};

const PAGE_TITLES={
    home:"Ana Sayfa",
    posts:"Gönderiler",
    reels:"Reels",
    songs:"Şarkılar",
    channels:"Kanallar",
    shop:"Shop",
    profile:"Profil",
    settings:"Ayarlar",
    messages:"Mesajlar",
    notifications:"Bildirimler",
    search:"Ara",
    archive:"Arşiv",
    activity:"Aktivite",
    pro:"PRO",
    admin:"Yönetim"
};

const ROLES=[
    "Dinleyici",
    "Sanatçı",
    "Beat Maker",
    "Mix Engineer",
    "Prodüktör"
];

const SHOP_ROLES=[
    "Beat Maker",
    "Mix Engineer",
    "Prodüktör"
];

const PRO={
    monthly:{
        price:50,
        duration:30*24*60*60*1000,
        boosts:10
    },
    yearly:{
        price:200,
        duration:365*24*60*60*1000,
        boosts:10
    }
};

const THEMES=[
    ["#7c3aed","#a855f7","#c084fc"],
    ["#2563eb","#3b82f6","#60a5fa"],
    ["#0891b2","#06b6d4","#67e8f9"],
    ["#059669","#10b981","#6ee7b7"],
    ["#16a34a","#22c55e","#86efac"],
    ["#ca8a04","#eab308","#fde047"],
    ["#ea580c","#f97316","#fdba74"],
    ["#dc2626","#ef4444","#fca5a5"],
    ["#db2777","#ec4899","#f9a8d4"],
    ["#c026d3","#d946ef","#f0abfc"],
    ["#9333ea","#a855f7","#d8b4fe"],
    ["#4f46e5","#6366f1","#a5b4fc"],
    ["#1d4ed8","#2563eb","#93c5fd"],
    ["#0f766e","#14b8a6","#99f6e4"],
    ["#15803d","#16a34a","#86efac"],
    ["#a16207","#ca8a04","#fde68a"],
    ["#9a3412","#ea580c","#fed7aa"],
    ["#991b1b","#dc2626","#fecaca"],
    ["#9d174d","#db2777","#fbcfe8"],
    ["#52525b","#71717a","#d4d4d8"]
];

let users=[];
let posts=[];
let songs=[];
let reels=[];
let shop=[];
let messages=[];
let activities=[];
let notifications=[];
let archive=[];
let current=null;

const state={
    page:"home",
    selectedUser:null,
    search:"",
    modal:null
};

/* =========================================================
   HELPERS
   ========================================================= */

function uid(prefix="id"){
    return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,9);
}

function now(){
    return Date.now();
}

function escapeHTML(value){
    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function load(){
    users=JSON.parse(localStorage.getItem(KEY.users)||"[]");
    posts=JSON.parse(localStorage.getItem(KEY.posts)||"[]");
    songs=JSON.parse(localStorage.getItem(KEY.songs)||"[]");
    reels=JSON.parse(localStorage.getItem(KEY.reels)||"[]");
    shop=JSON.parse(localStorage.getItem(KEY.shop)||"[]");
    messages=JSON.parse(localStorage.getItem(KEY.messages)||"[]");
    activities=JSON.parse(localStorage.getItem(KEY.activities)||"[]");
    notifications=JSON.parse(localStorage.getItem(KEY.notifications)||"[]");
    archive=JSON.parse(localStorage.getItem(KEY.archive)||"[]");

    const id=localStorage.getItem(KEY.current);

    if(id){
        current=users.find(x=>x.id===id)||null;
    }

    users.forEach(expirePro);
}

function save(){
    localStorage.setItem(KEY.users,JSON.stringify(users));
    localStorage.setItem(KEY.posts,JSON.stringify(posts));
    localStorage.setItem(KEY.songs,JSON.stringify(songs));
    localStorage.setItem(KEY.reels,JSON.stringify(reels));
    localStorage.setItem(KEY.shop,JSON.stringify(shop));
    localStorage.setItem(KEY.messages,JSON.stringify(messages));
    localStorage.setItem(KEY.activities,JSON.stringify(activities));
    localStorage.setItem(KEY.notifications,JSON.stringify(notifications));
    localStorage.setItem(KEY.archive,JSON.stringify(archive));

    if(current){
        localStorage.setItem(KEY.current,current.id);
    }else{
        localStorage.removeItem(KEY.current);
    }
}

function toast(text){
    const el=document.getElementById("toast");
    el.textContent=text;
    el.style.display="block";

    clearTimeout(window.__toast);
    window.__toast=setTimeout(()=>{
        el.style.display="none";
    },2500);
}

function userById(id){
    return users.find(x=>x.id===id);
}

function isAdmin(){
    return current && (
        current.username==="admin" ||
        current.role==="Admin"
    );
}

function isPro(u=current){
    if(!u) return false;

    expirePro(u);

    return u.plan==="pro" &&
        u.proExpiresAt &&
        now()<u.proExpiresAt;
}

function proCheck(u){
    if(!u) return false;

    expirePro(u);

    if(!isPro(u)) return false;

    if(u.proPlan==="yearly"){
        const key=new Date().getFullYear()+"-"+new Date().getMonth();

        if(u.proCycleKey!==key){
            u.proCycleKey=key;
            u.proBoostUsed=0;

            posts.forEach(p=>{
                if(p.userId===u.id) p.featured=false;
            });

            reels.forEach(p=>{
                if(p.userId===u.id) p.featured=false;
            });

            songs.forEach(p=>{
                if(p.userId===u.id) p.featured=false;
            });

            shop.forEach(p=>{
                if(p.userId===u.id) p.featured=false;
            });

            save();
        }
    }

    return true;
}

function expirePro(u){
    if(
        u.plan==="pro" &&
        u.proExpiresAt &&
        now()>=u.proExpiresAt
    ){
        u.plan="free";
        u.proPlan=null;
        u.proStartedAt=null;
        u.proExpiresAt=null;
        u.proCycleKey=null;
        u.proBoostUsed=0;

        posts.forEach(p=>{
            if(p.userId===u.id) p.featured=false;
        });

        reels.forEach(p=>{
            if(p.userId===u.id) p.featured=false;
        });

        songs.forEach(p=>{
            if(p.userId===u.id) p.featured=false;
        });

        shop.forEach(p=>{
            if(p.userId===u.id) p.featured=false;
        });
    }
}

function activity(type,text){
    if(!current) return;

    activities.unshift({
        id:uid("act"),
        userId:current.id,
        type,
        text,
        createdAt:now()
    });

    activities=activities.slice(0,1000);
}

function notify(userId,text){
    notifications.unshift({
        id:uid("not"),
        userId,
        text,
        read:false,
        createdAt:now()
    });

    notifications=notifications.slice(0,1000);
}

function avatar(u){
    if(!u) return "";

    if(u.avatar){
        return `<img class="small-avatar" src="${u.avatar}" alt="">`;
    }

    return `<div class="small-avatar"></div>`;
}

function avatarLarge(u){
    if(!u) return "";

    if(u.avatar){
        return `<img class="avatar" src="${u.avatar}" alt="">`;
    }

    return `<div class="avatar"></div>`;
}

function formatDate(time){
    return new Date(time).toLocaleString("tr-TR");
}

/* =========================================================
   THEME
   ========================================================= */

function applyTheme(){
    if(!current) return;

    const index=Number(
        String(current.settings?.theme||"theme0")
        .replace("theme","")
    );

    const t=THEMES[index]||THEMES[0];

    document.documentElement.style.setProperty("--p",t[0]);
    document.documentElement.style.setProperty("--p2",t[1]);
    document.documentElement.style.setProperty("--a",t[2]);
}

/* =========================================================
   HEADER
   ========================================================= */

function header(){
    const title=PAGE_TITLES[state.page]||"MYM SOUND";

    return `
        <header class="topbar">
            <div class="page-title">
                ${escapeHTML(title)}
            </div>

            <div class="top-actions">
                <button class="icon-btn" onclick="go('search')">
                    Ara
                </button>

                <button class="icon-btn" onclick="go('notifications')">
                    ${notifications.filter(x=>x.userId===current.id&&!x.read).length}
                </button>
            </div>
        </header>
    `;
}

/* =========================================================
   NAV
   ========================================================= */

function navButton(page,label){
    return `
        <button
            class="${state.page===page?"active":""}"
            onclick="go('${page}')">
            ${label}
        </button>
    `;
}

function sidebar(){
    return `
        <aside class="sidebar">
            <div class="logo">
                MYM <span>SOUND</span>
            </div>

            <nav class="nav">
                ${navButton("home","Ana Sayfa")}
                ${navButton("posts","Gönderiler")}
                ${navButton("reels","Reels")}
                ${navButton("songs","Şarkılar")}
                ${navButton("channels","Kanallar")}
                ${navButton("shop","Shop")}
                ${navButton("profile","Profil")}
                ${navButton("messages","Mesajlar")}
                ${navButton("notifications","Bildirimler")}
                ${navButton("search","Ara")}
                ${navButton("archive","Arşiv")}
                ${navButton("activity","Aktivite")}
                ${navButton("pro","PRO")}
                ${isAdmin()?navButton("admin","Yönetim"):""}
                ${navButton("settings","Ayarlar")}

                <button onclick="logout()">Çıkış</button>
            </nav>
        </aside>
    `;
}

function mobileNav(){
    return `
        <nav class="mobile-nav">
            <button onclick="go('home')">Ana Sayfa</button>
            <button onclick="go('reels')">Reels</button>
            <button onclick="go('songs')">Şarkılar</button>
            <button onclick="go('shop')">Shop</button>
            <button onclick="go('profile')">Profil</button>
        </nav>
    `;
}

/* =========================================================
   SHELL
   ========================================================= */

function shell(content){
    return `
        ${header()}

        <div class="layout">
            ${sidebar()}

            <main class="main">
                <div class="container">
                    ${content}
                </div>
            </main>
        </div>

        ${mobileNav()}
    `;
}

/* =========================================================
   POST
   ========================================================= */

function postCard(p){
    const u=userById(p.userId);
    if(!u) return "";

    return `
        <article class="post">

            <div class="post-head">
                ${avatar(u)}

                <div>
                    <div class="post-user">
                        ${escapeHTML(u.name)}

                        ${isPro(u)?'<span class="pro-badge">PRO</span>':""}
                    </div>

                    <div class="post-time">
                        @${escapeHTML(u.username)}
                        ·
                        ${formatDate(p.createdAt)}
                    </div>
                </div>
            </div>

            <div>
                ${escapeHTML(p.text)}
            </div>

            ${p.image?`
                <img
                    class="post-image"
                    src="${p.image}"
                    alt="">
            `:""}

            <div class="post-actions">
                <button
                    class="btn secondary"
                    onclick="toggleLike('${p.id}')">
                    Beğen ${p.likes?.length||0}
                </button>

                <button
                    class="btn secondary"

/* =========================================================

   ========================================================= */

function renderHome(){

    const all=[
        ...posts.map(x=>({...x,_type:"post"})),
        ...reels.map(x=>({...x,_type:"reel"})),
        ...songs.map(x=>({...x,_type:"song"}))
    ]
    .sort((a,b)=>{
        if(Boolean(b.featured)!==Boolean(a.featured)){
            return Number(b.featured)-Number(a.featured);
        }

        return b.createdAt-a.createdAt;
    });

    return `
        <div class="card">
            <div class="card-title">MYM SOUND</div>

            <p class="muted">
                Müzik, içerik ve üreticiler burada.
            </p>

            <div class="post-actions">

                    Gönderi Oluştur
                </button>

                <button class="btn secondary" onclick="openSongModal()">
                    Şarkı Yükle
                </button>

                <button class="btn secondary" onclick="openReelModal()">
                    Reel Oluştur
                </button>
            </div>
        </div>

        ${all.length?
            all.map(x=>{
                if(x._type==="post") return postCard(x);
                if(x._type==="song") return songCard(x);
                return reelCard(x);
            }).join("")
            :
            `<div class="card muted">Henüz içerik yok.</div>`
        }
    `;
}

function render(){

    applyTheme();

    if(!current){
        document.getElementById("root").innerHTML=authHTML();
        return;
    }

    proCheck(current);
    save();

    let content="";

    switch(state.page){

        case "home":
            content=renderHome();
            break;

        case "posts":
            content=renderPosts();
            break;

        case "reels":
            content=renderReels();
            break;

        case "songs":
            content=renderSongs();
            break;

        case "channels":
            content=renderChannels();
            break;

        case "shop":
            content=renderShop();
            break;

        case "profile":
            content=renderProfile();
            break;

        case "settings":
            content=renderSettings();
            break;

        case "messages":
            content=renderMessages();
            break;

        case "notifications":
            content=renderNotifications();
            break;

        case "search":
            content=renderSearch();
            break;

        case "archive":
            content=renderArchive();
            break;

        case "activity":
            content=renderActivity();
            break;

        case "pro":
            content=renderPro();
            break;

        case "admin":

            break;

        default:

    }

    document.getElementById("root").innerHTML=shell(content);
}

function showRegister(){

    document.getElementById("registerForm").classList.add("hidden");
    document.getElementById("loginForm").classList.remove("hidden");
}

function register(){

    const name=document.getElementById("regName").value.trim();
    const username=document.getElementById("regUsername").value.trim();
    const email=document.getElementById("regEmail").value.trim().toLowerCase();
    const password=document.getElementById("regPassword").value;
    const role=document.getElementById("regRole").value;

    if(!name||!username||!email||!password){
        toast("Tüm alanları doldur.");
        return;
    }

    if(users.some(u=>u.email===email)){
        toast("Bu e-posta zaten kayıtlı.");
        return;
    }

    if(users.some(u=>u.username.toLowerCase()===username.toLowerCase())){
        toast("Bu kullanıcı adı zaten alınmış.");
        return;
    }

    const u={
        id:uid("user"),
        name,
        email,
        username,
        password,
        role,

        plan:"free",
        proPlan:null,
        proStartedAt:null,
        proExpiresAt:null,
        proCycleKey:null,
        proBoostUsed:0,

        followers:[],
        following:[],
        blockedUsers:[],

        avatar:"",
        profileBackground:"",
        shopBackground:"",

        bio:"",
        shopName:"",
        shopDescription:"",

        nameChanges:[],

        banned:false,
        online:true,
        lastSeen:now(),

        settings:{
            theme:"theme0",
            notifications:true,
            autoplay:false,
            privateProfile:false
        },

        createdAt:now()
    };

    users.push(u);
    current=u;

    activity("register","Hesap oluşturuldu.");
    save();

    render();
}

function login(){

    const identity=document.getElementById("loginIdentity").value.trim().toLowerCase();
    const password=document.getElementById("loginPassword").value;

    const u=users.find(x=>
        (
            x.email.toLowerCase()===identity||
            x.username.toLowerCase()===identity
        )&&
        x.password===password
    );

    if(!u){
        toast("Kullanıcı adı/e-posta veya şifre hatalı.");
        return;
    }

    if(u.banned){
        toast("Bu hesap banlanmış.");
        return;
    }

    current=u;
    current.online=true;
    current.lastSeen=now();

    save();
    render();
}

function logout(){

    if(current){
        current.online=false;
        current.lastSeen=now();
    }

    save();

    current=null;
    state.page="home";

    render();
}

/* =========================================================
   FILE READER
   ========================================================= */

/*
   ÖNEMLİ:
   Burada artık ses veya görsel için URL/link istenmiyor.

   Ses:
   accept="audio/*"

   Görsel:
   accept="image/*"

   Kullanıcı doğrudan bilgisayarından dosya seçiyor.
*/

function readFileAsDataURL(file){

    return new Promise((resolve,reject)=>{

        if(!file){
            resolve("");
            return;
        }

        const reader=new FileReader();

        reader.onload=()=>{
            resolve(reader.result);
        };

        reader.onerror=reject;

        reader.readAsDataURL(file);
    });
}

/* =========================================================
   FOLLOW
   ========================================================= */

function follow(userId){

    const u=userById(userId);

    if(!u||u.id===current.id) return;

    current.following=current.following||[];
    u.followers=u.followers||[];

    const exists=current.following.includes(userId);

    if(exists){

        current.following=
            current.following.filter(x=>x!==userId);

        u.followers=
            u.followers.filter(x=>x!==current.id);

        activity("follow","Bir kullanıcıyı takipten çıktın.");

    }else{

        current.following.push(userId);

        u.followers.push(current.id);

        notify(
            userId,
            `${current.name} seni takip etmeye başladı.`
        );

        activity("follow","Bir kullanıcıyı takip etmeye başladın.");
    }

    save();
    render();
}

/* =========================================================
   LIKE
   ========================================================= */

function toggleLike(postId){

    const p=posts.find(x=>x.id===postId);

    if(!p) return;

    p.likes=p.likes||[];

    const i=p.likes.indexOf(current.id);

    if(i>=0){
        p.likes.splice(i,1);
    }else{
        p.likes.push(current.id);

        if(p.userId!==current.id){
            notify(
                p.userId,
                `${current.name} gönderini beğendi.`
            );
        }
    }

    save();
    render();
}

/* =========================================================
   PRO
   ========================================================= */

function activatePro(plan){

    const data=PRO[plan];

    if(!data) return;

    const started=now();

    current.plan="pro";
    current.proPlan=plan;
    current.proStartedAt=started;
    current.proExpiresAt=started+data.duration;
    current.proBoostUsed=0;

    if(plan==="yearly"){
        const d=new Date(started);
        current.proCycleKey=
            d.getFullYear()+"-"+d.getMonth();
    }else{
        current.proCycleKey=null;
    }

    activity(
        "pro",
        `${plan==="monthly"?"Aylık":"Yıllık"} PRO aktifleştirildi.`
    );

    save();
    toast("PRO aktifleştirildi.");
    render();
}

function boost(type,id){

    if(!isPro()){
        toast("Öne çıkarma için PRO gerekli.");
        return;
    }

    proCheck(current);

    if((current.proBoostUsed||0)>=10){
        toast("Öne çıkarma hakkın kalmadı.");
        return;
    }

    let item=null;

    if(type==="post"){
        item=posts.find(x=>x.id===id);
    }

    if(type==="reel"){
        item=reels.find(x=>x.id===id);
    }

    if(type==="song"){
        item=songs.find(x=>x.id===id);
    }

    if(type==="shop"){
        item=shop.find(x=>x.id===id);
    }

    if(!item||item.userId!==current.id) return;

    if(item.featured){
        toast("Bu içerik zaten öne çıkarılmış.");
        return;
    }

    item.featured=true;

    current.proBoostUsed=
        (current.proBoostUsed||0)+1;

    activity("boost","Bir içerik öne çıkarıldı.");

    save();
    render();
}

/* =========================================================
   ARCHIVE
   ========================================================= */

function archiveContent(type,id){

    let item=null;

    if(type==="post"){
        item=posts.find(x=>x.id===id);
    }

    if(!item) return;

    if(item.userId!==current.id) return;

    archive.unshift({
        id:uid("archive"),
        originalId:id,
        type,
        userId:current.id,
        title:item.text||"Gönderi",
        data:item,
        createdAt:now()
    });

    posts=posts.filter(x=>x.id!==id);

    activity("archive","Bir içerik arşivlendi.");

    save();
    render();
}

function restoreArchive(id){

    const item=archive.find(x=>x.id===id);

    if(!item) return;

    if(item.type==="post"){
        posts.unshift(item.data);
    }

    archive=archive.filter(x=>x.id!==id);

    activity("archive","Bir içerik arşivden geri getirildi.");

    save();
    render();
}

/* =========================================================
   PROFILE SETTINGS
   ========================================================= */

async function profileSettings(){

    const name=document.getElementById("editName").value.trim();
    const username=document.getElementById("editUsername").value.trim();
    const bio=document.getElementById("editBio").value.trim();

    if(!name||!username){
        toast("Ad ve kullanıcı adı gerekli.");
        return;
    }

    const sevenDays=7*24*60*60*1000;

    current.nameChanges=current.nameChanges||[];

    current.nameChanges=
        current.nameChanges.filter(x=>now()-x<sevenDays);

    const changedName=name!==current.name;
    const changedUsername=
        username.toLowerCase()!==current.username.toLowerCase();

    if((changedName||changedUsername)&&current.nameChanges.length>=3){
        toast("7 gün içinde en fazla 3 isim/kullanıcı adı değişikliği.");
        return;
    }

    const duplicate=users.some(u=>
        u.id!==current.id&&
        u.username.toLowerCase()===username.toLowerCase()
    );

    if(duplicate){
        toast("Bu kullanıcı adı alınmış.");
        return;
    }

    const avatarFile=document.getElementById("avatarFile").files[0];
    const bgFile=document.getElementById("profileBgFile").files[0];

    if(changedName||changedUsername){
        current.nameChanges.push(now());
    }

    current.name=name;
    current.username=username;
    current.bio=bio;

    if(avatarFile){
        if(!avatarFile.type.startsWith("image/")){
            toast("Profil fotoğrafı için görsel seç.");
            return;
        }

        current.avatar=
            await readFileAsDataURL(avatarFile);
    }

    if(bgFile){
        if(!bgFile.type.startsWith("image/")){
            toast("Arka plan için görsel seç.");
            return;
        }

        current.profileBackground=
            await readFileAsDataURL(bgFile);
    }

    activity("profile","Profil bilgileri güncellendi.");

    save();
    closeModal();
    render();
}

function adminToggleBan(id){

    if(!isAdmin()) return;

    const u=userById(id);

    if(!u) return;

    u.banned=!u.banned;

    activity(
        "admin",
        `${u.username} hesabının ban durumu değiştirildi.`
    );

    save();
    render();
}

function adminGivePro(id,plan){

    if(!isAdmin()) return;

    const u=userById(id);

    if(!u) return;

    const data=PRO[plan];
    const started=now();

    u.plan="pro";
    u.proPlan=plan;
    u.proStartedAt=started;
    u.proExpiresAt=started+data.duration;
    u.proBoostUsed=0;

    if(plan==="yearly"){
        const d=new Date(started);
        u.proCycleKey=
            d.getFullYear()+"-"+d.getMonth();
    }else{
        u.proCycleKey=null;
    }

    activity(
        "admin",
        `${u.username} hesabına ${plan} PRO verildi.`
    );

    save();
    render();
}

function adminDeleteUser(id){

    if(!isAdmin()) return;

    if(id===current.id) return;

    users=users.filter(x=>x.id!==id);

    posts=posts.filter(x=>x.userId!==id);
    songs=songs.filter(x=>x.userId!==id);
    reels=reels.filter(x=>x.userId!==id);
    shop=shop.filter(x=>x.userId!==id);

    messages=messages.filter(
        x=>x.from!==id&&x.to!==id
    );

    notifications=notifications.filter(
        x=>x.userId!==id
    );

    save();
    render();
}

/* =========================================================
   MIDNIGHT PRO CHECK
   ========================================================= */

function scheduleProCheck(){

    const d=new Date();

    const tomorrow=new Date(
        d.getFullYear(),
        d.getMonth(),
        d.getDate()+1,
        0,0,1
    );

    const ms=tomorrow.getTime()-Date.now();

    setTimeout(()=>{
        users.forEach(expirePro);
        save();

        if(current){
            proCheck(current);
            render();
        }

        scheduleProCheck();
    },Math.max(ms,1000));
}
