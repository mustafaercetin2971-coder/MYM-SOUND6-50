<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#09070f">
<title>MYM SOUND</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#07070b;
    --bg2:#0d0b13;
    --panel:#111019;
    --panel2:#171522;
    --border:#292532;
    --text:#f7f5fb;
    --muted:#9893a5;
    --purple:#8b5cf6;
    --purple2:#6d3fe8;
    --purple3:#b18aff;
    --danger:#ef4444;
    --green:#22c55e;
    --yellow:#f5c542;
    --shadow:0 18px 50px rgba(0,0,0,.35);
}

body{
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at 20% 0%,rgba(139,92,246,.12),transparent 30%),
        radial-gradient(circle at 90% 30%,rgba(109,63,232,.08),transparent 28%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,
input,
textarea,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

img,
video{
    max-width:100%;
}

.hidden{
    display:none!important;
}

/* APP */

.app{
    min-height:100vh;
}

.sidebar{
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    width:245px;
    background:rgba(10,9,14,.94);
    border-right:1px solid var(--border);
    z-index:100;
    padding:20px 14px;
    display:flex;
    flex-direction:column;
    backdrop-filter:blur(18px);
}

.logo{
    display:flex;
    align-items:center;
    gap:11px;
    padding:8px 10px 25px;
    cursor:pointer;
}

.logoMark{
    width:40px;
    height:40px;
    border-radius:13px;
    background:linear-gradient(145deg,var(--purple3),var(--purple2));
    display:grid;
    place-items:center;
    font-weight:900;
    color:white;
    box-shadow:0 8px 25px rgba(139,92,246,.3);
}

.logoText{
    font-size:19px;
    font-weight:900;
    letter-spacing:.5px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:5px;
    overflow:auto;
}

.nav button{
    width:100%;
    border:0;
    background:transparent;
    color:var(--muted);
    text-align:left;
    padding:12px 13px;
    border-radius:11px;
    transition:.18s;
}

.nav button:hover{
    background:var(--panel);
    color:white;
}

.nav button.active{
    background:rgba(139,92,246,.15);
    color:white;
}

.navIcon{
    display:inline-block;
    width:27px;
    font-size:13px;
    color:var(--purple3);
}

.sidebarBottom{
    margin-top:auto;
    border-top:1px solid var(--border);
    padding-top:13px;
}

.main{
    margin-left:245px;
    min-height:100vh;
}

.topbar{
    height:70px;
    position:sticky;
    top:0;
    z-index:80;
    background:rgba(7,7,11,.83);
    backdrop-filter:blur(18px);
    border-bottom:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:15px;
    padding:0 28px;
}

.searchBox{
    flex:1;
    max-width:650px;
    position:relative;
}

.searchBox input{
    width:100%;
    background:var(--panel);
    border:1px solid var(--border);
    color:white;
    padding:12px 15px;
    border-radius:13px;
    outline:none;
}

.searchBox input:focus{
    border-color:var(--purple);
}

.topActions{
    margin-left:auto;
    display:flex;
    align-items:center;
    gap:8px;
}

.iconBtn{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    border-radius:11px;
    background:var(--panel);
    color:white;
}

.iconBtn:hover{
    border-color:var(--purple);
}

.notificationBadge{
    position:absolute;
    transform:translate(19px,-27px);
    background:var(--danger);
    color:white;
    border-radius:99px;
    min-width:17px;
    height:17px;
    font-size:10px;
    display:grid;
    place-items:center;
    font-weight:800;
}

.content{
    max-width:1180px;
    margin:auto;
    padding:30px;
}

.pageHeader{
    display:flex;
    justify-content:space-between;
    gap:20px;
    align-items:flex-start;
    margin-bottom:22px;
}

.pageTitle{
    font-size:30px;
    font-weight:900;
}

.pageSubtitle{
    color:var(--muted);
    margin-top:6px;
}

.btn{
    border:1px solid var(--border);
    background:var(--panel);
    color:white;
    border-radius:10px;
    padding:10px 15px;
    transition:.18s;
}

.btn:hover{
    border-color:var(--purple);
    transform:translateY(-1px);
}

.btn.primary{
    background:linear-gradient(135deg,var(--purple),var(--purple2));
    border-color:transparent;
}

.btn.danger{
    color:#ffb3b3;
    border-color:rgba(239,68,68,.35);
}

.btn.small{
    padding:7px 10px;
    font-size:12px;
}

/* CARDS */

.card{
    background:rgba(17,16,25,.88);
    border:1px solid var(--border);
    border-radius:17px;
    box-shadow:var(--shadow);
}

.grid{
    display:grid;
    gap:17px;
}

.grid2{
    grid-template-columns:repeat(2,minmax(0,1fr));
}

.grid3{
    grid-template-columns:repeat(3,minmax(0,1fr));
}

.empty{
    padding:55px 20px;
    text-align:center;
    color:var(--muted);
    border:1px dashed var(--border);
    border-radius:16px;
}

.empty strong{
    color:white;
    display:block;
    margin-bottom:8px;
}

.statGrid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin:18px 0;
}

.stat{
    background:var(--panel);
    border:1px solid var(--border);
    padding:16px;
    border-radius:13px;
}

.stat b{
    display:block;
    font-size:21px;
}

.stat span{
    color:var(--muted);
    font-size:12px;
}

/* HOME */

.feedTabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin-bottom:18px;
}

.feedTabs button{
    white-space:nowrap;
}

.post{
    padding:18px;
}

.postHeader{
    display:flex;
    align-items:center;
    gap:11px;
}

.avatar{
    width:43px;
    height:43px;
    border-radius:50%;
    object-fit:cover;
    background:linear-gradient(135deg,#262031,#15121d);
    border:1px solid var(--border);
}

.avatar.big{
    width:88px;
    height:88px;
}

.avatar.tiny{
    width:34px;
    height:34px;
}

.userInfo{
    flex:1;
    min-width:0;
}

.userName{
    font-weight:800;
}

.userMeta{
    color:var(--muted);
    font-size:12px;
    margin-top:3px;
}

.onlineDot{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background:#666;
    margin-right:4px;
}

.onlineDot.online{
    background:var(--green);
}

.postMenu{
    color:var(--muted);
}

.postText{
    margin:17px 0;
    white-space:pre-wrap;
    line-height:1.65;
}

.postMedia{
    margin-top:13px;
    border-radius:14px;
    overflow:hidden;
    background:#08070c;
}

.postMedia img{
    width:100%;
    display:block;
    max-height:620px;
    object-fit:cover;
}

.postMedia video{
    width:100%;
    max-height:620px;
    display:block;
}

.postActions{
    display:flex;
    align-items:center;
    gap:7px;
    padding-top:14px;
    margin-top:14px;
    border-top:1px solid var(--border);
}

.actionBtn{
    border:0;
    background:transparent;
    color:var(--muted);
    padding:8px 9px;
    border-radius:8px;
}

.actionBtn:hover{
    background:var(--panel2);
    color:white;
}

.actionBtn.active{
    color:var(--purple3);
}

.commentBox{
    display:flex;
    gap:8px;
    margin-top:13px;
}

.commentBox input{
    flex:1;
    min-width:0;
    background:var(--panel2);
    border:1px solid var(--border);
    color:white;
    padding:9px 11px;
    border-radius:9px;
    outline:none;
}

.comments{
    margin-top:10px;
}

.comment{
    display:flex;
    gap:9px;
    padding:8px 0;
    border-bottom:1px solid rgba(255,255,255,.04);
}

.commentText{
    font-size:13px;
    line-height:1.5;
}

.songCard{
    overflow:hidden;
}

.songCover{
    width:100%;
    aspect-ratio:1;
    object-fit:cover;
    background:#15111e;
}

.songBody{
    padding:14px;
}

.songTitle{
    font-weight:850;
}

.songArtist{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.songDescription{
    color:#bbb5c7;
    font-size:13px;
    margin:9px 0;
    line-height:1.45;
}

.audio{
    width:100%;
    margin-top:10px;
}

.songActions{
    display:flex;
    gap:5px;
    margin-top:8px;
    flex-wrap:wrap;
}

/* CHANNEL */

.channelHero{
    min-height:250px;
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    position:relative;
    background:var(--panel);
}

.channelCover{
    height:185px;
    background:
        linear-gradient(135deg,rgba(139,92,246,.55),rgba(15,12,25,.9)),
        #171321;
    background-size:cover;
    background-position:center;
}

.channelInfo{
    position:relative;
    padding:0 24px 22px;
}

.channelAvatar{
    margin-top:-45px;
    position:relative;
}

.channelInfoRow{
    display:flex;
    align-items:flex-start;
    gap:16px;
}

.channelText{
    flex:1;
    padding-top:8px;
}

.channelName{
    font-size:24px;
    font-weight:900;
}

.channelBio{
    color:var(--muted);
    margin-top:6px;
    line-height:1.5;
}

.channelActions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    padding-top:8px;
}

.channelStats{
    display:flex;
    gap:25px;
    color:var(--muted);
    font-size:13px;
    margin-top:13px;
}

.channelTabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    margin:18px 0;
}

/* PROFILE */

.profileHero{
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    position:relative;
    background:var(--panel);
}

.profileBackground{
    height:260px;
    background:
        linear-gradient(135deg,rgba(139,92,246,.4),rgba(8,7,12,.92)),
        #15111d;
    background-size:cover;
    background-position:center;
}

.profileInfo{
    padding:0 25px 25px;
    margin-top:-50px;
    position:relative;
}

.profileRow{
    display:flex;
    align-items:flex-end;
    gap:17px;
}

.profileDetails{
    flex:1;
    padding-bottom:6px;
}

.profileName{
    font-size:27px;
    font-weight:900;
}

.roleBadge,
.planBadge{
    display:inline-block;
    padding:4px 8px;
    border-radius:7px;
    font-size:10px;
    font-weight:800;
    margin-top:5px;
    background:rgba(139,92,246,.15);
    color:var(--purple3);
}

.planBadge{
    background:rgba(245,197,66,.12);
    color:#f5d778;
}

.profileBio{
    color:var(--muted);
    margin-top:10px;
    line-height:1.55;
}

/* SHOP */

.shopBanner{
    min-height:240px;
    border:1px solid var(--border);
    border-radius:20px;
    overflow:hidden;
    background:
        linear-gradient(135deg,rgba(139,92,246,.5),rgba(10,8,15,.9)),
        #17131f;
    background-size:cover;
    background-position:center;
    padding:25px;
    display:flex;
    align-items:flex-end;
}

.shopBannerContent{
    width:100%;
}

.shopBannerTitle{
    font-size:29px;
    font-weight:900;
}

.shopBannerDescription{
    color:#d0cad9;
    margin-top:5px;
}

.shopCard{
    padding:17px;
}

.shopTop{
    display:flex;
    align-items:center;
    gap:10px;
}

.shopType{
    margin-left:auto;
    color:var(--purple3);
    font-size:11px;
    font-weight:800;
}

.shopTitle{
    font-size:18px;
    font-weight:850;
    margin-top:13px;
}

.shopDescription{
    color:var(--muted);
    font-size:13px;
    margin-top:6px;
    line-height:1.5;
}

.shopAudio{
    width:100%;
    margin-top:13px;
}

/* PEOPLE */

.person{
    padding:17px;
    display:flex;
    align-items:center;
    gap:12px;
}

.personMain{
    flex:1;
    min-width:0;
}

.personStats{
    color:var(--muted);
    font-size:11px;
    margin-top:5px;
}

.personActions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

/* MESSAGES */

.messagesLayout{
    display:grid;
    grid-template-columns:300px 1fr;
    height:650px;
    overflow:hidden;
}

.conversationList{
    border-right:1px solid var(--border);
    overflow:auto;
}

.conversation{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px;
    border-bottom:1px solid rgba(255,255,255,.04);
    cursor:pointer;
}

.conversation:hover,
.conversation.active{
    background:rgba(139,92,246,.1);
}

.conversationInfo{
    min-width:0;
    flex:1;
}

.lastMessage{
    color:var(--muted);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:11px;
    margin-top:3px;
}

.chat{
    display:flex;
    flex-direction:column;
    min-width:0;
}

.chatHeader{
    padding:14px 17px;
    border-bottom:1px solid var(--border);
}

.chatMessages{
    flex:1;
    overflow:auto;
    padding:18px;
}

.messageRow{
    display:flex;
    margin-bottom:10px;
}

.messageRow.mine{
    justify-content:flex-end;
}

.messageBubble{
    max-width:72%;
    padding:10px 12px;
    border-radius:13px;
    background:var(--panel2);
    border:1px solid var(--border);
    line-height:1.45;
    font-size:13px;
}

.messageRow.mine .messageBubble{
    background:rgba(139,92,246,.22);
    border-color:rgba(139,92,246,.3);
}

.chatInput{
    padding:13px;
    display:flex;
    gap:8px;
    border-top:1px solid var(--border);
}

.chatInput input{
    flex:1;
    min-width:0;
    background:var(--panel2);
    color:white;
    border:1px solid var(--border);
    border-radius:10px;
    padding:11px;
    outline:none;
}

/* SETTINGS */

.settingsGrid{
    display:grid;
    grid-template-columns:230px 1fr;
    gap:17px;
}

.settingsMenu{
    padding:10px;
    height:max-content;
}

.settingsMenu button{
    width:100%;
    text-align:left;
    border:0;
    background:transparent;
    color:var(--muted);
    padding:11px;
    border-radius:9px;
}

.settingsMenu button.active,
.settingsMenu button:hover{
    background:rgba(139,92,246,.12);
    color:white;
}

.settingsPanel{
    padding:22px;
}

.formGroup{
    margin-bottom:17px;
}

.formGroup label{
    display:block;
    color:#d6d1dd;
    font-size:12px;
    margin-bottom:7px;
}

.input,
.textarea,
.select{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--border);
    color:white;
    padding:11px 12px;
    border-radius:10px;
    outline:none;
}

.textarea{
    min-height:110px;
    resize:vertical;
}

.input:focus,
.textarea:focus,
.select:focus{
    border-color:var(--purple);
}

.settingRow{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:15px 0;
    border-bottom:1px solid var(--border);
}

.settingDescription{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

.toggle{
    width:45px;
    height:25px;
    border-radius:99px;
    background:#302c38;
    border:0;
    position:relative;
}

.toggle:after{
    content:"";
    position:absolute;
    width:19px;
    height:19px;
    top:3px;
    left:3px;
    background:white;
    border-radius:50%;
    transition:.2s;
}

.toggle.on{
    background:var(--purple);
}

.toggle.on:after{
    left:23px;
}

/* ACTIVITY */

.activityItem{
    display:flex;
    gap:12px;
    padding:15px;
    border-bottom:1px solid var(--border);
}

.activityDot{
    width:9px;
    height:9px;
    background:var(--purple);
    border-radius:50%;
    margin-top:6px;
}

.activityTime{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

/* NOTIFICATIONS */

.notificationItem{
    padding:15px;
    border-bottom:1px solid var(--border);
    display:flex;
    gap:10px;
}

.notificationItem.unread{
    background:rgba(139,92,246,.07);
}

.notificationText{
    flex:1;
    font-size:13px;
    line-height:1.45;
}

/* SEARCH */

.searchResults{
    display:grid;
    gap:12px;
}

.resultSection{
    padding:18px;
}

.resultSection h3{
    margin-bottom:12px;
}

.searchResult{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid rgba(255,255,255,.05);
}

.searchResult:last-child{
    border-bottom:0;
}

/* REELS */

.reel{
    overflow:hidden;
}

.reelVideo{
    width:100%;
    aspect-ratio:9/14;
    max-height:700px;
    object-fit:cover;
    background:#050408;
}

.reelBody{
    padding:14px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(7px);
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal.show{
    display:flex;
}

.modalBox{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    background:#100e17;
    border:1px solid var(--border);
    border-radius:19px;
    box-shadow:0 30px 90px rgba(0,0,0,.65);
}

.modalHeader{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:17px 20px;
    border-bottom:1px solid var(--border);
}

.modalHeader h2{
    font-size:19px;
}

.modalBody{
    padding:20px;
}

.modalFooter{
    display:flex;
    justify-content:flex-end;
    gap:8px;
    padding:15px 20px;
    border-top:1px solid var(--border);
}

/* TOAST */

.toastContainer{
    position:fixed;
    right:20px;
    bottom:90px;
    z-index:2000;
    display:flex;
    flex-direction:column;
    gap:8px;
}

.toast{
    background:#17141e;
    border:1px solid var(--border);
    padding:12px 15px;
    border-radius:11px;
    box-shadow:var(--shadow);
    font-size:13px;
    animation:toastIn .2s ease;
}

@keyframes toastIn{
    from{transform:translateY(10px);opacity:0}
    to{transform:translateY(0);opacity:1}
}

/* PLAYER */

.player{
    position:fixed;
    left:245px;
    right:0;
    bottom:0;
    height:78px;
    z-index:300;
    background:rgba(13,11,19,.96);
    border-top:1px solid var(--border);
    backdrop-filter:blur(18px);
    display:none;
    align-items:center;
    gap:12px;
    padding:10px 18px;
}

.player.show{
    display:flex;
}

.playerCover{
    width:54px;
    height:54px;
    border-radius:9px;
    object-fit:cover;
}

.playerInfo{
    width:190px;
    min-width:100px;
}

.playerTitle{
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.playerArtist{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.playerCenter{
    flex:1;
    display:flex;
    align-items:center;
    gap:8px;
}

.playerProgress{
    flex:1;
}

.playerTime{
    color:var(--muted);
    font-size:10px;
    min-width:65px;
}

.playerControls{
    display:flex;
    gap:5px;
}

.player input[type=range]{
    accent-color:var(--purple);
}

.mobileNav{
    display:none;
}

/* UPLOAD PREVIEW */

.previewBox{
    margin-top:10px;
    border:1px dashed var(--border);
    border-radius:12px;
    padding:12px;
    text-align:center;
}

.previewBox img{

<script>
/* =========================================================
   MYM SOUND
   SINGLE FILE APP
========================================================= */

const KEY = {
    users:"mym_users",
    posts:"mym_posts",
    reels:"mym_reels",
    songs:"mym_songs",
    shop:"mym_shop",
    comments:"mym_comments",
    messages:"mym_messages",
    activities:"mym_activities",
    notifications:"mym_notifications",
    history:"mym_history",
    current:"mym_current_user",
    settings:"mym_settings"
};

let state = {
    page:"home",
    homeTab:"all",
    channelId:null,
    channelTab:"posts",
    settingsTab:"profile",
    peopleSearch:"",
    messageUser:null,
    playerIndex:0,
    playerQueue:[],
    shuffle:false
};

function read(key, fallback=[]){
    try{
        const value = localStorage.getItem(key);
        return value ? JSON.parse(value) : fallback;
    }catch(e){
        console.error(e);
        return fallback;
    }
}

function write(key,value){
    localStorage.setItem(key,JSON.stringify(value));
}

let users = read(KEY.users,[]);
let posts = read(KEY.posts,[]);
let reels = read(KEY.reels,[]);
let songs = read(KEY.songs,[]);
let shops = read(KEY.shop,[]);
let comments = read(KEY.comments,[]);
let messages = read(KEY.messages,[]);
let activities = read(KEY.activities,[]);
let notifications = read(KEY.notifications,[]);
let history = read(KEY.history,[]);

let currentUserId = localStorage.getItem(KEY.current);

function uid(prefix="id"){
    return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
}

function escapeHTML(value=""){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function timeAgo(date){
    const d = Date.now()-new Date(date).getTime();
    const m = Math.floor(d/60000);

    if(m < 1) return "az önce";
    if(m < 60) return m+" dk";
    const h = Math.floor(m/60);
    if(h < 24) return h+" sa";
    const day = Math.floor(h/24);
    if(day < 30) return day+" gün";
    return Math.floor(day/30)+" ay";
}

function getUser(id){
    return users.find(u=>u.id===id);
}

function me(){
    return getUser(currentUserId);
}

function isBlocked(targetId){
    const a = me();
    const b = getUser(targetId);

    if(!a || !b) return true;

    return (a.blockedUsers||[]).includes(targetId) ||
           (b.blockedUsers||[]).includes(a.id);
}

function isFollowing(id){
    return (me()?.following||[]).includes(id);
}

function avatarOf(user){
    return user?.avatarMediaId ? mediaURL(user.avatarMediaId) : "";
}

function userAvatar(user,cls="avatar"){
    const url = avatarOf(user);

    if(url){
        return `<img class="${cls}" src="${url}" alt="">`;
    }

    const letter = escapeHTML((user?.name||"U").charAt(0).toUpperCase());

    return `<div class="${cls}" style="display:grid;place-items:center;font-weight:900;background:linear-gradient(135deg,#241a39,#12101a)">${letter}</div>`;
}

function onlineHTML(user){
    if(!user) return "";
    return `<span class="onlineDot ${user.online ? "online":""}"></span>${user.online ? "Çevrimiçi":"Çevrimdışı"}`;
}

function toast(text){
    const box = document.createElement("div");
    box.className="toast";
    box.textContent=text;
    document.getElementById("toastContainer").appendChild(box);

    setTimeout(()=>box.remove(),3000);
}

function saveAll(){
    write(KEY.users,users);
    write(KEY.posts,posts);
    write(KEY.reels,reels);
    write(KEY.songs,songs);
    write(KEY.shop,shops);
    write(KEY.comments,comments);
    write(KEY.messages,messages);
    write(KEY.activities,activities);
    write(KEY.notifications,notifications);
    write(KEY.history,history);
}

function addActivity(type,text,meta={}){
    activities.unshift({
        id:uid("act"),
        userId:currentUserId,
        type,
        text,
        meta,
        createdAt:new Date().toISOString()
    });

    if(activities.length>1000){
        activities=activities.slice(0,1000);
    }

    write(KEY.activities,activities);
}

function notify(userId,type,text,meta={}){
    if(!userId || userId===currentUserId) return;

    const target = getUser(userId);

    if(target?.settings?.notifications===false) return;

    notifications.unshift({
        id:uid("not"),
        userId,
        type,
        text,
        meta,
        read:false,
        createdAt:new Date().toISOString()
    });

    notifications=notifications.slice(0,1000);
    write(KEY.notifications,notifications);
    updateNotificationBadge();
}

function unreadNotifications(){
    return notifications.filter(n=>n.userId===currentUserId && !n.read).length;
}

function updateNotificationBadge(){
    const n=unreadNotifications();
    const el=document.getElementById("notificationBadge");

    if(!el) return;

    el.textContent=n>99 ? "99+" : n;
    el.classList.toggle("hidden",n===0);
}

/* =========================================================
   INDEXED DB MEDIA
========================================================= */

const DB_NAME="mym_sound_media";
const DB_VERSION=1;
let dbPromise=null;

function openDB(){
    if(dbPromise) return dbPromise;

    dbPromise = new Promise((resolve,reject)=>{
        const request=indexedDB.open(DB_NAME,DB_VERSION);

        request.onupgradeneeded=()=>{
            const db=request.result;

            if(!db.objectStoreNames.contains("media")){
                db.createObjectStore("media",{keyPath:"id"});
            }
        };

        request.onsuccess=()=>resolve(request.result);
        request.onerror=()=>reject(request.error);
    });

    return dbPromise;
}

async function saveMedia(file,id=uid("media")){
    const db=await openDB();

    return new Promise((resolve,reject)=>{
        const tx=db.transaction("media","readwrite");

        tx.objectStore("media").put({
            id,
            blob:file,
            type:file.type,
            name:file.name||""
        });

        tx.oncomplete=()=>resolve(id);
        tx.onerror=()=>reject(tx.error);
    });
}

async function getMedia(id){
    if(!id) return null;

    const db=await openDB();

    return new Promise((resolve,reject)=>{
        const tx=db.transaction("media","readonly");
        const req=tx.objectStore("media").get(id);

        req.onsuccess=()=>resolve(req.result||null);
        req.onerror=()=>reject(req.error);
    });
}

const mediaCache=new Map();

async function mediaURL(id){
    if(!id) return "";

    if(mediaCache.has(id)) return mediaCache.get(id);

    const item=await getMedia(id);

    if(!item) return "";

    const url=URL.createObjectURL(item.blob);
    mediaCache.set(id,url);

    return url;
}

async function mediaType(id){
    const item=await getMedia(id);
    return item?.type||"";
}

/* =========================================================
   DEFAULT USER
========================================================= */

function ensureAccount(){
    if(!users.length){
        const id=uid("user");

        users=[{
            id,
            name:"MYM Kullanıcısı",
            username:"mymuser",
            password:"",
            role:"Dinleyici",
            plan:"free",
            bio:"MYM SOUND kullanıcısı",
            avatarMediaId:null,
            profileBackgroundMediaId:null,
            shopBackgroundMediaId:null,
            followers:[],
            following:[],
            blockedUsers:[],
            nameChanges:[],
            online:true,
            lastSeen:new Date().toISOString(),
            settings:{
                notifications:true,
                autoplay:false,
                privateProfile:false
            }
        }];

        currentUserId=id;
        localStorage.setItem(KEY.current,id);
        saveAll();
    }

    if(!getUser(currentUserId)){
        currentUserId=users[0].id;
        localStorage.setItem(KEY.current,currentUserId);
    }

    const u=me();

    if(u){
        u.online=true;
        u.lastSeen=new Date().toISOString();
        saveAll();
    }
}

ensureAccount();

/* =========================================================
   NAVIGATION
========================================================= */

function go(page){
    state.page=page;
    state.channelId=null;

    document.querySelectorAll("[data-page]").forEach(btn=>{
        btn.classList.toggle("active",btn.dataset.page===page);
    });

    renderPage();
    window.scrollTo({top:0,behavior:"smooth"});
}

function renderPage(){
    const c=document.getElementById("content");

    if(!c) return;

    switch(state.page){
        case "home":
            c.innerHTML=renderHome();
            hydrateMedia();
            break;

        case "reels":
            c.innerHTML=renderReels();
            hydrateMedia();
            break;

        case "channels":
            c.innerHTML=renderChannels();
            hydrateMedia();
            break;

        case "shop":
            c.innerHTML=renderShop();
            hydrateMedia();
            break;

        case "people":
            c.innerHTML=renderPeople();
            hydrateMedia();
            break;

        case "messages":
            c.innerHTML=renderMessages();
            hydrateMedia();
            break;

        case "profile":
            c.innerHTML=renderProfile();
            hydrateMedia();
            break;

        case "notifications":
            c.innerHTML=renderNotifications();
            hydrateMedia();
            break;

        case "settings":
            c.innerHTML=renderSettings();
            hydrateMedia();
            break;

        case "search":
            c.innerHTML=renderSearch(state.search||"");
            hydrateMedia();
            break;

        case "channel":
            c.innerHTML=renderChannel(state.channelId);
            hydrateMedia();
            break;

        default:
            go("home");
    }

    updateNotificationBadge();
}

/* =========================================================
   HOME
========================================================= */

function visiblePosts(){
    const list=posts.filter(p=>!isBlocked(p.userId));

    if(state.homeTab==="following"){
        return list.filter(p=>p.userId===currentUserId || isFollowing(p.userId));
    }

    if(state.homeTab==="new"){
        return [...list].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
    }

    if(state.homeTab==="popular"){
        return [...list].sort((a,b)=>(b.likes?.length||0)-(a.likes?.length||0));
    }

    return [...list].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
}

function renderHome(){
    const list=visiblePosts();

    const songList=songs
        .filter(s=>!isBlocked(s.userId))
        .sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))
        .slice(0,8);

    return `
        <div class="pageHeader">
            <div>
                <div class="pageTitle">Ana Sayfa</div>
                <div class="pageSubtitle">MYM SOUND dünyasındaki yeni içerikler</div>
            </div>

            <button class="btn primary" onclick="openCreateMenu()">+ Oluştur</button>
        </div>

        <div class="feedTabs">
            <button class="btn ${state.homeTab==="all"?"primary":""}" onclick="setHomeTab('all')">Sana Özel</button>
            <button class="btn ${state.homeTab==="following"?"primary":""}" onclick="setHomeTab('following')">Takip Ettiklerin</button>
            <button class="btn ${state.homeTab==="new"?"primary":""}" onclick="setHomeTab('new')">Yeni</button>
            <button class="btn ${state.homeTab==="popular"?"primary":""}" onclick="setHomeTab('popular')">Popüler</button>
        </div>

        <div class="grid grid2" style="align-items:start">

            <div>
                <h2 style="font-size:18px;margin-bottom:12px">Gönderiler</h2>

                <div class="grid">
                    ${
                        list.length
                        ? list.map(renderPost).join("")
                        : `
                            <div class="empty">
                                <strong>Henüz gönderi yok</strong>
                                İlk gönderini oluşturarak ana sayfayı doldur.
                                <br><br>
                                <button class="btn primary" onclick="openPostModal()">Gönderi oluştur</button>
                            </div>
                        `
                    }
                </div>
            </div>

            <div>
                <h2 style="font-size:18px;margin-bottom:12px">Yeni Şarkılar</h2>

                <div class="grid">
                    ${
                        songList.length
                        ? songList.map(renderSongCard).join("")
                        : `
                            <div class="empty">
                                <strong>Henüz şarkı yok</strong>
                                İlk şarkını yükleyebilirsin.
                                <br><br>
                                <button class="btn primary" onclick="openSongModal()">Şarkı ekle</button>
                            </div>
                        `
                    }
                </div>
            </div>

        </div>
    `;
}

function setHomeTab(tab){
    state.homeTab=tab;
    renderPage();
}

/* =========================================================
   POST
========================================================= */

function renderPost(post){
    const user=getUser(post.userId);

    if(!user || isBlocked(post.userId)) return "";

    const liked=(post.likes||[]).includes(currentUserId);
    const archived=(me()?.archive||[]).includes(post.id);
    const cs=comments.filter(c=>c.postId===post.id);

    return `
        <article class="card post">

            <div class="postHeader">
                ${userAvatar(user)}

                <div class="userInfo">
                    <div class="userName">${escapeHTML(user.name)}</div>
                    <div class="userMeta">
                        ${escapeHTML(user.role)} · ${onlineHTML(user)} · ${timeAgo(post.createdAt)}
                    </div>
                </div>

                ${
                    post.userId===currentUserId
                    ? `
                        <button class="actionBtn" onclick="openPostActions('${post.id}')">...</button>
                    `
                    : `
                        <button class="actionBtn" onclick="openUserActions('${post.userId}')">...</button>
                    `
                }
            </div>

            ${
                post.text
                ? `<div class="postText">${escapeHTML(post.text)}</div>`
                : ""
            }

            ${
                post.mediaId
                ? `
                    <div class="postMedia">
                        <div id="media_${post.id}" data-media="${post.mediaId}"></div>
                    </div>
                `
                : ""
            }

            <div class="postActions">
                <button class="actionBtn ${liked?"active":""}" onclick="togglePostLike('${post.id}')">
                    ${liked?"Beğenildi":"Beğen"} ${post.likes?.length||0}
                </button>

                <button class="actionBtn" onclick="focusComment('${post.id}')">
                    Yorum ${cs.length}
                </button>

                <button class="actionBtn ${archived?"active":""}" onclick="toggleArchive('${post.id}')">
                    ${archived?"Arşivden çıkar":"Arşivle"}
                </button>

                <button class="actionBtn" onclick="sharePost('${post.id}')">
                    Paylaş
                </button>
            </div>

            <div class="comments">
                ${
                    cs.slice(-5).map(renderComment).join("")
                }
            </div>

            <div class="commentBox">
                <input
                    id="comment_${post.id}"
                    placeholder="Yorum yaz..."
                    onkeydown="commentKey(event,'${post.id}')"
                >
                <button class="btn small" onclick="addComment('${post.id}')">Gönder</button>
            </div>

        </article>
    `;
}

async function hydrateMedia(){
    const els=document.querySelectorAll("[data-media]");

    for(const el of els){
        const id=el.dataset.media;

        if(!id) continue;

        const type=await mediaType(id);
        const url=await mediaURL(id);

        if(!url) continue;

        if(type.startsWith("image/")){
            el.innerHTML=`<img src="${url}" alt="">`;
        }
        else if(type.startsWith("video/")){
            el.innerHTML=`<video src="${url}" controls playsinline></video>`;
        }
        else if(type.startsWith("audio/")){
            el.innerHTML=`<audio src="${url}" controls class="audio"></audio>`;
        }
    }

    await hydrateSpecialImages();
}

async function hydrateSpecialImages(){
    const elements=document.querySelectorAll("[data-image-media]");

    for(const el of elements){
        const id=el.dataset.imageMedia;
        const url=await mediaURL(id);

        if(url){
            el.style.backgroundImage=`url("${url}")`;
        }
    }

    const srcElements=document.querySelectorAll("[data-src-media]");

    for(const el of srcElements){
        const url=await mediaURL(el.dataset.srcMedia);

        if(url){
            el.src=url;
        }
    }
}

function renderComment(c){
    const u=getUser(c.userId);

    if(!u) return "";

    return `
        <div class="comment">
            ${userAvatar(u,"avatar tiny")}
            <div class="commentText">
                <b>${escapeHTML(u.name)}</b>
                ${escapeHTML(c.text)}
                ${
                    c.userId===currentUserId
                    ? `<button class="actionBtn small" onclick="deleteComment('${c.id}')">Sil</button>`
                    : ""
                }
            </div>
        </div>
    `;
}

function togglePostLike(postId){
    const p=posts.find(x=>x.id===postId);
    if(!p) return;

    p.likes=p.likes||[];

    const index=p.likes.indexOf(currentUserId);

    if(index>=0){
        p.likes.splice(index,1);
        addActivity("like_remove","Bir gönderinin beğenisini kaldırdın",{postId});
    }else{
        p.likes.push(currentUserId);
        addActivity("like","Bir gönderiyi beğendin",{postId});

        notify(
            p.userId,
            "like",
            `${me().name} gönderini beğendi.`,
            {postId}
        );
    }

async function hydrateSpecialAudio(){
    const audios=document.querySelectorAll("[data-song-audio]");

    for(const audio of audios){
        const id=audio.dataset.songAudio;
        const url=await mediaURL(id);

        if(url && !audio.src){
            audio.src=url;
        }

        audio.onplay=()=>{
            const songId=audio.dataset.songId;

            if(songId){
                recordSongPlay(songId);
            }
        };
    }
}

const originalHydrateMedia=hydrateMedia;

hydrateMedia=async function(){
    await originalHydrateMedia();

};

function toggleFavoriteSong(id){

    u.likedSongs=u.likedSongs||[];

    const i=u.likedSongs.indexOf(id);

    if(i>=0){

function recordSongPlay(id){
    const s=songs.find(x=>x.id===id);

    if(!s) return;

    s.plays=(s.plays||0)+1;

    history.unshift({
        id:uid("hist"),
        userId:currentUserId,
        songId:id,
        createdAt:new Date().toISOString()
    });

    history=history.slice(0,200);

    saveAll();
}

function playSong(id){
    const index=songs.findIndex(s=>s.id===id);

    if(index<0) return;

    state.playerQueue=songs.filter(s=>!isBlocked(s.userId));
    state.playerIndex=state.playerQueue.findIndex(s=>s.id===id);

    if(state.playerIndex<0) return;

    loadPlayerSong(state.playerIndex,true);
}

async function loadPlayerSong(index,autoPlay=true){
    const song=state.playerQueue[index];

    if(!song) return;

    state.playerIndex=index;

    const audio=document.getElementById("globalAudio");
    const cover=document.getElementById("playerCover");

    const url=await mediaURL(song.mediaId);

    if(!url) return;

    audio.src=url;

    document.getElementById("playerTitle").textContent=song.name;
    document.getElementById("playerArtist").textContent=getUser(song.userId)?.name||"MYM SOUND";

    const coverURL=await mediaURL(song.coverMediaId);

    if(coverURL){
        cover.src=coverURL;
    }else{
        cover.src="";
    }

    document.getElementById("player").classList.add("show");

    if(autoPlay){
        audio.play().catch(()=>{});
    }

    audio.onended=()=>{
        nextSong();
    };

    addActivity("play_song",`"${song.name}" şarkısını dinledin`,{songId:song.id});
}

function togglePlayer(){
    const audio=document.getElementById("globalAudio");

    if(!audio.src){
        if(state.playerQueue.length){
            loadPlayerSong(state.playerIndex,true);
        }
        return;
    }

    if(audio.paused){
        audio.play().catch(()=>{});
    }else{
        audio.pause();
    }
}

function nextSong(){
    if(!state.playerQueue.length) return;

    let next;

    if(state.shuffle){
        next=Math.floor(Math.random()*state.playerQueue.length);
    }else{
        next=state.playerIndex+1;

        if(next>=state.playerQueue.length){
            next=0;
        }
    }

    loadPlayerSong(next,true);
}

function previousSong(){
    if(!state.playerQueue.length) return;

    let prev=state.playerIndex-1;

    if(prev<0){
        prev=state.playerQueue.length-1;
    }

    loadPlayerSong(prev,true);
}

function toggleShuffle(){
    state.shuffle=!state.shuffle;
    toast(state.shuffle?"Karışık oynatma açıldı.":"Karışık oynatma kapatıldı.");
}

/* =========================================================
   FOLLOW / BLOCK
========================================================= */

function toggleFollow(id){
    const target=getUser(id);
    const u=me();

    if(!target || !u || id===u.id) return;

    if(isBlocked(id)){
        toast("Engellenen kullanıcı takip edilemez.");
        return;
    }

    u.following=u.following||[];
    target.followers=target.followers||[];

    const index=u.following.indexOf(id);

    if(index>=0){
        u.following.splice(index,1);

        const fi=target.followers.indexOf(u.id);

        if(fi>=0) target.followers.splice(fi,1);

        addActivity("unfollow",`${target.name} kullanıcısını takipten çıktın`,{userId:id});
        toast("Takipten çıkıldı.");
    }else{
        u.following.push(id);

        if(!target.followers.includes(u.id)){
            target.followers.push(u.id);
        }

        addActivity("follow",`${target.name} kullanıcısını takip ettin`,{userId:id});
        notify(id,"follow",`${u.name} seni takip etmeye başladı.`,{userId:u.id});
        toast("Takip edildi.");
    }

    saveAll();
    renderPage();
}

function toggleBlock(id){
    const u=me();
    const target=getUser(id);

    if(!u || !target || id===u.id) return;

    u.blockedUsers=u.blockedUsers||[];

    const i=u.blockedUsers.indexOf(id);

    if(i>=0){
        u.blockedUsers.splice(i,1);
        addActivity("unblock",`${target.name} kullanıcısının engelini kaldırdın`,{userId:id});
        toast("Engel kaldırıldı.");
    }else{
        u.blockedUsers.push(id);

        u.following=(u.following||[]).filter(x=>x!==id);
        target.followers=(target.followers||[]).filter(x=>x!==u.id);

        addActivity("block",`${target.name} kullanıcısını engelledin`,{userId:id});
        toast("Kullanıcı engellendi.");

    closeModal();
    renderPage();
}

async function hydrateShopAudio(){
    const els=document.querySelectorAll("[data-shop-audio]");

    for(const el of els){
        const url=await mediaURL(el.dataset.shopAudio);

        if(url && !el.src){
            el.src=url;
        }
    }
}

const previousHydrateSpecialAudio=hydrateSpecialAudio;

hydrateSpecialAudio=async function(){
    await previousHydrateSpecialAudio();
    await hydrateShopAudio();
};

function playShopAudio(id){
    const item=shops.find(x=>x.id===id);

    if(!item) return;

    const song={
        id:"shop_"+item.id,
        name:item.name,
        description:item.description,
        mediaId:item.mediaId,
        coverMediaId:null,
        userId:item.userId,
        likes:[],
        plays:0
    };

    state.playerQueue=[song];
    state.playerIndex=0;
    loadPlayerSong(0,true);
}

function renderMessages(){
    const people=users.filter(u=>
        u.id!==currentUserId &&
        !isBlocked(u.id)

        ? getUser(state.messageUser)
        : null;

    return `
        <div class="pageHeader">
            <div>

                <div class="pageSubtitle">Kullanıcılarla mesajlaş</div>
            </div>
        </div>

        <div class="card messagesLayout">

            <div class="conversationList">

                ${
                    people.length
                    ? people.map(renderConversation).join("")
                    : `<div class="empty" style="margin:12px">Konuşma yok</div>`
                }

            </div>

            <div class="chat">

                ${
                    active && !isBlocked(active.id)
                    ? renderChat(active)
                    : `
                        <div style="display:grid;place-items:center;height:100%;color:var(--muted)">
                            Soldan bir kişi seç.
                        </div>
                    `
                }

}

function conversationMessages(userId){
    return messages
        .filter(m=>
            (m.fromId===currentUserId && m.toId===userId) ||
            (m.fromId===userId && m.toId===currentUserId)
        )
        .sort((a,b)=>new Date(a.createdAt)-new Date(b.createdAt));
}

function renderConversation(user){
    const list=conversationMessages(user.id);
    const last=list[list.length-1];

    return `
        <div class="conversation ${state.messageUser===user.id?"active":""}" onclick="openChat('${user.id}')">

            ${userAvatar(user,"avatar tiny")}

            <div class="conversationInfo">
                <div class="userName">${escapeHTML(user.name)}</div>

                <div class="lastMessage">
                    ${last ? escapeHTML(last.text) : "Henüz mesaj yok"}
                </div>
            </div>

        </div>
    `;
}

function renderChat(user){
    const list=conversationMessages(user.id);

    return `
        <div class="chatHeader">
            <div class="postHeader">
                ${userAvatar(user,"avatar tiny")}

                <div class="userInfo">
                    <div class="userName">${escapeHTML(user.name)}</div>
                    <div class="userMeta">${onlineHTML(user)}</div>
                </div>

                <button class="btn small" onclick="openChannel('${user.id}')">
                    Kanal
                </button>
            </div>
        </div>

        <div class="chatMessages">

            ${
                list.length
                ? list.map(renderMessage).join("")
                : `
                    <div class="empty">
                        <strong>Mesaj yok</strong>
                        İlk mesajı gönder.
                    </div>
                `
            }

        </div>

        <div class="chatInput">
            <input
                id="messageInput"
                placeholder="Mesaj yaz..."
                onkeydown="messageKey(event,'${user.id}')"
            >
            <button class="btn primary" onclick="sendMessage('${user.id}')">
                Gönder
            </button>
        </div>
    `;
}

function renderMessage(m){
    const mine=m.fromId===currentUserId;

    return `
        <div class="messageRow ${mine?"mine":""}">
            <div class="messageBubble">
                ${escapeHTML(m.text)}
                ${
                    mine
                    ? `<div style="font-size:9px;color:var(--muted);margin-top:4px">${timeAgo(m.createdAt)}</div>`
                    : ""
                }
            </div>
        </div>
    `;
}

function openChat(id){
    if(isBlocked(id)){
        toast("Bu kullanıcıyla mesajlaşamazsın.");
        return;
    }

    state.messageUser=id;
    go("messages");

    setTimeout(()=>{
        const box=document.querySelector(".chatMessages");

        if(box){
            box.scrollTop=box.scrollHeight;
        }
    },30);
}

function startMessage(id){
    if(isBlocked(id)){
        toast("Bu kullanıcıyla mesajlaşamazsın.");
        return;
    }

    state.messageUser=id;
    go("messages");
}

function messageKey(e,id){
    if(e.key==="Enter"){
        e.preventDefault();
        sendMessage(id);
    }
}

function sendMessage(id){
    const input=document.getElementById("messageInput");

    if(!input || !input.value.trim()) return;

    if(isBlocked(id)){
        toast("Bu kullanıcıyla mesajlaşamazsın.");
        return;
    }

    const target=getUser(id);

    if(!target) return;

    messages.push({
        id:uid("msg"),
        fromId:currentUserId,
        toId:id,
        text:input.value.trim(),
        read:false,
        createdAt:new Date().toISOString()
    });

    saveAll();

    addActivity("message",`${target.name} kullanıcısına mesaj gönderdin`,{userId:id});
    notify(id,"message",`${me().name} sana mesaj gönderdi.`,{userId:currentUserId});

    input.value="";
    renderPage();

    setTimeout(()=>{
        const box=document.querySelector(".chatMessages");

        if(box) box.scrollTop=box.scrollHeight;
    },30);
}

function nameChangesAvailable(){

    u.nameChanges=u.nameChanges||[];

            <button class="btn primary" onclick="saveProfileEdit()">Kaydet</button>

async function saveProfileEdit(){
    const u=me();

    if(!u) return;

    const name=document.getElementById("profileNameInput")?.value.trim();
    const username=document.getElementById("profileUsernameInput")?.value.trim();
    const bio=document.getElementById("profileBioInput")?.value.trim();

    if(!name || !username){
        toast("İsim ve kullanıcı adı gerekli.");
        return;
    }

    const nameChanged=name!==u.name;
    const usernameChanged=username!==u.username;
    const identityChanged=nameChanged||usernameChanged;

    if(identityChanged && nameChangesAvailable()<=0){
        toast("7 gün içinde en fazla 3 isim/kullanıcı adı değişikliği yapabilirsin.");
        return;
    }

    const other=users.find(x=>
        x.id!==u.id &&
        x.username.toLowerCase()===username.toLowerCase()
    );

    if(other){
        toast("Bu kullanıcı adı zaten kullanılıyor.");
        return;
    }

    if(identityChanged){
        u.nameChanges=u.nameChanges||[];
        u.nameChanges.push(new Date().toISOString());
    }

    u.name=name;
    u.username=username;
    u.bio=bio;

    const avatarFile=document.getElementById("profileAvatarFile")?.files[0];
    const backgroundFile=document.getElementById("profileBackgroundFile")?.files[0];

    if(avatarFile){
        u.avatarMediaId=await saveMedia(avatarFile,uid("avatar"));
    }

    if(backgroundFile){
        u.profileBackgroundMediaId=await saveMedia(backgroundFile,uid("profilebg"));
    }

    saveAll();

    addActivity("profile_edit","Profilini güncelledin");

    closeModal();
    toast("Profil güncellendi.");
    renderPage();
}

let searchTimer=null;

function globalSearch(value){
    clearTimeout(searchTimer);

    searchTimer=setTimeout(()=>{
        state.search=value.trim();

        if(state.search){
            state.page="search";
            renderPage();
        }
    },250);
}

function renderSearch(q){
    q=(q||"").toLowerCase();

    const foundUsers=users.filter(u=>
        u.id!==currentUserId &&
        !isBlocked(u.id) &&
        (
            u.name.toLowerCase().includes(q) ||
            u.username.toLowerCase().includes(q) ||
            u.role.toLowerCase().includes(q)
        )
    ).slice(0,10);

    const foundSongs=songs.filter(s=>{
        const u=getUser(s.userId);

        return !isBlocked(s.userId) &&
            (
                s.name.toLowerCase().includes(q) ||
                (s.description||"").toLowerCase().includes(q) ||
                (u?.name||"").toLowerCase().includes(q)
            );
    }).slice(0,10);

    const foundPosts=posts.filter(p=>
        !isBlocked(p.userId) &&
        (p.text||"").toLowerCase().includes(q)
    ).slice(0,10);

    return `
        <div class="pageHeader">
            <div>
                <div class="pageTitle">Arama</div>
                <div class="pageSubtitle">"${escapeHTML(q)}" için sonuçlar</div>
            </div>
        </div>

        <div class="grid">

            <div class="card resultSection">
                <h3>Kişiler</h3>

                ${
                    foundUsers.length
                    ? foundUsers.map(u=>`
                        <div class="searchResult">
                            ${userAvatar(u,"avatar tiny")}

                            <div class="userInfo">
                                <div class="userName">${escapeHTML(u.name)}</div>
                                <div class="userMeta">${escapeHTML(u.role)}</div>
                            </div>

                            <button class="btn small" onclick="openChannel('${u.id}')">Kanal</button>
                        </div>
                    `).join("")
                    : `<div style="color:var(--muted)">Kişi bulunamadı.</div>`
                }
            </div>

            <div class="card resultSection">
                <h3>Şarkılar</h3>

                ${
                    foundSongs.length
                    ? `<div class="grid grid3">${foundSongs.map(renderSongCard).join("")}</div>`
                    : `<div style="color:var(--muted)">Şarkı bulunamadı.</div>`
                }
            </div>

            <div class="card resultSection">
                <h3>Gönderiler</h3>

                ${
                    foundPosts.length
                    ? `<div class="grid">${foundPosts.map(renderPost).join("")}</div>`
                    : `<div style="color:var(--muted)">Gönderi bulunamadı.</div>`
                }
            </div>

        </div>
    `;
}

/* =========================================================
   MODAL
========================================================= */

function openModal(html){
    const modal=document.getElementById("modal");
    const box=document.getElementById("modalBox");

    box.innerHTML=html;
    modal.classList.add("show");
}

function closeModal(){
    document.getElementById("modal").classList.remove("show");
    document.getElementById("modalBox").innerHTML="";
}

function modalOutside(e){
    if(e.target.id==="modal"){
        closeModal();
    }
}

/* =========================================================
   DATA EXPORT / IMPORT
========================================================= */

function exportData(){
    const data={
        version:1,
        users,
        posts,
        reels,
        songs,
        shops,
        comments,
        messages,
        activities,
        notifications,
        history
    };

    const blob=new Blob(
        [JSON.stringify(data,null,2)],
        {type:"application/json"}
    );

    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");

    a.href=url;
    a.download="mym-sound-data.json";
    a.click();

    URL.revokeObjectURL(url);

    toast("Veriler dışa aktarıldı.");
}

async function importData(file){
    if(!file) return;

    try{
        const text=await file.text();
        const data=JSON.parse(text);

        if(!data || !Array.isArray(data.users)){
            throw new Error("Geçersiz veri.");
        }

        users=data.users||[];
        posts=data.posts||[];
        reels=data.reels||[];
        songs=data.songs||[];
        shops=data.shops||[];
        comments=data.comments||[];
        messages=data.messages||[];
        activities=data.activities||[];
        notifications=data.notifications||[];
        history=data.history||[];

        currentUserId=localStorage.getItem(KEY.current);

        if(!getUser(currentUserId)){
            currentUserId=users[0]?.id;
            localStorage.setItem(KEY.current,currentUserId);
        }

        saveAll();

        toast("Veriler içe aktarıldı.");
        renderPage();

    }catch(e){
        console.error(e);
        toast("Veri dosyası okunamadı.");
    }
}

async function resetData(){
    if(!confirm("Tüm yerel MYM SOUND verileri silinsin mi?")) return;

    Object.values(KEY).forEach(key=>{
        localStorage.removeItem(key);
    });

    const db=await openDB();

    await new Promise(resolve=>{
        const tx=db.transaction("media","readwrite");
        tx.objectStore("media").clear();
        tx.oncomplete=resolve;
    });

    users=[];
    posts=[];
    reels=[];
    songs=[];
    shops=[];
    comments=[];
    messages=[];
    activities=[];
    notifications=[];
    history=[];
    currentUserId=null;

    ensureAccount();

    toast("Veriler sıfırlandı.");
    go("home");
}

/* =========================================================
   LOGOUT
========================================================= */

function logout(){
    const u=me();

    if(u){
        u.online=false;
        u.lastSeen=new Date().toISOString();
    }

    saveAll();

    /*
      Bu demo tek tarayıcı hesabı mantığı kullandığı için
      çıkışta hesap seçme ekranı açıyoruz.
    */

    openLoginModal();
}

function openLoginModal(){
    const accountList=users;

    openModal(`
        <div class="modalHeader">
            <h2>MYM SOUND hesabı</h2>
            <button class="iconBtn" onclick="closeModal()">X</button>
        </div>

        <div class="modalBody">

            <h3 style="margin-bottom:10px">Hesap seç</h3>

            ${
                accountList.map(u=>`
                    <button
                        class="btn"
                        style="width:100%;margin-bottom:8px;text-align:left"
                        onclick="loginAs('${u.id}')"
                    >
                        ${escapeHTML(u.name)}
                        <span style="color:var(--muted);font-size:11px">
                            · @${escapeHTML(u.username)}
                        </span>
                    </button>
                `).join("")
            }

            <hr style="border:0;border-top:1px solid var(--border);margin:18px 0">

            <button class="btn primary" style="width:100%" onclick="openRegisterModal()">
                Yeni hesap oluştur
            </button>

        </div>
    `);
}

function loginAs(id){
    const u=getUser(id);

    if(!u) return;

    currentUserId=id;
    localStorage.setItem(KEY.current,id);

    u.online=true;
    u.lastSeen=new Date().toISOString();

    saveAll();

    closeModal();
    toast(`${u.name} hesabına giriş yapıldı.`);
    go("home");
}

function openRegisterModal(){
    openModal(`
        <div class="modalHeader">
            <h2>Yeni hesap</h2>
            <button class="iconBtn" onclick="closeModal()">X</button>
        </div>

        <div class="modalBody">

            <div class="formGroup">
                <label>İsim</label>
                <input id="registerName" class="input" placeholder="Adın">
            </div>

            <div class="formGroup">
                <label>Kullanıcı adı</label>
                <input id="registerUsername" class="input" placeholder="kullaniciadi">
            </div>

            <div class="formGroup">
                <label>Rol</label>

                <select id="registerRole" class="select">
                    <option>Dinleyici</option>
                    <option>Sanatçı</option>
                    <option>Beat Maker</option>
                    <option>Mix Engineer</option>
                    <option>Prodüktör</option>
                </select>
            </div>

        </div>

        <div class="modalFooter">
            <button class="btn" onclick="openLoginModal()">Geri</button>
            <button class="btn primary" onclick="registerAccount()">Hesap oluştur</button>
        </div>
    `);
}

function registerAccount(){
    const name=document.getElementById("registerName")?.value.trim();
    const username=document.getElementById("registerUsername")?.value.trim().toLowerCase();
    const role=document.getElementById("registerRole")?.value;

    if(!name || !username){
        toast("İsim ve kullanıcı adı gerekli.");
        return;
    }

    if(!/^[a-zA-Z0-9_.-]{3,30}$/.test(username)){
        toast("Kullanıcı adı 3-30 karakter olmalı.");
        return;
    }

    if(users.some(u=>u.username.toLowerCase()===username)){
        toast("Bu kullanıcı adı zaten alınmış.");
        return;
    }

    const id=uid("user");

    users.push({
        id,
        name,
        username,
        password:"",
        role,
        plan:"free",
        bio:"",
        avatarMediaId:null,
        profileBackgroundMediaId:null,
        shopBackgroundMediaId:null,
        followers:[],
        following:[],
        blockedUsers:[],
        nameChanges:[],
        online:true,
        lastSeen:new Date().toISOString(),
        settings:{
            notifications:true,
            autoplay:false,
            privateProfile:false
        }
    });

    currentUserId=id;

    localStorage.setItem(KEY.current,id);
    saveAll();

    addActivity("register","MYM SOUND hesabını oluşturdun");

    closeModal();
    toast("Hesap oluşturuldu.");
    go("home");
}

/* =========================================================
   INIT
========================================================= */

const globalAudio=document.getElementById("globalAudio");

globalAudio.addEventListener("play",()=>{
    document.getElementById("playerPlay").textContent="||";
});

globalAudio.addEventListener("pause",()=>{
    document.getElementById("playerPlay").textContent="▶";
});

globalAudio.addEventListener("timeupdate",()=>{
    const audio=globalAudio;

    if(!audio.duration) return;

    const progress=document.getElementById("playerProgress");

    progress.value=(audio.currentTime/audio.duration)*100;

    document.getElementById("playerCurrent").textContent=formatTime(audio.currentTime);
    document.getElementById("playerDuration").textContent=formatTime(audio.duration);
});

document.getElementById("playerProgress").addEventListener("input",function(){
    const audio=document.getElementById("globalAudio");

    if(audio.duration){
        audio.currentTime=(this.value/100)*audio.duration;
    }
});

function formatTime(seconds){
    if(!Number.isFinite(seconds)) return "0:00";

    const min=Math.floor(seconds/60);
    const sec=Math.floor(seconds%60).toString().padStart(2,"0");

    return `${min}:${sec}`;
}

window.addEventListener("beforeunload",()=>{
    const u=me();

    if(u){
        u.online=false;
        u.lastSeen=new Date().toISOString();
        saveAll();
    }
});

window.addEventListener("load",()=>{
    renderPage();
    updateNotificationBadge();
});
