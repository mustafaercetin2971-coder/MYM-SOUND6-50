<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MYM SOUND</title>
<style>
:root{
 --p:#8b5cf6;--p2:#6d28d9;--a:#c084fc;--bg:#08080d;--panel:#11111a;
 --panel2:#181824;--text:#fff;--muted:#9999aa;--border:#292938;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
button,.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--p);color:#fff}
button:hover{filter:brightness(1.12)}
input,textarea,select{width:100%;background:#0c0c13;color:#fff;border:1px solid var(--border);border-radius:10px;padding:11px;outline:none}
textarea{min-height:100px;resize:vertical}
.hidden{display:none!important}
.app{min-height:100vh}
.top{
 position:sticky;top:0;z-index:50;height:64px;background:rgba(8,8,13,.94);
 backdrop-filter:blur(18px);border-bottom:1px solid var(--border);
 display:flex;align-items:center;padding:0 18px;gap:16px
}
.logo{font-size:22px;font-weight:900;color:var(--a)}
.search{max-width:430px;flex:1}
.user-mini{margin-left:auto;display:flex;align-items:center;gap:8px}
.avatar{width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--p);display:grid;place-items:center;font-weight:bold}
.layout{display:flex;min-height:calc(100vh - 64px)}
.side{
 width:220px;border-right:1px solid var(--border);padding:16px;position:sticky;
 top:64px;height:calc(100vh - 64px);background:#0b0b11
}
.navbtn{width:100%;background:transparent;text-align:left;margin:4px 0;color:#ddd}
.navbtn.active{background:var(--p2)}
.main{flex:1;max-width:1200px;margin:auto;padding:22px;width:100%}
.page-title{font-size:28px;font-weight:900;margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}
.card{
 background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;
 box-shadow:0 8px 30px #0003
}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12px}
.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:var(--p2);font-size:11px}
.featured{border:1px solid var(--a);box-shadow:0 0 25px #8b5cf633}
.featured-label{color:var(--a);font-size:11px;font-weight:bold}
.cover{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#222}
audio{width:100%;margin-top:12px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{font-size:12px}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:18px}
.tab{background:var(--panel2);white-space:nowrap}
.tab.active{background:var(--p)}
.auth{
 min-height:100vh;display:grid;place-items:center;padding:20px;
 background:radial-gradient(circle at top,var(--p2),#08080d 45%)
}
.authbox{width:min(440px,100%);background:#11111a;border:1px solid var(--border);border-radius:20px;padding:25px}
.authbox h1{color:var(--a)}
.form{display:grid;gap:12px}
.modal{
 position:fixed;inset:0;background:#000b;z-index:100;display:grid;place-items:center;
 padding:18px
}
.modalbox{width:min(650px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:20px}
.toast{
 position:fixed;right:20px;bottom:20px;background:var(--panel2);border:1px solid var(--p);
 padding:13px 17px;border-radius:12px;z-index:300
}
.stat{font-size:25px;font-weight:900;color:var(--a)}
.theme-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}
.theme{
 padding:10px;border:2px solid var(--border);border-radius:12px;background:var(--panel2);
 color:#fff;text-align:left
}
.theme.selected{border-color:#fff}
.theme-color{height:38px;border-radius:8px;margin-bottom:7px}
.admin{border:1px solid #d33;background:#160d0d}
.admin h2{color:#ff7777}
.table{width:100%;border-collapse:collapse}
.table th,.table td{padding:9px;border-bottom:1px solid var(--border);text-align:left}
.danger{background:#a51d32}
.success{background:#168653}
.warn{background:#a86b13}
@media(max-width:800px){
 .side{position:fixed;bottom:0;top:auto;left:0;width:100%;height:64px;z-index:60;
 display:flex;padding:5px;border-top:1px solid var(--border);overflow:auto}
 .navbtn{min-width:90px;text-align:center;margin:0}
 .layout{padding-bottom:64px}
 .top{padding:0 10px}
 .search{display:none}
}
</style>
</head>
<body>

<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>

<script>
"use strict";

const KEY={
 users:"mym_users_v9",
 posts:"mym_posts_v9",
 songs:"mym_songs_v9",
 reels:"mym_reels_v9",
 shop:"mym_shop_v9",
 messages:"mym_messages_v9",
 activities:"mym_activities_v9",
 notifications:"mym_notifications_v9",
 current:"mym_current_v9"
};

const THEMES=[
 ["Mor"," #8b5cf6","#6d28d9","#c084fc"],
 ["Mavi","#3b82f6","#1d4ed8","#60a5fa"],
 ["Kırmızı","#ef4444","#991b1b","#f87171"],
 ["Yeşil","#22c55e","#15803d","#86efac"],
 ["Turuncu","#f97316","#c2410c","#fdba74"],
 ["Pembe","#ec4899","#be185d","#f9a8d4"],
 ["Turkuaz","#14b8a6","#0f766e","#5eead4"],
 ["Lacivert","#2563eb","#172554","#93c5fd"],
 ["Sarı","#eab308","#a16207","#fde047"],
 ["Cyan","#06b6d4","#0e7490","#67e8f9"],
 ["Magenta","#d946ef","#86198f","#f0abfc"],
 ["Lila","#a78bfa","#7c3aed","#ddd6fe"],
 ["Emerald","#10b981","#047857","#6ee7b7"],
 ["Indigo","#6366f1","#3730a3","#a5b4fc"],
 ["Rose","#f43f5e","#be123c","#fda4af"],
 ["Amber","#f59e0b","#b45309","#fcd34d"],
 ["Lime","#84cc16","#4d7c0f","#bef264"],
 ["Sky","#0ea5e9","#0369a1","#7dd3fc"],
 ["Violet","#7c3aed","#4c1d95","#c4b5fd"],
 ["Monokrom","#94a3b8","#334155","#e2e8f0"]
].map((x,i)=>({id:"theme"+i,name:x[0],primary:x[1].trim(),secondary:x[2],accent:x[3]}));

const ROLES=["Dinleyici","Sanatçı","Beat Maker","Mix Engineer","Prodüktör"];

let state={
 page:"home",
 auth:"login",
 feed:"all",
 search:"",
 settings:"account"
};

const load=(k,d=[])=>{
 try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}
};
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

let users=load(KEY.users);
let posts=load(KEY.posts);
let songs=load(KEY.songs);
let reels=load(KEY.reels);
let shop=load(KEY.shop);
let messages=load(KEY.messages);
let activities=load(KEY.activities);
let notifications=load(KEY.notifications);

const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"_"+Math.random();
const now=()=>Date.now();
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmt=t=>new Date(t).toLocaleString("tr-TR");
const me=()=>users.find(x=>x.id===localStorage.getItem(KEY.current));
const userById=id=>users.find(x=>x.id===id);

function monthStart(d=new Date()){
 return new Date(d.getFullYear(),d.getMonth(),1,0,0,0,0).getTime();
}
function addMonth(t){
 const d=new Date(t);
 d.setMonth(d.getMonth()+1);
 return d.getTime();
}
function addYear(t){
 const d=new Date(t);
 d.setFullYear(d.getFullYear()+1);
 return d.getTime();
}

function defaults(u){
 u.settings=u.settings||{};
 if(!u.settings.theme)u.settings.theme="theme0";
 if(u.settings.notifications===undefined)u.settings.notifications=true;
 if(u.settings.autoplay===undefined)u.settings.autoplay=false;
 if(!u.blockedUsers)u.blockedUsers=[];
 if(!u.followers)u.followers=[];
 if(!u.following)u.following=[];
 if(!u.nameChanges)u.nameChanges=[];
 if(!u.email)u.email="";
 if(u.plan!=="pro")u.plan="free";
 if(!("proPlan" in u))u.proPlan=null;
 if(!("proStartedAt" in u))u.proStartedAt=null;
 if(!("proExpiresAt" in u))u.proExpiresAt=null;
 if(!("proCycleKey" in u))u.proCycleKey=null;
 if(!("proBoostUsed" in u))u.proBoostUsed=0;
 return u;
}
users=users.map(defaults);
save(KEY.users,users);

function themeApply(){
 const u=me();
 const t=THEMES.find(x=>x.id===u?.settings?.theme)||THEMES[0];
 document.documentElement.style.setProperty("--p",t.primary);
 document.documentElement.style.setProperty("--p2",t.secondary);
 document.documentElement.style.setProperty("--a",t.accent);
}

function saveAll(){
 save(KEY.users,users);save(KEY.posts,posts);save(KEY.songs,songs);
 save(KEY.reels,reels);save(KEY.shop,shop);save(KEY.messages,messages);
 save(KEY.activities,activities);save(KEY.notifications,notifications);
}

function activity(type,text){
 const u=me();
 if(!u)return;
 activities.unshift({id:uid(),userId:u.id,type,text,createdAt:now()});
 activities=activities.slice(0,500);
 save(KEY.activities,activities);
}

function toast(text){
 const el=document.getElementById("toast");
 el.innerHTML=`<div class="toast">${esc(text)}</div>`;
 setTimeout(()=>el.innerHTML="",2500);
}

function modal(html){
 document.getElementById("modal").innerHTML=`<div class="modal" id="modalBg">
 <div class="modalbox">${html}</div></div>`;
}
function closeModal(){document.getElementById("modal").innerHTML=""}

function isAdmin(u=me()){
 return !!u&&u.role==="admin";
}

function expirePro(u){
 if(!u)return;
 if(u.plan==="pro"&&u.proExpiresAt&&now()>=u.proExpiresAt){
  u.plan="free";
  u.proPlan=null;
  u.proStartedAt=null;
  u.proExpiresAt=null;
  u.proCycleKey=null;
  u.proBoostUsed=0;
  clearUserBoosts(u.id);
  saveAll();
 }
}

function clearUserBoosts(userId){
 const arr=[posts,songs,reels,shop];
 arr.forEach(list=>{
  list.forEach(x=>{
   if(x.boostedBy===userId){
    x.boosted=false;
    x.boostedBy=null;
    x.boostedAt=null;
    x.boostedUntil=null;
   }
  });
 });
}

function proCheck(u=me()){
 if(!u)return false;
 expirePro(u);
 if(u.plan!=="pro")return false;

 if(u.proPlan==="yearly"){
  const key=new Date().getFullYear()+"-"+new Date().getMonth();
  if(u.proCycleKey!==key){
   clearUserBoosts(u.id);
   u.proCycleKey=key;
   u.proBoostUsed=0;
   saveAll();
  }
 }
 return true;
}

function proCycleEnd(u){
 if(u.proPlan==="monthly")return u.proExpiresAt;
 const d=new Date();
 return new Date(d.getFullYear(),d.getMonth()+1,1,0,0,0,0).getTime();
}

function activatePro(type){
 const u=me();
 if(!u)return;
 const t=now();
 u.plan="pro";
 u.proPlan=type;
 u.proStartedAt=t;
 u.proExpiresAt=type==="monthly"?addMonth(t):addYear(t);
 u.proBoostUsed=0;
 u.proCycleKey=new Date().getFullYear()+"-"+new Date().getMonth();
 clearUserBoosts(u.id);
 saveAll();
 activity("pro",`MYM PRO ${type==="monthly"?"Aylık":"Yıllık"} etkinleştirildi`);
 toast("PRO etkinleştirildi");
 render();
}

function boost(type,id){
 const u=me();
 if(!proCheck(u)){toast("Bu özellik için PRO gerekli");return}
 if(u.proBoostUsed>=10){toast("Bu ay 10 öne çıkarma hakkını kullandın");return}

 const maps={post:posts,reel:reels,song:songs,shop:shop};
 const list=maps[type];
 const item=list.find(x=>x.id===id);
 if(!item||item.userId!==u.id){toast("Bu içeriği öne çıkaramazsın");return}
 if(item.boosted){toast("Bu içerik zaten öne çıkarılmış");return}

 item.boosted=true;
 item.boostedBy=u.id;
 item.boostedAt=now();
 item.boostedUntil=proCycleEnd(u);
 u.proBoostUsed++;
 saveAll();
 activity("boost",`${type} içeriği öne çıkarıldı`);
 toast("İçerik öne çıkarıldı");
 render();
}

function boostAll(){
 const u=me();
 if(!proCheck(u)){toast("PRO gerekli");return}
 const lists=[
  ["post",posts],["song",songs],["reel",reels],["shop",shop]
 ];
 let left=10-u.proBoostUsed;
 let count=0;

 for(const [type,list] of lists){
  for(const item of list.filter(x=>x.userId===u.id&&!x.boosted).sort((a,b)=>b.createdAt-a.createdAt)){
   if(left<=0)break;
   item.boosted=true;
   item.boostedBy=u.id;
   item.boostedAt=now();
   item.boostedUntil=proCycleEnd(u);
   u.proBoostUsed++;
   left--;
   count++;
  }
 }
 saveAll();
 if(count)activity("boost",`${count} içerik öne çıkarıldı`);
 toast(count?`${count} içerik öne çıkarıldı`:"Öne çıkarılacak yeni içerik yok");
 render();
}

function boostHTML(type,id,userId,boosted){
 const u=me();
 if(!u||userId!==u.id||!proCheck(u))return "";
 if(boosted)return `<span class="featured-label">ÖNE ÇIKARILDI</span>`;
 if(u.proBoostUsed>=10)return `<span class="muted small">Öne çıkarma hakkı doldu</span>`;
 return `<button data-boost="${type}:${id}">Öne Çıkar</button>`;
}

function avatar(u,size=""){
 if(u?.avatar)return `<img class="avatar ${size}" src="${esc(u.avatar)}">`;
 return `<div class="avatar ${size}">${esc((u?.name||"?").slice(0,1).toUpperCase())}</div>`;
}

function header(){
 const u=me();
 return `<header class="top">
 <div class="logo">MYM SOUND</div>
 <input class="search" id="globalSearch" placeholder="Ara..." value="${esc(state.search)}">
 <div class="user-mini">${avatar(u)}<span>${esc(u?.name||"")}</span></div>
 </header>`;
}

function nav(){
 const items=[
  ["home","Ana Sayfa"],["reels","Reels"],["channels","Kanallar"],
  ["shop","Shop"],["messages","Mesajlar"],["profile","Profil"],
  ["settings","Ayarlar"],["pro","MYM PRO"]
 ];
 if(isAdmin())items.push(["admin","Admin Paneli"]);
 return `<aside class="side">${items.map(x=>
 `<button class="navbtn ${state.page===x[0]?"active":""}" data-page="${x[0]}">${x[1]}</button>`
 ).join("")}</aside>`;
}

function shell(content){
 return `<div class="app">${header()}<div class="layout">${nav()}<main class="main">${content}</main></div></div>`;
}

function postCard(p){
 const u=userById(p.userId);
 if(!u)return "";
 const featured=p.boosted&&p.boostedUntil>now();
 return `<article class="card ${featured?"featured":""}">
 <div class="row between">
  <div class="row">${avatar(u)}<div><b>${esc(u.name)}</b><div class="small muted">@${esc(u.username)}</div></div></div>
  ${featured?`<span class="featured-label">ÖNE ÇIKAN</span>`:""}
 </div>
 <p>${esc(p.text)}</p>
 <div class="small muted">${fmt(p.createdAt)}</div>
 <div class="actions">
  ${boostHTML("post",p.id,p.userId,featured)}
  ${p.userId===me()?.id?`<button class="danger" data-delete-post="${p.id}">Sil</button>`:""}
 </div>
 </article>`;
}

function songCard(s){
 const u=userById(s.userId);
 const featured=s.boosted&&s.boostedUntil>now();
 return `<article class="card ${featured?"featured":""}">
 <div class="row between"><b>${esc(s.name)}</b>${featured?`<span class="featured-label">ÖNE ÇIKAN</span>`:""}</div>
 <div class="muted small">${esc(u?.name||"")}</div>
 ${s.cover?`<img class="cover" src="${esc(s.cover)}">`:""}
 ${s.audio?`<audio controls src="${esc(s.audio)}"></audio>`:""}
 <p class="muted">${esc(s.description)}</p>
 <div class="actions">
  ${boostHTML("song",s.id,s.userId,featured)}
  ${s.userId===me()?.id?`<button class="danger" data-delete-song="${s.id}">Sil</button>`:""}
 </div>
 </article>`;
}

function reelCard(r){
 const u=userById(r.userId);
 const featured=r.boosted&&r.boostedUntil>now();
 return `<article class="card ${featured?"featured":""}">
 <div class="row between"><b>${esc(r.title||"Reel")}</b>${featured?`<span class="featured-label">ÖNE ÇIKAN</span>`:""}</div>
 <div class="muted small">${esc(u?.name||"")}</div>
 ${r.video?`<video controls style="width:100%;border-radius:12px;margin-top:10px" src="${esc(r.video)}"></video>`:""}
 <div class="actions">${boostHTML("reel",r.id,r.userId,featured)}</div>
 </article>`;
}

function shopCard(x){
 const u=userById(x.userId);
 const featured=x.boosted&&x.boostedUntil>now();
 return `<article class="card ${featured?"featured":""}">
 <div class="row between"><b>${esc(x.name)}</b>${featured?`<span class="featured-label">ÖNE ÇIKAN</span>`:""}</div>
 <div class="small muted">${esc(x.type)} · ${esc(u?.name||"")}</div>
 <p>${esc(x.description)}</p>
 <b>${Number(x.price||0).toLocaleString("tr-TR")} TL</b>
 ${x.audio?`<audio controls src="${esc(x.audio)}"></audio>`:""}
 <div class="actions">
  ${boostHTML("shop",x.id,x.userId,featured)}
  ${x.userId===me()?.id?`<button class="danger" data-delete-shop="${x.id}">Sil</button>`:""}
 </div>
 </article>`;
}

function renderHome(){
 let all=[
  ...posts.map(x=>({...x,_type:"post"})),
  ...songs.map(x=>({...x,_type:"song"}))
 ];
 const u=me();

 all=all.filter(x=>!u.blockedUsers?.includes(x.userId));

 if(state.feed==="following")
  all=all.filter(x=>u.following.includes(x.userId));
 if(state.feed==="new")
  all.sort((a,b)=>b.createdAt-a.createdAt);
 if(state.feed==="popular")
  all.sort((a,b)=>(b.likes?.length||0)-(a.likes?.length||0));

 all.sort((a,b)=>{
  const af=a.boosted&&a.boostedUntil>now();
  const bf=b.boosted&&b.boostedUntil>now();
  if(af&&!bf)return -1;
  if(!af&&bf)return 1;
  return b.createdAt-a.createdAt;
 });

 return `<div class="page-title">Ana Sayfa</div>
 <div class="tabs">
 ${["all","following","new","popular"].map(x=>`<button class="tab ${state.feed===x?"active":""}" data-feed="${x}">${{all:"Tümü",following:"Takip",new:"Yeni",popular:"Popüler"}[x]}</button>`).join("")}
 </div>
 <div class="actions"><button data-new-post>Gönderi Oluştur</button><button data-new-song>Şarkı Ekle</button></div>
 <div class="grid" style="margin-top:18px">${all.length?all.map(x=>x._type==="post"?postCard(x):songCard(x)).join(""):`<div class="card muted">Henüz içerik yok.</div>`}</div>`;
}

function renderReels(){
 const arr=reels.filter(x=>!me().blockedUsers.includes(x.userId))
 .sort((a,b)=>{
  const aa=a.boosted&&a.boostedUntil>now(),bb=b.boosted&&b.boostedUntil>now();
  return aa===bb?b.createdAt-a.createdAt:aa?-1:1;
 });
 return `<div class="page-title">Reels</div>
 <button data-new-reel>Reel Ekle</button>
 <div class="grid" style="margin-top:18px">${arr.map(reelCard).join("")}</div>`;
}

function renderChannels(){
 return `<div class="page-title">Kanallar</div>
 <div class="grid">${users.filter(u=>u.id!==me().id).map(u=>{
  const postsN=posts.filter(x=>x.userId===u.id).length;
  const songsN=songs.filter(x=>x.userId===u.id).length;
  const reelsN=reels.filter(x=>x.userId===u.id).length;
  const following=me().following.includes(u.id);
  return `<article class="card">
   <div class="row">${avatar(u)}<div><b>${esc(u.name)}</b><div class="muted">@${esc(u.username)}</div></div></div>
   <p>${esc(u.bio||"MYM SOUND kullanıcısı")}</p>
   <div class="small muted">Gönderi ${postsN} · Şarkı ${songsN} · Reel ${reelsN}</div>
   <div class="actions">
    <button data-channel="${u.id}">Kanala Git</button>
    <button data-follow="${u.id}">${following?"Takipten Çık":"Takip Et"}</button>
   </div>
  </article>`;
 }).join("")}</div>`;
}

function renderChannel(id){
 const u=userById(id);
 if(!u)return renderChannels();
 const ps=posts.filter(x=>x.userId===id);
 const ss=songs.filter(x=>x.userId===id);
 const rs=reels.filter(x=>x.userId===id);
 const sh=shop.filter(x=>x.userId===id);
 return `<button data-page="channels">← Kanallar</button>
 <div class="card" style="margin-top:15px">
  <div class="row">${avatar(u)}<div><h2>${esc(u.name)}</h2><span class="muted">@${esc(u.username)}</span></div></div>
  <p>${esc(u.bio||"")}</p>
  <button data-follow="${u.id}">${me().following.includes(u.id)?"Takipten Çık":"Takip Et"}</button>
 </div>
 <h2>Gönderiler</h2><div class="grid">${ps.map(postCard).join("")}</div>
 <h2>Şarkılar</h2><div class="grid">${ss.map(songCard).join("")}</div>
 <h2>Reels</h2><div class="grid">${rs.map(reelCard).join("")}</div>
 <h2>Shop</h2><div class="grid">${sh.map(shopCard).join("")}</div>`;
}

function renderShop(){
 const mine=shop.filter(x=>x.userId===me().id);

function render(){
 const u=me();
 if(!u){
  document.getElementById("app").innerHTML=authHTML();
  themeApply();
  return;
 }
 expirePro(u);
 themeApply();

 let content="";
 if(state.page==="home")content=renderHome();
 if(state.page==="reels")content=renderReels();
 if(state.page==="channels")content=state.channel?renderChannel(state.channel):renderChannels();
 if(state.page==="shop")content=renderShop();
 if(state.page==="profile")content=renderProfile(state.profileId||u.id);
 if(state.page==="messages")content=renderMessages();
 if(state.page==="settings")content=renderSettings();
 if(state.page==="pro")content=renderPro();
 if(state.page==="admin")content=renderAdmin();

 document.getElementById("app").innerHTML=shell(content);
}

function register(f){
 const name=f.name.value.trim();
 const email=f.email.value.trim().toLowerCase();
 const username=f.username.value.trim();
 const password=f.password.value;
 const password2=f.password2.value;
 const role=f.role.value;

 if(name.length<2)return toast("Adını doğru gir");
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return toast("Geçerli e-posta gir");
 if(users.some(x=>x.email.toLowerCase()===email))return toast("Bu e-posta ile zaten hesap var");
 if(!/^[a-zA-Z0-9_.-]{3,24}$/.test(username))return toast("Kullanıcı adı 3-24 karakter olmalı");
 if(users.some(x=>x.username.toLowerCase()===username.toLowerCase()))return toast("Bu kullanıcı adı kullanımda");
 if(password.length<6)return toast("Şifre en az 6 karakter");
 if(password!==password2)return toast("Şifreler aynı değil");

 const u=defaults({
  id:uid(),name,email,username,password,role,
  plan:"free",proPlan:null,proStartedAt:null,proExpiresAt:null,
  proCycleKey:null,proBoostUsed:0,followers:[],following:[],
  blockedUsers:[],nameChanges:[],avatar:null,bio:"",
  createdAt:now()
 });

 users.push(u);
 saveAll();
 localStorage.setItem(KEY.current,u.id);
 toast("Hesap oluşturuldu");
 render();
}

function login(f){
 const id=f.identity.value.trim().toLowerCase();
 const pw=f.password.value;
 const u=users.find(x=(
  x.username.toLowerCase()===id||
  (x.email&&x.email.toLowerCase()===id)
 )&&x.password===pw);

 if(!u)return toast("Kullanıcı adı/e-posta veya şifre hatalı");
 if(u.banned)return toast("Bu hesap engellenmiş");
 localStorage.setItem(KEY.current,u.id);
 u.online=true;u.lastSeen=now();
 saveAll();render();
}

function fileData(file){
 return new Promise((resolve,reject)=>{
  const r=new FileReader();
  r.onload=()=>resolve(r.result);
  r.onerror=reject;
  r.readAsDataURL(file);
 });
}

function follow(id){
 const u=me(),x=userById(id);
 if(!x||x.id===u.id)return;
 const i=u.following.indexOf(id);
 if(i>=0){
  u.following.splice(i,1);
  x.followers=x.followers.filter(a=>a!==u.id);
  toast("Takipten çıkıldı");
 }else{
  u.following.push(id);
  x.followers.push(u.id);
  toast("Takip edildi");
 }
 saveAll();render();
}

document.addEventListener("click",e=>{
 const b=e.target.closest("button");
 if(!b)return;

 if(b.dataset.auth){
  state.auth=b.dataset.auth;render();return;
 }
 if(b.dataset.page){
  state.page=b.dataset.page;
  state.channel=null;
  render();return;
 }
 if(b.dataset.feed){
  state.feed=b.dataset.feed;render();return;
 }
 if(b.dataset.settings){
  state.settings=b.dataset.settings;render();return;
 }
 if(b.dataset.channel){
  state.page="channels";state.channel=b.dataset.channel;render();return;
 }
 if(b.dataset.follow){follow(b.dataset.follow);return}
 if(b.dataset.messageUser){sendMessage(b.dataset.messageUser);return}
 if(b.dataset.profileSettings){profileSettings();return}
 if(b.dataset.newPost){newPost();return}
 if(b.dataset.newSong){newSong();return}
 if(b.dataset.newReel){newReel();return}
 if(b.dataset.newShop){newShop();return}
 if(b.dataset.closeModal){closeModal();return}
 if(b.dataset.pro){activatePro(b.dataset.pro);return}
 if(b.dataset.proOff){
  const u=me();u.plan="free";u.proPlan=null;u.proStartedAt=null;u.proExpiresAt=null;
  clearUserBoosts(u.id);saveAll();toast("PRO kapatıldı");render();return;
 }
 if(b.dataset.boost){
  const [type,id]=b.dataset.boost.split(":");boost(type,id);return;
 }
 if(b.dataset.boostAll){boostAll();return}
 if(b.dataset.deletePost){
  posts=posts.filter(x=>x.id!==b.dataset.deletePost);saveAll();render();return;
 }
 if(b.dataset.deleteSong){
  songs=songs.filter(x=>x.id!==b.dataset.deleteSong);saveAll();render();return;
 }
 if(b.dataset.deleteShop){
  shop=shop.filter(x=>x.id!==b.dataset.deleteShop);saveAll();render();return;
 }
 if(b.dataset.theme){
  const u=me();u.settings.theme=b.dataset.theme;saveAll();themeApply();render();return;
 }
 if(b.dataset.unblock){
  const u=me();u.blockedUsers=u.blockedUsers.filter(x=>x!==b.dataset.unblock);
  saveAll();render();return;
 }
 if(b.dataset.logout){
  const u=me();if(u){u.online=false;u.lastSeen=now();saveAll()}
  localStorage.removeItem(KEY.current);render();return;
 }
 if(b.dataset.adminCreate){adminCreate();return}
 if(b.dataset.adminPro){
  const target=prompt("PRO verilecek kullanıcı adı:");
  const x=users.find(a=>a.username===target);
  if(!x)return toast("Kullanıcı bulunamadı");
  x.plan="pro";x.proPlan="yearly";x.proStartedAt=now();x.proExpiresAt=addYear(now());
  x.proCycleKey=new Date().getFullYear()+"-"+new Date().getMonth();x.proBoostUsed=0;
  saveAll();toast("PRO verildi");render();return;
 }
 if(b.dataset.adminProUser){
  const x=userById(b.dataset.adminProUser);
  if(x){
   x.plan="pro";x.proPlan="yearly";x.proStartedAt=now();x.proExpiresAt=addYear(now());
   x.proCycleKey=new Date().getFullYear()+"-"+new Date().getMonth();x.proBoostUsed=0;
   saveAll();toast("PRO verildi");render();
  }return;
 }
 if(b.dataset.adminDeleteUser){
  const id=b.dataset.adminDeleteUser;
  users=users.filter(x=>x.id!==id);
  posts=posts.filter(x=>x.userId!==id);
  songs=songs.filter(x=>x.userId!==id);
  reels=reels.filter(x=>x.userId!==id);
  shop=shop.filter(x=>x.userId!==id);
  saveAll();render();return;
 }
 if(b.dataset.adminClearPosts){posts=[];saveAll();render();return}
 if(b.dataset.adminClearSongs){songs=[];saveAll();render();return}
 if(b.dataset.adminClearReels){reels=[];saveAll();render();return}
 if(b.dataset.adminClearShop){shop=[];saveAll();render();return}
});

document.addEventListener("submit",async e=>{
 const f=e.target;

 if(f.id==="loginForm"){
  e.preventDefault();login(f);return;
 }
 if(f.id==="registerForm"){
  e.preventDefault();register(f);return;
 }
 if(f.id==="postForm"){
  e.preventDefault();
  posts.unshift({id:uid(),userId:me().id,text:f.text.value,createdAt:now(),likes:[],boosted:false});
  saveAll();closeModal();render();return;
 }
 if(f.id==="songForm"){
  e.preventDefault();
  const cover=await fileData(f.cover.files[0]);
  const audio=await fileData(f.audio.files[0]);
  songs.unshift({
   id:uid(),userId:me().id,name:f.name.value,
   description:f.description.value,cover,audio,createdAt:now(),
   boosted:false
  });
  saveAll();closeModal();render();return;
 }
 if(f.id==="reelForm"){
  e.preventDefault();
  const video=await fileData(f.video.files[0]);
  reels.unshift({id:uid(),userId:me().id,title:f.title.value,video,createdAt:now(),boosted:false});
  saveAll();closeModal();render();return;
 }
 if(f.id==="shopForm"){
  e.preventDefault();
  const audio=await fileData(f.audio.files[0]);
  shop.unshift({
   id:uid(),userId:me().id,type:f.type.value,name:f.name.value,
   description:f.description.value,price:Number(f.price.value),
   audio,createdAt:now(),boosted:false
  });
  saveAll();closeModal();render();return;
 }
 if(f.id==="messageForm"){
  e.preventDefault();
  messages.push({id:uid(),from:me().id,to:f.dataset.to,text:f.text.value,createdAt:now()});
  saveAll();closeModal();toast("Mesaj gönderildi");return;
 }
 if(f.id==="profileForm"){
  e.preventDefault();
  const u=me();
  const email=f.email.value.trim().toLowerCase();
  const username=f.username.value.trim();

  if(users.some(x=>x.id!==u.id&&x.email.toLowerCase()===email))
   return toast("Bu e-posta başka hesapta kullanılıyor");
  if(users.some(x=>x.id!==u.id&&x.username.toLowerCase()===username.toLowerCase()))
   return toast("Bu kullanıcı adı kullanımda");

  u.name=f.name.value.trim();
  u.username=username;
  u.email=email;
  u.bio=f.bio.value;

  if(f.avatar.files[0])u.avatar=await fileData(f.avatar.files[0]);
  saveAll();closeModal();render();return;
 }
 if(f.id==="adminForm"){
  e.preventDefault();
  const email=f.email.value.trim().toLowerCase();
  const username=f.username.value.trim();

  if(users.some(x=>x.email.toLowerCase()===email))return toast("E-posta kullanımda");
  if(users.some(x=>x.username.toLowerCase()===username.toLowerCase()))return toast("Kullanıcı adı kullanımda");

  users.push(defaults({
   id:uid(),name:f.name.value,email,username,password:f.password.value,
   role:"admin",createdAt:now(),plan:"pro",proPlan:"yearly",
   proStartedAt:now(),proExpiresAt:addYear(now()),
   proCycleKey:new Date().getFullYear()+"-"+new Date().getMonth()
  }));
  saveAll();closeModal();toast("Admin oluşturuldu");render();return;
 }
});

document.addEventListener("change",e=>{
 if(e.target.dataset.private!==undefined){
  const u=me();u.settings.privateProfile=e.target.checked;saveAll();
 }
 if(e.target.dataset.notify!==undefined){
  const u=me();u.settings.notifications=e.target.checked;saveAll();
 }
});

document.addEventListener("input",e=>{
 if(e.target.id==="globalSearch"){
  state.search=e.target.value;
  const q=state.search.toLowerCase();
  if(q.length>=2){
   const found=users.filter(x=>x.name.toLowerCase().includes(q)||x.username.toLowerCase().includes(q));
   if(found.length){
    state.page="channels";
    render();
   }
  }
 }
});

setInterval(()=>{
 const u=me();
 if(u){
  const before=u.plan;
  proCheck(u);
  if(before!==u.plan)render();
 }
},30000);

themeApply();
render();
</script>
</body>
</html>
