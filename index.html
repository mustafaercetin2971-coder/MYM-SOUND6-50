<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MYM SOUND</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#08080d;
 --panel:#11111a;
 --panel2:#171721;
 --border:#292938;
 --purple:#8b5cf6;
 --purple2:#6d28d9;
 --text:#fff;
 --muted:#9b9baa;
 --danger:#ef4444;
 --green:#22c55e;
}
body{
 font-family:Arial,Helvetica,sans-serif;
 background:var(--bg);
 color:var(--text);
 min-height:100vh;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.auth{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
 background:
 radial-gradient(circle at top,#241044 0,transparent 38%),
 var(--bg);
}
.auth-box{
 width:420px;
 max-width:100%;
 background:rgba(17,17,26,.96);
 border:1px solid var(--border);
 border-radius:22px;
 padding:30px;
 box-shadow:0 25px 80px #000;
}
.logo{
 font-size:30px;
 font-weight:900;
 letter-spacing:2px;
}
.logo span{color:var(--purple)}
.auth-logo{text-align:center;margin-bottom:25px}
.auth-tabs{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-bottom:20px;
}
.auth-tabs button,.nav-btn,.btn{
 border:1px solid var(--border);
 background:var(--panel2);
 color:var(--text);
 border-radius:10px;
 padding:11px 15px;
 transition:.2s;
}
.auth-tabs button.active,.btn.primary,.nav-btn.active{
 background:var(--purple);
 border-color:var(--purple);
}
.field{margin-bottom:14px}
.field label{
 display:block;
 color:var(--muted);
 font-size:13px;
 margin-bottom:7px;
}
.field input,.field textarea,.field select{
 width:100%;
 border:1px solid var(--border);
 background:#0c0c13;
 color:#fff;
 border-radius:10px;
 padding:12px;
 outline:none;
}
.field input:focus,.field textarea:focus,.field select:focus{
 border-color:var(--purple);
}
textarea{min-height:100px;resize:vertical}
.auth-submit{width:100%;margin-top:8px}
.switch{text-align:center;color:var(--muted);font-size:13px;margin-top:16px}
.switch button{
 border:0;background:none;color:var(--purple);
}

.topbar{
 height:68px;
 border-bottom:1px solid var(--border);
 background:rgba(8,8,13,.94);
 backdrop-filter:blur(15px);
 display:flex;
 align-items:center;
 gap:20px;
 padding:0 20px;
 position:sticky;
 top:0;
 z-index:50;
}
.topbar .logo{font-size:22px;white-space:nowrap}
.search{
 flex:1;
 max-width:650px;
 position:relative;
}
.search input{
 width:100%;
 padding:11px 16px;
 border:1px solid var(--border);
 border-radius:12px;
 background:var(--panel);
 color:white;
 outline:none;
}
.top-actions{margin-left:auto;display:flex;gap:8px}
.icon-btn{
 width:42px;
 height:42px;
 border-radius:11px;
 border:1px solid var(--border);
 background:var(--panel);
 color:#fff;
}
.badge{
 display:inline-flex;
 align-items:center;
 justify-content:center;
 min-width:18px;
 height:18px;
 padding:0 5px;
 border-radius:20px;
 background:var(--danger);
 font-size:10px;
 position:absolute;
 top:-3px;
 right:-3px;
}

.layout{display:flex;min-height:calc(100vh - 68px)}
.sidebar{
 width:230px;
 border-right:1px solid var(--border);
 padding:15px;
 position:sticky;
 top:68px;
 height:calc(100vh - 68px);
 overflow:auto;
 background:#0b0b11;
}
.nav{
 display:flex;
 flex-direction:column;
 gap:6px;
}
.nav-btn{
 text-align:left;
 width:100%;
 border-color:transparent;
 background:transparent;
 color:#bbb;
}
.nav-btn:hover{background:var(--panel)}
.nav-btn.active{color:#fff}
.nav-title{
 color:#666675;
 font-size:11px;
 text-transform:uppercase;
 letter-spacing:1px;
 margin:20px 10px 8px;
}
.main{
 flex:1;
 min-width:0;
 padding:24px;
 padding-bottom:110px;
}
.container{max-width:1200px;margin:auto}

.page-title{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
 margin-bottom:22px;
}
.page-title h1{font-size:28px}
.page-title p{color:var(--muted);margin-top:5px}

.card{
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:16px;
 padding:18px;
 margin-bottom:15px;
}
.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(270px,1fr));
 gap:15px;
}
.empty{
 padding:50px 20px;
 text-align:center;
 color:var(--muted);
 background:var(--panel);
 border:1px dashed var(--border);
 border-radius:16px;
}

.avatar{
 width:44px;
 height:44px;
 min-width:44px;
 border-radius:50%;
 background:linear-gradient(135deg,var(--purple),#31145f);
 display:flex;
 align-items:center;
 justify-content:center;
 font-weight:800;
 overflow:hidden;
 background-size:cover;
 background-position:center;
}
.avatar.xs{width:32px;height:32px;min-width:32px;font-size:11px}
.avatar.sm{width:38px;height:38px;min-width:38px;font-size:13px}
.avatar.lg{width:100px;height:100px;min-width:100px;font-size:28px}
.avatar img{width:100%;height:100%;object-fit:cover}

.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted)}
.small{font-size:12px}
.role{
 display:inline-block;
 border:1px solid #493476;
 color:#c4adff;
 background:#211537;
 padding:4px 8px;
 border-radius:20px;
 font-size:11px;
}
.pro{
 color:#fff;
 background:linear-gradient(90deg,#8b5cf6,#c084fc);
 border:0;
}
.online{
 display:inline-block;
 width:8px;
 height:8px;
 border-radius:50%;
 background:var(--green);
 margin-right:5px;
}

.tabs{
 display:flex;
 gap:8px;
 overflow:auto;
 margin-bottom:18px;
}
.tab{
 padding:9px 15px;
 white-space:nowrap;
 border:1px solid var(--border);
 border-radius:10px;
 background:var(--panel);
 color:#aaa;
}
.tab.active{background:var(--purple);color:#fff;border-color:var(--purple)}

.post-header{display:flex;align-items:center;gap:10px}
.post-user{font-weight:700}
.post-content{margin:16px 0;line-height:1.6;white-space:pre-wrap}
.post-media{
 width:100%;
 max-height:500px;
 object-fit:contain;
 border-radius:12px;
 background:#050509;
}
.post-actions{
 display:flex;
 gap:8px;
 border-top:1px solid var(--border);
 padding-top:12px;
}
.action{
 border:0;
 background:transparent;
 color:#aaa;
 padding:8px;
 border-radius:8px;
}
.action:hover{background:var(--panel2);color:#fff}
.action.liked{color:#ff5b85}

.song-card{overflow:hidden}
.cover{
 width:100%;
 aspect-ratio:1;
 border-radius:12px;
 background:linear-gradient(135deg,#241044,#08080d);
 display:flex;
 align-items:center;
 justify-content:center;
 overflow:hidden;
 margin-bottom:13px;
}
.cover img{width:100%;height:100%;object-fit:cover}
.cover-placeholder{font-size:38px;color:#777}
.song-title{font-weight:800;font-size:17px}
.song-desc{color:var(--muted);font-size:13px;margin-top:5px;line-height:1.4}
.song-meta{display:flex;justify-content:space-between;color:#777;font-size:12px;margin:10px 0}

.shop-tabs{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-bottom:20px;
}
.shop-tab{
 border:1px solid var(--border);
 background:var(--panel);
 color:#aaa;
 border-radius:14px;
 padding:16px;
 text-align:left;
}
.shop-tab.active{border-color:var(--purple);background:#171025;color:white}

.shop-banner{
 height:190px;
 border-radius:18px;
 background:
 linear-gradient(90deg,#181126,#0e0e15);
 background-size:cover;
 background-position:center;
 display:flex;
 align-items:end;
 padding:20px;
 position:relative;
 overflow:hidden;
 margin-bottom:20px;
}
.shop-banner:after{
 content:"";
 position:absolute;
 inset:0;
 background:linear-gradient(transparent,rgba(0,0,0,.85));
}
.shop-banner-content{position:relative;z-index:2}
.price{
 font-size:18px;
 font-weight:900;
 color:#c4adff;
}

.channel-banner{
 height:220px;
 border-radius:18px;
 background:linear-gradient(135deg,#21103e,#11111a);
 background-size:cover;
 background-position:center;
 margin-bottom:-50px;
}
.channel-info{
 padding:60px 20px 20px;
}
.channel-avatar{border:5px solid var(--panel)}
.stats{
 display:flex;
 gap:25px;
 flex-wrap:wrap;
 margin:15px 0;
}
.stat strong{display:block;font-size:18px}
.stat span{font-size:12px;color:var(--muted)}

.profile-head{
 display:flex;
 gap:20px;
 align-items:center;
 padding:20px;
}
.profile-info h1{font-size:27px}
.profile-info p{color:var(--muted);margin-top:6px}

.people-list{display:flex;flex-direction:column;gap:8px}
.person{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 padding:12px;
 border:1px solid var(--border);
 background:var(--panel);
 border-radius:13px;
}
.person-info{flex:1;min-width:0}
.person-info strong{display:block}
.person-info span{color:var(--muted);font-size:12px}

.message-layout{
 display:grid;
 grid-template-columns:320px 1fr;
 height:650px;
 border:1px solid var(--border);
 border-radius:16px;
 overflow:hidden;
 background:var(--panel);
}
.conversations{border-right:1px solid var(--border);overflow:auto}
.conv{
 padding:13px;
 display:flex;
 gap:10px;
 align-items:center;
 border-bottom:1px solid var(--border);
 cursor:pointer;
}
.conv:hover,.conv.active{background:var(--panel2)}
.chat{
 display:flex;
 flex-direction:column;
 min-width:0;
}
.chat-head{padding:15px;border-bottom:1px solid var(--border)}
.chat-messages{
 flex:1;
 overflow:auto;
 padding:18px;
 display:flex;
 flex-direction:column;
 gap:8px;
}
.bubble{
 max-width:70%;
 padding:10px 13px;
 border-radius:15px;
 background:#22222d;
 align-self:flex-start;
}
.bubble.mine{
 align-self:flex-end;
 background:var(--purple2);
}
.chat-form{
 display:flex;
 gap:8px;
 padding:12px;
 border-top:1px solid var(--border);
}
.chat-form input{flex:1}

.reel{
 background:#050507;
 border:1px solid var(--border);
 border-radius:18px;
 overflow:hidden;
 max-width:500px;
 margin:auto;
}
.reel video{
 display:block;
 width:100%;
 max-height:650px;
 background:#000;
}
.reel-info{padding:15px}

.settings-grid{
 display:grid;
 grid-template-columns:220px 1fr;
 gap:15px;
}
.settings-menu{display:flex;flex-direction:column;gap:6px}
.settings-menu button{
 border:0;
 background:transparent;
 color:#aaa;
 text-align:left;
 padding:11px;
 border-radius:9px;
}
.settings-menu button.active{background:var(--panel2);color:#fff}

.modal-bg{
 position:fixed;
 inset:0;
 z-index:100;
 background:rgba(0,0,0,.75);
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.modal{
 width:620px;
 max-width:100%;
 max-height:90vh;
 overflow:auto;
 background:var(--panel);
 border:1px solid var(--border);
 border-radius:18px;
 padding:22px;
}
.modal h2{margin-bottom:18px}
.modal-actions{
 display:flex;
 justify-content:flex-end;
 gap:8px;
 margin-top:20px;
}

.toast{
 position:fixed;
 right:20px;
 bottom:95px;
 z-index:200;
 background:#fff;
 color:#000;
 padding:12px 17px;
 border-radius:10px;
 transform:translateY(20px);
 opacity:0;
 pointer-events:none;
 transition:.25s;
}
.toast.show{opacity:1;transform:translateY(0)}

.player{
 position:fixed;
 bottom:0;
 left:0;
 right:0;
 height:72px;
 z-index:60;
 background:rgba(14,14,21,.97);
 backdrop-filter:blur(15px);
 border-top:1px solid var(--border);
 display:flex;
 align-items:center;
 gap:14px;
 padding:8px 18px;
}
.player-cover{
 width:52px;
 height:52px;
 border-radius:8px;
 overflow:hidden;
 background:#222;
}
.player-cover img{width:100%;height:100%;object-fit:cover}
.player-info{width:220px;min-width:120px}
.player-info strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-info span{font-size:11px;color:#999}
.player-controls{display:flex;gap:5px}
.player-progress{flex:1}
.player-progress input{width:100%}
.player-volume{width:110px}
.range{accent-color:var(--purple)}

.file-label{
 display:block;
 border:1px dashed #51406e;
 padding:15px;
 text-align:center;
 border-radius:10px;
 color:#aaa;
 cursor:pointer;
}
.file-label:hover{background:#171222}
.file-label input{display:none}

.checkbox{
 display:flex;
 align-items:center;
 gap:9px;
 margin:12px 0;
 color:#aaa;
}
.checkbox input{accent-color:var(--purple)}

@media(max-width:850px){
 .sidebar{
  width:100%;
  height:auto;
  position:fixed;
  bottom:72px;
  top:auto;
  left:0;
  right:0;
  z-index:55;
  border-right:0;
  border-top:1px solid var(--border);
  padding:7px;
 }
 .nav{
  flex-direction:row;
  overflow-x:auto;
 }
 .nav-btn{
  min-width:max-content;
  text-align:center;
  padding:9px 12px;
 }
 .nav-title{display:none}
 .layout{display:block}
 .main{padding:15px;padding-bottom:160px}
 .topbar{padding:0 10px;gap:8px}
 .topbar .logo{font-size:17px}
 .search{display:none}
 .message-layout{grid-template-columns:1fr;height:600px}
 .conversations{display:none}
 .player{height:72px;padding:7px 10px}
 .player-info{width:120px}
 .player-volume{display:none}
 .profile-head{align-items:flex-start;flex-direction:column}
 .settings-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div id="toast" class="toast"></div>

<section id="authScreen" class="auth">
 <div class="auth-box">
  <div class="auth-logo">
   <div class="logo">MYM <span>SOUND</span></div>
   <p class="muted" style="margin-top:8px">Müzik topluluğuna giriş yap</p>
  </div>

  <div class="auth-tabs">
   <button id="loginTab" class="active" onclick="showLogin()">Giriş Yap</button>
   <button id="registerTab" onclick="showRegister()">Kayıt Ol</button>
  </div>

  <form id="loginForm">
   <div class="field">
    <label>Kullanıcı adı</label>
    <input id="loginUsername" required autocomplete="username">
   </div>
   <div class="field">
    <label>Şifre</label>
    <input id="loginPassword" type="password" required autocomplete="current-password">
   </div>
   <button class="btn primary auth-submit" type="submit">Giriş Yap</button>
  </form>

  <form id="registerForm" class="hidden">
   <div class="field">
    <label>Ad Soyad</label>
    <input id="registerName" required maxlength="40">
   </div>
   <div class="field">
    <label>Kullanıcı adı</label>
    <input id="registerUsername" required maxlength="24">
   </div>
   <div class="field">
    <label>Şifre</label>
    <input id="registerPassword" type="password" required minlength="6">
   </div>
   <div class="field">
    <label>Şifre tekrar</label>
    <input id="registerPassword2" type="password" required minlength="6">
   </div>
   <div class="field">
    <label>Rol</label>
    <select id="registerRole">
     <option>Dinleyici</option>
     <option>Sanatçı</option>
     <option>Beat Maker</option>
     <option>Mix Engineer</option>
     <option>Prodüktör</option>
    </select>
   </div>
   <button class="btn primary auth-submit" type="submit">Hesap Oluştur</button>
  </form>

  <div class="switch">Bu sürüm yerel demo olarak çalışır.</div>
 </div>
</section>

<div id="app" class="hidden">

 <header class="topbar">
  <div class="logo">MYM <span>SOUND</span></div>

  <div class="search">
   <input id="globalSearch" placeholder="Kişi, şarkı, gönderi ara...">
  </div>

  <div class="top-actions">
   <button class="icon-btn" data-page="notifications" title="Bildirimler" style="position:relative">
    Bildirim
    <span id="notificationBadge" class="badge hidden">0</span>
   </button>
   <button class="icon-btn" data-page="profile">Profil</button>
  </div>
 </header>

 <div class="layout">

  <aside class="sidebar">
   <nav class="nav">
    <button class="nav-btn active" data-page="home">Ana Sayfa</button>
    <button class="nav-btn" data-page="reels">Reels</button>
    <button class="nav-btn" data-page="channels">Kanallar</button>
    <button class="nav-btn" data-page="shop">Shop</button>
    <button class="nav-btn" data-page="people">Kişiler</button>
    <button class="nav-btn" data-page="messages">Mesajlar</button>
    <button class="nav-btn" data-page="profile">Profile</button>
    <button class="nav-btn" data-page="settings">Ayarlar</button>
    <button class="nav-btn" data-page="pro">MYM PRO</button>
   </nav>

   <div class="nav-title">Hızlı İşlemler</div>
   <nav class="nav">
    <button class="nav-btn" data-action="new-song">+ Şarkı Ekle</button>
    <button class="nav-btn" data-action="new-post">+ Gönderi</button>
    <button class="nav-btn" data-action="new-reel">+ Reel</button>
    <button class="nav-btn" data-action="new-shop">+ Shop Ürünü</button>
   </nav>
  </aside>

  <main id="main" class="main"></main>
 </div>

 <div id="modalRoot"></div>

 <div id="player" class="player">
  <div class="player-cover" id="playerCover"></div>
  <div class="player-info">
   <strong id="playerTitle">Şarkı seçilmedi</strong>
   <span id="playerArtist">MYM SOUND</span>
  </div>
  <div class="player-controls">
   <button class="icon-btn" data-action="prev">‹</button>
   <button class="icon-btn" id="playPause" data-action="toggle-play">Play</button>
   <button class="icon-btn" data-action="next">›</button>
  </div>
  <div class="player-progress">
   <input id="progress" class="range" type="range" min="0" max="100" value="0">
  </div>
  <div class="player-volume">
   <input id="volume" class="range" type="range" min="0" max="1" step=".01" value=".8">
  </div>
 </div>

 <audio id="globalAudio"></audio>
</div>

<script>
"use strict";

/* =========================
   STORAGE
========================= */

const KEY = {
 users:"mym_users",
 posts:"mym_posts",
 songs:"mym_songs",
 reels:"mym_reels",
 shop:"mym_shop_items",
 messages:"mym_messages",
 activities:"mym_activity",
 notifications:"mym_notifications",
 comments:"mym_comments",
 current:"mym_current_user",
 history:"mym_history"
};

function load(key,fallback=[]){
 try{
  const value=localStorage.getItem(key);
  return value ? JSON.parse(value) : fallback;
 }catch(e){return fallback}
}

function save(key,value){
 localStorage.setItem(key,JSON.stringify(value));
}

let users=load(KEY.users,[]);
let posts=load(KEY.posts,[]);
let songs=load(KEY.songs,[]);
let reels=load(KEY.reels,[]);
let shopItems=load(KEY.shop,[]);
let messages=load(KEY.messages,[]);
let activities=load(KEY.activities,[]);
let notifications=load(KEY.notifications,[]);
let comments=load(KEY.comments,[]);
let history=load(KEY.history,[]);

const state={
 page:"home",
 feed:"all",
 shopTab:"mine",
 channelUserId:null,
 currentChatUserId:null,
 settingsTab:"account",
 search:"",
 queue:[],
 queueIndex:-1,
 currentSongId:null,
 repeat:false,
 shuffle:false,
};

function persist(){
 save(KEY.users,users);
 save(KEY.posts,posts);
 save(KEY.songs,songs);
 save(KEY.reels,reels);
 save(KEY.shop,shopItems);
 save(KEY.messages,messages);
 save(KEY.activities,activities);
 save(KEY.notifications,notifications);
 save(KEY.comments,comments);
 save(KEY.history,history);
}

function uid(prefix="id"){
 return prefix+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,8);
}

function me(){
 const id=localStorage.getItem(KEY.current);
 return users.find(u=>u.id===id)||null;
}

function getUser(id){
 return users.find(u=>u.id===id)||null;
}

function updateUser(user){
 const i=users.findIndex(u=>u.id===user.id);
 if(i>=0) users[i]=user;
 save(KEY.users,users);
}

function escapeHTML(value){
 return String(value??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function initials(user){
 if(!user)return "?";
 return escapeHTML((user.name||user.username||"?").trim().slice(0,2).toUpperCase());
}

function avatarHTML(user,size="md"){
 if(!user)return `<div class="avatar ${size}">?</div>`;
 return `<div class="avatar ${size}" data-avatar="${escapeHTML(user.avatarMediaId||"")}">${initials(user)}</div>`;
}

function isBlocked(userId){
 const a=me();
 const b=getUser(userId);
 if(!a||!b)return false;
 return (a.blockedUsers||[]).includes(userId) ||

/* =========================
   INDEXED DB
========================= */

let db=null;
const mediaURLs=new Map();

function openDB(){
 return new Promise((resolve,reject)=>{
  const request=indexedDB.open("mym_sound_media",1);

  request.onupgradeneeded=e=>{
   const database=e.target.result;
   if(!database.objectStoreNames.contains("media")){
    database.createObjectStore("media",{keyPath:"id"});
   }
  };

  request.onsuccess=e=>{
   db=e.target.result;
   resolve();
  };

  request.onerror=()=>reject(request.error);
 });
}

function saveMedia(file){
 return new Promise((resolve,reject)=>{
  if(!db)return reject("DB hazır değil");
  const id=uid("media");
  const tx=db.transaction("media","readwrite");
  tx.objectStore("media").put({
   id,
   blob:file,
   name:file.name,
   type:file.type
  });
  tx.oncomplete=()=>resolve(id);
  tx.onerror=()=>reject(tx.error);
 });
}

function getMedia(id){
 return new Promise((resolve,reject)=>{
  if(!id)return resolve(null);
  const tx=db.transaction("media","readonly");
  const req=tx.objectStore("media").get(id);
  req.onsuccess=()=>resolve(req.result||null);
  req.onerror=()=>reject(req.error);
 });
}

async function getMediaURL(id){
 if(!id)return "";
 if(mediaURLs.has(id))return mediaURLs.get(id);

 const item=await getMedia(id);
 if(!item)return "";

 const url=URL.createObjectURL(item.blob);
 mediaURLs.set(id,url);
 return url;
}

async function hydrateMedia(){
 const elements=document.querySelectorAll("[data-avatar],[data-media],[data-bg]");
 for(const el of elements){
  const id=el.dataset.avatar||el.dataset.media||el.dataset.bg;
  if(!id)continue;

  try{
   const url=await getMediaURL(id);

   if(el.dataset.avatar){
    el.style.backgroundImage=`url("${url}")`;
    el.textContent="";
   }

   if(el.dataset.media){
    el.src=url;
   }

   if(el.dataset.bg){
    el.style.backgroundImage=`url("${url}")`;
   }
  }catch(e){}
 }
}

function toggleFollow(userId){
 const a=me();
 const b=getUser(userId);

 if(!a||!b||a.id===b.id)return;

 if(isBlocked(userId)){
  toast("Bu kullanıcıyla etkileşim kapalı");
  return;
 }

 a.following=a.following||[];
 b.followers=b.followers||[];

 const index=a.following.indexOf(userId);

 if(index>=0){
  a.following.splice(index,1);
  b.followers=b.followers.filter(id=>id!==a.id);
  addActivity("unfollow",`${b.name} takipten çıkarıldı`,b.id);
 }else{
  a.following.push(userId);
  if(!b.followers.includes(a.id))b.followers.push(a.id);
  addActivity("follow",`${b.name} takip edildi`,b.id);
  addNotification(
   b.id,
   "follow",
   `${a.name} seni takip etmeye başladı`,
   a.id
  );
 }

 updateUser(a);
 updateUser(b);
 render();
}

function toggleBlock(userId){
 const a=me();
 const b=getUser(userId);
 if(!a||!b)return;

 a.blockedUsers=a.blockedUsers||[];

 if(a.blockedUsers.includes(userId)){
  a.blockedUsers=a.blockedUsers.filter(id=>id!==userId);
  addActivity("unblock",`${b.name} engeli kaldırıldı`,b.id);
  toast("Engel kaldırıldı");
 }else{
  a.blockedUsers.push(userId);
  a.following=(a.following||[]).filter(id=>id!==userId);
  b.followers=(b.followers||[]).filter(id=>id!==a.id);
  b.following=(b.following||[]).filter(id=>id!==a.id);
  a.following=(a.following||[]).filter(id=>id!==b.id);

  addActivity("block",`${b.name} engellendi`,b.id);

 }

 updateUser(a);

 render();
}

async function playSong(id){
 const song=songs.find(x=>x.id===id);
 if(!song)return;

 const audio=document.getElementById("globalAudio");
 const url=await getMediaURL(song.mediaId);

 if(!url){
  toast("Ses dosyası bulunamadı");
  return;
 }

 state.currentSongId=id;
 audio.src=url;
 audio.currentTime=0;

 song.plays=(song.plays||0)+1;

 history.unshift({
  id:uid("history"),
  userId:me().id,
  songId:id,
  createdAt:Date.now()
 });

 history=history.slice(0,300);
 save(KEY.history,history);
 save(KEY.songs,songs);

 document.getElementById("playerTitle").textContent=song.name;
 document.getElementById("playerArtist").textContent=getUser(song.userId)?.name||"Bilinmeyen";

 const cover=document.getElementById("playerCover");
 cover.innerHTML=song.coverMediaId
  ? `<img data-media="${escapeHTML(song.coverMediaId)}">`
  : "";

 await hydrateMedia();

 try{
  await audio.play();
  document.getElementById("playPause").textContent="Pause";
 }catch(e){
  document.getElementById("playPause").textContent="Play";
 }
}

function togglePlay(){
 const audio=document.getElementById("globalAudio");

 if(!audio.src){
  if(songs[0])playSong(songs[0].id);
  return;
 }

 if(audio.paused){
  audio.play();
  document.getElementById("playPause").textContent="Pause";
 }else{
  audio.pause();
  document.getElementById("playPause").textContent="Play";
 }
}

function nextSong(){
 if(!songs.length)return;

 if(state.shuffle){
  const random=Math.floor(Math.random()*songs.length);
  playSong(songs[random].id);
  return;
 }

 const index=songs.findIndex(s=>s.id===state.currentSongId);
 const next=(index+1)%songs.length;
 playSong(songs[next].id);
}

function prevSong(){
 if(!songs.length)return;

 const index=songs.findIndex(s=>s.id===state.currentSongId);
 const prev=(index-1+songs.length)%songs.length;
 playSong(songs[prev].id);
}

const audio=document.getElementById("globalAudio");

audio.addEventListener("timeupdate",()=>{
 if(!audio.duration)return;
 document.getElementById("progress").value=(audio.currentTime/audio.duration)*100;
});

audio.addEventListener("ended",()=>{
 if(state.repeat){
  audio.currentTime=0;
  audio.play();
 }else{
  nextSong();
 }
});

document.getElementById("progress").addEventListener("input",e=>{
 if(audio.duration){
  audio.currentTime=(Number(e.target.value)/100)*audio.duration;
 }
});

document.getElementById("volume").addEventListener("input",e=>{
 audio.volume=Number(e.target.value);
});

audio.volume=.8;

async function saveProfile(form){
 const u=me();
 const newName=form.querySelector("[name=name]").value.trim();
 const newUsername=form.querySelector("[name=username]").value.trim().toLowerCase();
 const bio=form.querySelector("[name=bio]").value.trim();

 if(!/^[a-zA-Z0-9_.-]{3,24}$/.test(newUsername)){
  toast("Kullanıcı adı geçersiz");
  return;
 }

 if(users.some(x=>x.id!==u.id&&x.username.toLowerCase()===newUsername)){
  toast("Bu kullanıcı adı kullanılıyor");
  return;
 }

 const changedName=newName!==u.name;
 const changedUsername=newUsername!==u.username;

 if(changedName||changedUsername){
  u.nameChanges=(u.nameChanges||[]).filter(t=>Date.now()-t<7*86400000);

  if(u.nameChanges.length>=3){
   toast("7 gün içinde en fazla 3 değişiklik yapabilirsin");
   return;
  }

  u.nameChanges.push(Date.now());
 }

 if(form.querySelector("[name=avatar]").files[0]){
  u.avatarMediaId=await saveMedia(form.querySelector("[name=avatar]").files[0]);
 }

 if(form.querySelector("[name=profileBg]").files[0]){
  u.profileBackgroundMediaId=await saveMedia(form.querySelector("[name=profileBg]").files[0]);
 }

 u.name=newName;
 u.username=newUsername;
 u.bio=bio;

 updateUser(u);
 addActivity("profile","Profil güncellendi");
 closeModal();
 render();
 toast("Profil güncellendi");
}

function exportData(){

  users,

  songs,
  reels,
  shopItems,
  messages,
  activities,
  notifications,
  comments,
  history
 };

 const blob=new Blob(

 );

 a.href=url;
 a.download="mym-sound-backup.json";
 a.click();
 URL.revokeObjectURL(url);
}

document.addEventListener("click",async e=>{
 const page=e.target.closest("[data-page]");
 if(page){
  state.page=page.dataset.page;

  if(state.page!=="messages"){
   state.currentChatUserId=null;
  }

  render();
  return;
 }

 const action=e.target.closest("[data-action]");
 if(action){
  const a=action.dataset.action;

  if(a==="new-post")newPostModal();
  if(a==="new-song")newSongModal();
  if(a==="new-reel")newReelModal();
  if(a==="new-shop")newShopModal();
  if(a==="profile-settings")profileSettingsModal();
  if(a==="close-modal")closeModal();
  if(a==="toggle-play")togglePlay();
  if(a==="next")nextSong();
  if(a==="prev")prevSong();
  if(a==="logout")logout();

  if(a==="enable-pro"){
   const u=me();
   u.plan="pro";
   updateUser(u);
   addActivity("pro","MYM PRO demo etkinleştirildi");
   render();
   toast("MYM PRO etkinleştirildi");
  }

  if(a==="disable-pro"){
   const u=me();
   u.plan="free";
   updateUser(u);
   render();
   toast("MYM PRO kapatıldı");
  }

  if(a==="read-notifications"){
   const u=me();
   notifications.forEach(n=>{
    if(n.userId===u.id)n.read=true;
   });
   save(KEY.notifications,notifications);
   render();
  }

  if(a==="save-privacy"){
   const u=me();
   u.settings.privateProfile=document.getElementById("privateProfile").checked;
   updateUser(u);
   toast("Gizlilik ayarları kaydedildi");
  }

  if(a==="save-notifications"){
   const u=me();
   u.settings.notifications=document.getElementById("notificationSetting").checked;
   updateUser(u);
   toast("Bildirim ayarları kaydedildi");
  }

  if(a==="save-player"){
   const u=me();
   u.settings.autoplay=document.getElementById("autoplaySetting").checked;
   updateUser(u);
   toast("Oynatıcı ayarları kaydedildi");
  }

  if(a==="export-data")exportData();
  if(a==="reset-data")resetData();

  return;
 }

   persist();

   const fakeSong={

    mediaId:item.mediaId,

   };

   const existing=songs.find(s=>s.id===item.id);

    playSong(existing.id);

     document.getElementById("playerArtist").textContent=getUser(item.userId)?.name||"Shop";

 const setting=e.target.closest("[data-setting]");

document.addEventListener("submit",async e=>{
 const form=e.target;
 const type=form.dataset.form;

 if(!type)return;

 e.preventDefault();

 try{
  if(type==="post")await createPost(form);
  if(type==="song")await createSong(form);
  if(type==="reel")await createReel(form);
  if(type==="shop")await createShopItem(form);
  if(type==="profile")await saveProfile(form);
  if(type==="comment")addComment(form);

  if(type==="message"){
   const text=form.querySelector("[name=text]").value;
   const target=state.currentChatUserId;

   if(!target){
    toast("Önce bir kişi seç");
    return;
   }

   sendMessage(text,target);
  }
 }catch(err){
  console.error(err);
  toast("İşlem sırasında hata oluştu");
 }
});

/* =========================
   SEARCH
========================= */

document.getElementById("globalSearch").addEventListener("keydown",e=>{
 if(e.key==="Enter"){
  const q=e.target.value.trim();

  if(!q){
   state.page="home";
   render();
   return;
  }

  state.search=q;
  state.page="search";
  render();
 }
});

/* =========================
   KEYBOARD
========================= */

document.addEventListener("keydown",e=>{
 if(e.key==="Escape")closeModal();

 if(
  e.key==="Enter" &&
  document.activeElement?.matches('.chat-form input')
 ){
  e.preventDefault();
  document.querySelector(".chat-form button")?.click();
 }
});

/* =========================
   START
========================= */

async function start(){
 try{
  await openDB();
 }catch(e){
  console.error(e);
 }

 const u=me();

 if(u){
  u.online=true;
  u.lastSeen=Date.now();
  updateUser(u);
  render();
 }else{
  showAuth();
 }
}

start();

window.addEventListener("beforeunload",()=>{
 const u=me();

 if(u){
  u.online=false;
  u.lastSeen=Date.now();
  updateUser(u);
 }
});
</script>
</body>
</html>
