<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MYM SOUND</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
    --bg:#080808;
    --panel:#111;
    --panel2:#171717;
    --border:#292929;
    --text:#fff;
    --muted:#8d8d8d;
    --purple:#8b5cf6;
    --purple2:#6d28d9;
    --danger:#ef4444;
    --success:#22c55e;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:#333;border-radius:10px}

/* AUTH */

.auth-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        radial-gradient(circle at top,#291344 0,#0b0810 35%,#050505 75%);
}

.auth-box{
    width:100%;
    max-width:450px;
    background:#111;
    border:1px solid #333;
    border-radius:22px;
    padding:30px;
    box-shadow:0 25px 80px #000;
}

.logo-big{
    text-align:center;
    font-size:34px;
    font-weight:900;
    letter-spacing:2px;
    margin-bottom:7px;
}

.logo-big span,
.logo span{color:var(--purple)}

.auth-sub{
    color:#888;
    text-align:center;
    margin-bottom:25px;
}

.auth-tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
}

.auth-tabs button{
    flex:1;
    padding:12px;
    border-radius:11px;
    border:1px solid var(--border);
    background:#151515;
    color:#aaa;
}

.auth-tabs button.active{
    background:var(--purple);
    border-color:var(--purple);
    color:#fff;
}

.auth-form{
    display:flex;
    flex-direction:column;
    gap:11px;
}

.auth-form input,
.auth-form select{
    width:100%;
    padding:13px;
    background:#090909;
    color:#fff;
    border:1px solid var(--border);
    border-radius:11px;
    outline:none;
}

.auth-form input:focus,
.auth-form select:focus{
    border-color:var(--purple);
}

.primary{
    background:var(--purple)!important;
    border-color:var(--purple)!important;
    color:#fff!important;
}

.auth-note{
    color:#666;
    font-size:12px;
    text-align:center;
    margin-top:14px;
}

/* TOP */

.topbar{
    height:64px;
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    align-items:center;
    gap:15px;
    padding:0 18px;
    background:rgba(8,8,8,.95);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--border);
}

.logo{
    font-size:21px;
    font-weight:900;
    white-space:nowrap;
}

.search{
    flex:1;
    max-width:520px;
}

.search input{
    width:100%;
    padding:11px 14px;
    border-radius:11px;
    border:1px solid var(--border);
    background:#111;
    color:#fff;
    outline:none;
}

.top-actions{
    margin-left:auto;
    display:flex;
    gap:7px;
}

.icon-btn{
    width:40px;
    height:40px;
    border:1px solid var(--border);
    background:#111;
    color:#fff;
    border-radius:10px;
    position:relative;
}

.icon-btn:hover{
    border-color:var(--purple);
}

.count{
    position:absolute;
    top:-5px;
    right:-5px;
    background:var(--danger);
    min-width:17px;
    height:17px;
    border-radius:50%;
    font-size:10px;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* LAYOUT */

.layout{
    display:flex;
    min-height:calc(100vh - 64px);
}

.sidebar{
    width:235px;
    flex-shrink:0;
    border-right:1px solid var(--border);
    background:#090909;
    padding:14px;
    position:sticky;
    top:64px;
    height:calc(100vh - 64px);
    overflow:auto;
}

.nav-title{
    color:#666;
    font-size:11px;
    margin:12px 10px 7px;
    text-transform:uppercase;
}

.nav-btn{
    width:100%;
    text-align:left;
    border:0;
    background:transparent;
    color:#aaa;
    padding:12px;
    border-radius:10px;
    margin-bottom:3px;
}

.nav-btn:hover,
.nav-btn.active{
    background:#1c1428;
    color:#fff;
}

.main{
    width:100%;
    max-width:1100px;
    margin:auto;
    padding:25px;
}

.page-title{
    font-size:28px;
    font-weight:900;
    margin-bottom:7px;
}

.page-subtitle{
    color:#777;
    margin-bottom:20px;
}

/* GENERAL */

.card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:17px;
    padding:18px;
    margin-bottom:15px;
}

.row{
    display:flex;
    align-items:center;
    gap:10px;
}

.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.flex1{flex:1}
.muted{color:var(--muted)}
.small{font-size:12px}

.btn{
    border:1px solid var(--border);
    background:#171717;
    color:#fff;
    padding:9px 13px;
    border-radius:10px;
}

.btn:hover{border-color:var(--purple)}
.btn-danger{
    color:#ff7777;
    background:#291010;
    border-color:#612020;
}
.btn-success{
    color:#6ee58b;
    background:#102415;
    border-color:#20592d;
}

.empty{
    text-align:center;
    padding:45px 15px;
    color:#666;
}

.field,
.form-input,
.form-select,
textarea{
    width:100%;
    background:#090909;
    color:#fff;
    border:1px solid var(--border);
    border-radius:11px;
    padding:12px;
    outline:none;
}

.field:focus,
.form-input:focus,
.form-select:focus,
textarea:focus{
    border-color:var(--purple);
}

textarea{
    resize:vertical;
    min-height:110px;
}

.form-group{
    margin-bottom:13px;
}

.form-group label{
    display:block;
    color:#aaa;
    font-size:13px;
    margin-bottom:6px;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

/* AVATAR */

.avatar{
    width:44px;
    height:44px;
    min-width:44px;
    border-radius:50%;
    background:linear-gradient(135deg,#7c3aed,#111);
    border:1px solid #444;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:900;
}

.avatar.small{
    width:34px;
    height:34px;
    min-width:34px;
    font-size:12px;
}

.avatar.large{
    width:100px;
    height:100px;
    min-width:100px;
    font-size:28px;
    border:3px solid #111;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* USER */

.user-line{
    display:flex;
    align-items:center;
    gap:10px;
}

.user-name{
    font-weight:800;
}

.role{
    color:#888;
    font-size:12px;
}

.online-dot{
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    background:#555;
    margin-right:4px;
}

.online-dot.on{background:var(--success)}

.plan{
    display:inline-block;
    padding:4px 8px;
    border-radius:6px;
    font-size:10px;
    font-weight:900;
}

.plan-free{
    background:#242424;
    color:#aaa;
}

.plan-pro{
    background:var(--purple);
    color:#fff;
}

/* TABS */

.tabs{
    display:flex;
    gap:7px;
    overflow-x:auto;
    margin-bottom:15px;
    scrollbar-width:none;
}

.tabs button{
    white-space:nowrap;
}

/* POSTS */

.post{
    background:#111;
    border:1px solid var(--border);
    border-radius:17px;
    padding:17px;
    margin-bottom:15px;
}

.post-head{
    display:flex;
    align-items:center;
    gap:10px;
}

.post-text{
    white-space:pre-wrap;
    line-height:1.55;
    margin:14px 0;
}

.post-media{
    width:100%;
    max-height:600px;
    object-fit:contain;
    background:#050505;
    border-radius:12px;
}

.post-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:12px;
}

.comment-box{
    display:flex;
    gap:7px;
    margin-top:12px;
}

.comment-box input{
    flex:1;
    background:#090909;
    border:1px solid var(--border);
    color:#fff;
    padding:10px;
    border-radius:10px;
}

.comment{
    padding:8px 0;
    border-bottom:1px solid #222;
}

/* SONG */

.song{
    display:flex;
    align-items:center;
    gap:14px;
}

.cover{
    width:75px;
    height:75px;
    min-width:75px;
    border-radius:12px;
    object-fit:cover;
    background:#222;
}

.song-info{
    flex:1;
    min-width:0;
}

.song-title{
    font-weight:900;
    font-size:17px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.song-desc{
    color:#777;
    font-size:13px;
    margin-top:4px;
}

.song-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

/* PROFILE */

.profile-cover{
    height:230px;
    border-radius:18px;
    border:1px solid var(--border);
    background:linear-gradient(135deg,#241238,#0d0d0d);
    background-size:cover;
    background-position:center;
}

.profile-info{
    position:relative;
    margin-top:-50px;
    padding:0 22px;
    display:flex;
    align-items:end;
    gap:18px;
}

.profile-text{
    padding-bottom:10px;
}

.profile-name{
    font-size:25px;
    font-weight:900;
}

.stats{
    display:flex;
    gap:25px;
    margin-top:12px;
}

.stat b{display:block}
.stat span{
    color:#777;
    font-size:12px;
}

/* CHANNEL */

.channel-cover{
    height:210px;
    background:#1b1029;
    background-size:cover;
    background-position:center;
}

.channel-body{
    padding:20px;
}

.channel-actions{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-top:15px;
}

/* PEOPLE */

.person{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 0;
    border-bottom:1px solid #222;
}

.person-info{flex:1}
.person-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

/* SHOP */

.shop-cover{
    height:190px;
    border-radius:17px;
    background:linear-gradient(135deg,#29143f,#101010);
    background-size:cover;
    background-position:center;
    border:1px solid var(--border);
    display:flex;
    align-items:end;
    padding:20px;
    margin-bottom:15px;
}

.shop-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.shop-item{
    background:#111;
    border:1px solid var(--border);
    border-radius:15px;
    padding:15px;
}

.shop-type{
    color:var(--purple);
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
}

.price{
    font-size:22px;
    font-weight:900;
    margin:10px 0;
}

/* REELS */

.reel{
    max-width:650px;
    margin:0 auto 20px;
    background:#111;
    border:1px solid var(--border);
    border-radius:18px;
    overflow:hidden;
}

.reel video{
    width:100%;
    max-height:720px;
    background:#000;
    display:block;
}

.reel-body{
    padding:15px;
}

/* SETTINGS */

.settings-list{
    display:flex;
    flex-direction:column;
}

.setting-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    padding:17px 5px;
    border-bottom:1px solid #222;
}

.setting-item:last-child{border-bottom:0}

.setting-title{font-weight:800}
.setting-desc{
    color:#777;
    font-size:12px;
    margin-top:4px;
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:500;
    background:rgba(0,0,0,.75);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:18px;
}

.modal-box{
    width:100%;
    max-width:650px;
    max-height:90vh;
    overflow:auto;
    background:#111;
    border:1px solid #333;
    border-radius:19px;
    padding:20px;
}

.modal-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.close{
    width:36px;
    height:36px;
    border:1px solid var(--border);
    background:#171717;
    color:#fff;
    border-radius:9px;
}

/* PLAYER */

.player{
    position:fixed;
    bottom:0;
    left:235px;
    right:0;
    height:72px;
    z-index:150;
    background:rgba(15,15,15,.97);
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    gap:12px;
    padding:8px 15px;
}

.player-cover{
    width:52px;
    height:52px;
    border-radius:8px;
    object-fit:cover;
}

.player-info{
    width:180px;
    min-width:0;
}

.player-info b{
    display:block;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.player-controls{
    display:flex;
    gap:5px;
}

.progress{
    flex:1;
}

.progress input{
    width:100%;
}

.volume{
    width:100px;
}

/* TOAST */

.toast{
    position:fixed;
    right:20px;
    bottom:90px;
    z-index:900;
    background:#171717;
    border:1px solid #444;
    color:#fff;
    padding:12px 16px;
    border-radius:10px;
    opacity:0;
    transform:translateY(10px);
    pointer-events:none;
    transition:.2s;
}

.toast.show{
    opacity:1;
    transform:translateY(0);
}

/* RESPONSIVE */

@media(max-width:800px){
    .sidebar{
        position:fixed;
        bottom:0;
        top:auto;
        left:0;
        right:0;
        width:100%;
        height:65px;
        z-index:300;
        border-right:0;
        border-top:1px solid var(--border);
        display:flex;
        overflow-x:auto;
        padding:5px;
    }

    .nav-title{display:none}

    .nav-group{
        display:flex;
        margin:0;
    }

    .nav-btn{
        min-width:90px;
        text-align:center;
        margin:0;
        padding:10px 7px;
        font-size:11px;
    }

    .main{
        padding:17px;
        padding-bottom:90px;
    }

    .player{
        left:0;
        bottom:65px;
        height:66px;
    }

    .player-info{width:130px}
    .volume{display:none}

    .shop-grid,
    .form-grid{
        grid-template-columns:1fr;
    }

    .topbar{
        padding:0 10px;
        gap:8px;
    }

    .logo{font-size:17px}
    .search{max-width:none}
    .top-actions .icon-btn:nth-child(2){display:none}

    .profile-info{
        padding:0 10px;
        gap:10px;
    }

    .profile-name{font-size:20px}

    .avatar.large{
        width:78px;
        height:78px;
        min-width:78px;
    }

    .song{
        align-items:flex-start;
    }
}

@media(max-width:500px){
    .top-actions{display:none}
    .page-title{font-size:24px}
    .card{padding:14px}
    .post{padding:14px}
}
</style>
</head>

<body>

<!-- AUTH -->

<div id="authScreen" class="auth-screen">
    <div class="auth-box">

        <div class="logo-big">MYM <span>SOUND</span></div>
        <div class="auth-sub">Müzik, içerik ve üreticiler için sosyal platform</div>

        <div class="auth-tabs">
            <button id="loginTab" class="active" onclick="showAuthMode('login')">Giriş Yap</button>
            <button id="registerTab" onclick="showAuthMode('register')">Kayıt Ol</button>
        </div>

        <form id="loginForm" class="auth-form" onsubmit="loginUser(event)">
            <input id="loginUsername" placeholder="Kullanıcı adı" required>
            <input id="loginPassword" type="password" placeholder="Şifre" required>
            <button class="auth-button primary">Giriş Yap</button>
        </form>

        <form id="registerForm" class="auth-form hidden" onsubmit="registerUser(event)">
            <input id="registerName" placeholder="Ad Soyad" required>
            <input id="registerUsername" placeholder="Kullanıcı adı" required>
            <input id="registerPassword" type="password" placeholder="Şifre" required>
            <input id="registerPassword2" type="password" placeholder="Şifre tekrar" required>

            <select id="registerRole" required>
                <option value="">Rol seç</option>
                <option>Dinleyici</option>
                <option>Sanatçı</option>
                <option>Beat Maker</option>
                <option>Mix Engineer</option>
                <option>Prodüktör</option>
            </select>

            <button class="auth-button primary">Hesap Oluştur</button>
        </form>

        <div class="auth-note">
            Bu sürüm tarayıcı üzerinde yerel demo olarak çalışır.
        </div>
    </div>
</div>

<!-- APP -->

<div id="app" class="app hidden">

    <header class="topbar">

        <div class="logo">MYM <span>SOUND</span></div>

        <div class="search">
            <input id="globalSearch"
                   placeholder="Kişi, şarkı, gönderi veya Shop ara..."
                   oninput="globalSearch(this.value)">
        </div>

        <div class="top-actions">

            <button class="icon-btn" onclick="openPage('messages')">
                Mesaj
                <span id="messageCount" class="count hidden"></span>
            </button>

            <button class="icon-btn" onclick="openPage('notifications')">
                Bildirim
                <span id="notificationCount" class="count hidden"></span>
            </button>

        </div>

    </header>

    <div class="layout">

        <aside class="sidebar">

            <div class="nav-group">
                <div class="nav-title">MYM SOUND</div>

                <button class="nav-btn active" data-page="home" onclick="openPage('home')">
                    Ana Sayfa
                </button>

                <button class="nav-btn" data-page="reels" onclick="openPage('reels')">
                    Reels
                </button>

                <button class="nav-btn" data-page="channels" onclick="openPage('channels')">
                    Kanallar
                </button>

                <button class="nav-btn" data-page="shop" onclick="openPage('shop')">
                    Shop
                </button>

                <button class="nav-btn" data-page="people" onclick="openPage('people')">
                    Kişiler
                </button>
            </div>

            <div class="nav-group">

                <div class="nav-title">Ben</div>

                <button class="nav-btn" data-page="profile" onclick="openPage('profile')">
                    Profil
                </button>

                <button class="nav-btn" data-page="messages" onclick="openPage('messages')">
                    Mesajlaşma
                </button>

                <button class="nav-btn" data-page="activity" onclick="openPage('activity')">
                    Hareketlerim
                </button>

                <button class="nav-btn" data-page="archive" onclick="openPage('archive')">
                    Arşiv
                </button>
            </div>

            <div class="nav-group">

                <div class="nav-title">Sistem</div>

                <button class="nav-btn" data-page="settings" onclick="openPage('settings')">
                    Ayarlar
                </button>

            </div>

        </aside>

        <main id="main" class="main"></main>

    </div>

    <div id="player" class="player hidden">

        <img id="playerCover" class="player-cover">

        <div class="player-info">
            <b id="playerTitle">Şarkı yok</b>
            <span id="playerArtist" class="small muted"></span>
        </div>

        <div class="player-controls">
            <button class="btn btn-small" onclick="previousSong()">Önceki</button>
            <button class="btn btn-small" onclick="togglePlayer()">Oynat</button>
            <button class="btn btn-small" onclick="nextSong()">Sonraki</button>
        </div>

        <div class="progress">
            <input id="playerProgress"
                   type="range"
                   min="0"
                   max="100"
                   value="0"
                   oninput="seekPlayer(this.value)">
        </div>

        <input id="playerVolume"
               class="volume"
               type="range"
               min="0"
               max="1"
               step=".01"
               value=".8"
               oninput="audio.volume=this.value">

    </div>

</div>

<div id="modal" class="modal hidden" onclick="modalOutside(event)">
    <div id="modalBox" class="modal-box"></div>
</div>

<div id="toast" class="toast"></div>

<audio id="audio"></audio>

<script>
/* =========================================================
   DATA
========================================================= */

const KEYS = {
    users:"mym_users",
    posts:"mym_posts",
    songs:"mym_songs",
    reels:"mym_reels",
    shop:"mym_shop",
    comments:"mym_comments",
    messages:"mym_messages",
    activity:"mym_activity",
    notifications:"mym_notifications",
    archive:"mym_archive",
    current:"mym_current_user",
    media:"mym_media"
};

const state = {
    page:"home",
    feed:"all",
    channelUser:null,
    channelTab:"general",
    chatUser:null,
    playerSong:null,
    queue:[],
    queueIndex:0
};

let db;
const audio = document.getElementById("audio");

/* =========================================================
   STORAGE
========================================================= */

function load(key,fallback=[]){
    try{
        const raw=localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
    }catch{
        return fallback;
    }
}

    localStorage.setItem(key,JSON.stringify(value));
}

/* =========================================================
   INDEXED DB MEDIA
========================================================= */

function openDB(){
    return new Promise((resolve,reject)=>{
        const request=indexedDB.open("mym_sound_media",1);

        request.onupgradeneeded=e=>{
            const d=e.target.result;
            if(!d.objectStoreNames.contains("media")){
                d.createObjectStore("media",{keyPath:"id"});
            }
        };

        request.onsuccess=e=>{
            db=e.target.result;
            resolve();
        };

        request.onerror=()=>reject(request.error);
    });
}

function putMedia(blob){
    return new Promise((resolve,reject)=>{
        const id=uid("media");
        const tx=db.transaction("media","readwrite");
        tx.objectStore("media").put({id,blob});
        tx.oncomplete=()=>resolve(id);
        tx.onerror=()=>reject(tx.error);
    });
}

function getMedia(id){
    return new Promise((resolve,reject)=>{
        if(!id)return resolve(null);

        const tx=db.transaction("media","readonly");
        const request=tx.objectStore("media").get(id);

        request.onsuccess=()=>resolve(request.result?.blob||null);
        request.onerror=()=>reject(request.error);
    });
}

async function mediaURL(id){
    const blob=await getMedia(id);
    return blob ? URL.createObjectURL(blob) : "";
}

/* =========================================================
   HELPERS
========================================================= */

function esc(value=""){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

function initials(user){
    if(!user)return "?";
    return (user.name||user.username||"?")
        .split(" ")
        .map(x=>x[0])
        .join("")
        .slice(0,2)
        .toUpperCase();
}

async function avatarHTML(user,cls="avatar"){
    if(!user)return `<div class="${cls}">?</div>`;

    if(user.avatarMediaId){
        const url=await mediaURL(user.avatarMediaId);

        if(url){
            return `
                <div class="${cls}">
                    <img src="${url}" alt="">
                </div>
            `;
        }
    }

    return `<div class="${cls}">${esc(initials(user))}</div>`;
}

function roleHTML(user){
    return `
        <span class="role">${esc(user.role||"Kullanıcı")}</span>
        <span class="plan ${user.plan==="pro"?"plan-pro":"plan-free"}">
            ${user.plan==="pro"?"PRO":"FREE"}
        </span>
    `;
}

function isBlocked(userId){
    const a=me();
    const b=getUser(userId);

    if(!a||!b)return false;

    return (a.blockedUsers||[]).includes(userId) ||
           (b.blockedUsers||[]).includes(a.id);
}

function isFollowing(userId){
    const u=me();
    return !!u && (u.following||[]).includes(userId);
}

function showToast(text){
    const t=document.getElementById("toast");
    t.textContent=text;
    t.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer=setTimeout(()=>{
        t.classList.remove("show");
    },2500);
}

function saveActivity(type,text){
    const list=activities();

    list.unshift({
        id:uid("activity"),
        userId:me()?.id,

        text,
        createdAt:Date.now()

}

function notify(userId,type,text){
    const list=notifications();

    list.unshift({
        id:uid("notification"),
        userId,
        type,
        text,
        read:false,
        createdAt:Date.now()
    });

    save(KEYS.notifications,list.slice(0,500));
}

function unreadNotifications(){
    const u=me();
    if(!u)return 0;

    return notifications()
        .filter(x=>x.userId===u.id&&!x.read)
        .length;
}

function unreadMessages(){
    const u=me();
    if(!u)return 0;

    return messages()
        .filter(x=>x.toId===u.id&&!x.read)
        .length;
}

function showAuthMode(mode){

    const login=document.getElementById("loginForm");
    const register=document.getElementById("registerForm");

    const lt=document.getElementById("loginTab");
    const rt=document.getElementById("registerTab");

    if(mode==="login"){
        login.classList.remove("hidden");
        register.classList.add("hidden");
        lt.classList.add("active");
        rt.classList.remove("active");
    }else{
        login.classList.add("hidden");
        register.classList.remove("hidden");
        lt.classList.remove("active");
        rt.classList.add("active");
    }
}

function registerUser(e){

    e.preventDefault();

    const name=document.getElementById("registerName").value.trim();
    const username=document.getElementById("registerUsername").value.trim();
    const password=document.getElementById("registerPassword").value;
    const password2=document.getElementById("registerPassword2").value;
    const role=document.getElementById("registerRole").value;

    if(name.length<2){
        showToast("Adını düzgün gir");
        return;
    }

    if(!/^[a-zA-Z0-9_.-]{3,24}$/.test(username)){
        showToast("Kullanıcı adı 3-24 karakter olmalı");
        return;
    }

    if(password.length<6){
        showToast("Şifre en az 6 karakter olmalı");
        return;
    }

    if(password!==password2){
        showToast("Şifreler aynı değil");
        return;
    }

    if(!role){
        showToast("Rol seç");
        return;
    }

    if(users().some(x=>x.username.toLowerCase()===username.toLowerCase())){
        showToast("Bu kullanıcı adı zaten alınmış");
        return;
    }

    const user={
        id:uid("user"),
        name,
        username,
        password,
        role,
        plan:"free",
        avatarMediaId:null,
        profileBackgroundMediaId:null,
        shopBackgroundMediaId:null,
        bio:"",
        followers:[],
        following:[],
        blockedUsers:[],
        nameChanges:[],
        likedSongs:[],
        online:true,
        lastSeen:Date.now(),
        settings:{
            notifications:true,
            autoplay:false,
            privateProfile:false
        }
    };

    addUser(user);

    localStorage.setItem(KEYS.current,user.id);

    saveActivity("account","Hesap oluşturuldu");

    showApp();

    showToast("Hesabın oluşturuldu");
}

function loginUser(e){

    e.preventDefault();

    const username=document.getElementById("loginUsername").value.trim();
    const password=document.getElementById("loginPassword").value;

    const user=users().find(
        x=>x.username.toLowerCase()===username.toLowerCase()
        &&x.password===password
    );

    if(!user){
        showToast("Kullanıcı adı veya şifre yanlış");
        return;
    }

    user.online=true;
    user.lastSeen=Date.now();

    updateUser(user);

    localStorage.setItem(KEYS.current,user.id);

    showApp();
}

function logout(){

    const u=me();

    if(u){
        u.online=false;
        u.lastSeen=Date.now();
        updateUser(u);
    }

    localStorage.removeItem(KEYS.current);

    document.getElementById("app").classList.add("hidden");
    document.getElementById("authScreen").classList.remove("hidden");
}

async function renderHomeContent(){

    const box=document.getElementById("homeContent");
    if(!box)return;

    let list=[];

    posts().forEach(p=>{
        const u=getUser(p.userId);
        if(!u||isBlocked(u.id))return;

        if(state.feed==="following"&&!isFollowing(u.id))return;

        list.push({
            kind:"post",
            date:p.createdAt,
            data:p
        });
    });

    songs().forEach(s=>{
        const u=getUser(s.userId);
        if(!u||isBlocked(u.id))return;

        if(state.feed==="following"&&!isFollowing(u.id))return;

        list.push({
            kind:"song",
            date:s.createdAt,
            data:s
        });
    });

    if(state.feed==="new"){
        list.sort((a,b)=>b.date-a.date);
    }else{
        list.sort((a,b)=>b.date-a.date);
    }

    if(!list.length){
        box.innerHTML=`<div class="empty">Henüz içerik yok.</div>`;
        return;
    }

    let html="";

    for(const item of list){
        if(item.kind==="post"){
            html+=await postHTML(item.data);
        }else{
            html+=await songHTML(item.data);
        }
    }

    box.innerHTML=html;
}

function setFeed(feed){
    state.feed=feed;
    renderHome();
}

async function postHTML(post){

    const user=getUser(post.userId);
    if(!user)return "";

    const liked=(post.likes||[]).includes(me().id);

    const postComments=comments()
        .filter(x=>x.postId===post.id);

    let media="";

    if(post.mediaId){

        const url=await mediaURL(post.mediaId);

        if(post.mediaType?.startsWith("video")){
            media=`<video class="post-media" controls src="${url}"></video>`;
        }else{
            media=`<img class="post-media" src="${url}" alt="">`;
        }
    }

    return `
        <article class="post">

            <div class="post-head">
                ${avatar}

                <div class="flex1">
                    <div class="user-name">
                        ${esc(user.name)}
                    </div>

                    <div class="small muted">
                        @${esc(user.username)}
                        ·
                        ${esc(user.role)}
                    </div>
                </div>

                <button class="btn btn-small"
                        onclick="openChannel('${user.id}')">
                    Kanal
                </button>
            </div>

            ${post.text?`<div class="post-text">${esc(post.text)}</div>`:""}

            ${media}

            <div class="post-actions">

                <button class="btn btn-small"
                        onclick="togglePostLike('${post.id}')">
                    ${liked?"Beğenildi":"Beğen"}
                    ${post.likes?.length||0}
                </button>

                <button class="btn btn-small"
                        onclick="toggleComments('${post.id}')">
                    Yorum ${postComments.length}
                </button>

                <button class="btn btn-small"
                        onclick="sharePost('${post.id}')">
                    Paylaş
                </button>

                ${
                    post.userId===me().id
                    ?
                    `
                    <button class="btn btn-small"
                            onclick="editPost('${post.id}')">
                        Düzenle
                    </button>

                    <button class="btn btn-small btn-danger"
                            onclick="deletePost('${post.id}')">
                        Sil
                    </button>

                    <button class="btn btn-small"
                            onclick="archivePost('${post.id}')">
                        Arşivle
                    </button>
                    `
                    :""
                }

            </div>

            <div id="comments-${post.id}" class="comments hidden">

                ${postComments.map(c=>{
                    const cu=getUser(c.userId);

                    return `
                        <div class="comment">
                            <b>${esc(cu?.name||"Kullanıcı")}</b>
                            ${esc(c.text)}

                            ${
                                c.userId===me().id
                                ?
                                `<button class="btn btn-small"
                                onclick="deleteComment('${c.id}')">
                                Sil
                                </button>`
                                :""
                            }
                        </div>
                    `;
                }).join("")}

                <div class="comment-box">
                    <input id="comment-${post.id}"
                           placeholder="Yorum yaz...">

                    <button class="btn primary"
                            onclick="addComment('${post.id}')">
                        Gönder
                    </button>
                </div>

            </div>

        </article>
    `;
}

function toggleComments(id){
    document.getElementById("comments-"+id)?.classList.toggle("hidden");
}

function addComment(postId){

    const input=document.getElementById("comment-"+postId);
    const text=input.value.trim();

    if(!text)return;

    const list=comments();

    list.push({
        id:uid("comment"),
        postId,
        userId:me().id,
        text,
        createdAt:Date.now()
    });

    save(KEYS.comments,list);

    const post=posts().find(x=>x.id===postId);

    if(post&&post.userId!==me().id){
        notify(
            post.userId,
            "comment",
            me().name+" gönderine yorum yaptı."
        );
    }

    input.value="";
    render();
}

function deleteComment(id){

    const list=comments().filter(x=>x.id!==id);
    save(KEYS.comments,list);
    render();
}

function togglePostLike(id){

    const list=posts();
    const post=list.find(x=>x.id===id);

    if(!post)return;

    post.likes=post.likes||[];

    const i=post.likes.indexOf(me().id);

    if(i>=0){
        post.likes.splice(i,1);
    }else{
        post.likes.push(me().id);

        if(post.userId!==me().id){
            notify(
                post.userId,
                "like",
                me().name+" gönderini beğendi."
            );
        }
    }

    save(KEYS.posts,list);
    render();
}

function sharePost(id){

    const post=posts().find(x=>x.id===id);
    if(!post)return;

    saveActivity(
        "share",
        "Bir gönderiyi paylaştın."
    );

    showToast("Gönderi paylaşıldı");
}

function editPost(id){

    const post=posts().find(x=>x.id===id);
    if(!post||post.userId!==me().id)return;

    openModal(`
        <div class="modal-head">
            <h2>Gönderiyi Düzenle</h2>
            <button class="close" onclick="closeModal()">X</button>
        </div>

        <textarea id="editPostText">${esc(post.text||"")}</textarea>

        <br><br>

        <button class="btn primary"
                onclick="savePostEdit('${id}')">
            Kaydet
        </button>
    `);
}

function savePostEdit(id){

    const post=posts().find(x=>x.id===id);
    if(!post)return;

    post.text=document.getElementById("editPostText").value.trim();

    save(KEYS.posts,posts());

    closeModal();
    render();
}

function deletePost(id){

    if(!confirm("Gönderi silinsin mi?"))return;

    save(
        KEYS.posts,
        posts().filter(x=>x.id!==id)
    );

    save(
        KEYS.comments,
        comments().filter(x=>x.postId!==id)
    );

    render();
}

function archivePost(id){

    const post=posts().find(x=>x.id===id);

    const ar=archive();

    ar.unshift({
        id:uid("archive"),
        type:"post",
        itemId:id,
        userId:me().id,
        createdAt:Date.now()
    });

    save(KEYS.archive,ar);

    showToast("Gönderi arşive alındı");

    else r.likes.push(me().id);

/* =========================================================
   FOLLOW
========================================================= */

function toggleFollow(userId){

    const current=me();
    const target=getUser(userId);

    if(!current||!target)return;

    if(userId===current.id){
        showToast("Kendini takip edemezsin");
        return;
    }

    if(isBlocked(userId)){
        showToast("Engellenen kullanıcı");
        return;
    }

    current.following=current.following||[];
    target.followers=target.followers||[];

    const i=current.following.indexOf(userId);

    if(i>=0){

        current.following.splice(i,1);

        const fi=target.followers.indexOf(current.id);

        if(fi>=0){
            target.followers.splice(fi,1);
        }

        saveActivity(
            "unfollow",
            target.name+" takipten çıkarıldı."
        );

    }else{

        current.following.push(userId);

        if(!target.followers.includes(current.id)){
            target.followers.push(current.id);
        }

        notify(
            target.id,
            "follow",
            current.name+" seni takip etmeye başladı."
        );

        saveActivity(
            "follow",
            target.name+" takip edildi."
        );
    }

    updateUser(current);
    updateUser(target);

    render();
}

/* =========================================================
   BLOCK
========================================================= */

function toggleBlock(userId){

    const current=me();
    const target=getUser(userId);

    if(!target||target.id===current.id)return;

    current.blockedUsers=current.blockedUsers||[];

    const i=current.blockedUsers.indexOf(userId);

    if(i>=0){

        current.blockedUsers.splice(i,1);

        showToast("Engel kaldırıldı");

    }else{

        current.blockedUsers.push(userId);

        current.following=(current.following||[])
            .filter(x=>x!==userId);

        target.followers=(target.followers||[])
            .filter(x=>x!==current.id);

        target.following=(target.following||[])
            .filter(x=>x!==current.id);

        target.blockedUsers=target.blockedUsers||[];

        updateUser(target);

        showToast("Kullanıcı engellendi");
    }

    updateUser(current);

    render();
}

async function createShopItem(){

    const type=document.getElementById("shopType").value;
    const name=document.getElementById("shopName").value.trim();
    const description=document.getElementById("shopDescription").value.trim();
    const price=Number(document.getElementById("shopPrice").value);
    const file=document.getElementById("shopAudio").files[0];

    if(!name){
        showToast("Ürün adı zorunlu");
        return;
    }

    if(!Number.isFinite(price)||price<0){
        showToast("Geçerli bir fiyat gir");
        return;
    }

    if(!file){
        showToast("Ses dosyası seç");
        return;
    }

    if(!canUploadShop()){
        openProModal();
        return;
    }

    const mediaId=await putMedia(file);

    const list=shopItems();

    list.unshift({
        id:uid("shop"),
        userId:me().id,
        type,
        name,
        description,
        price,
        mediaId,
        createdAt:Date.now()
    });

    save(KEYS.shop,list);

    saveActivity(
        "shop",
        name+" Shop'a eklendi."
    );

    closeModal();
    render();
}

    const item=shopItems().find(x=>x.id===id);

    await playMedia(
        item.mediaId,
        item.name,
        getUser(item.userId)?.name||""

}

function deleteShopItem(id){

    const item=shopItems().find(x=>x.id===id);

    if(!item||item.userId!==me().id)return;

    if(!confirm("Shop ürünü silinsin mi?"))return;

    save(
        KEYS.shop,
        shopItems().filter(x=>x.id!==id)
    );

    render();
}

async function saveProfileSettings(){

    const u=me();

    const name=document.getElementById("profileName").value.trim();
    const username=document.getElementById("profileUsername").value.trim();
    const bio=document.getElementById("profileBio").value.trim();

    if(name.length<2){
        showToast("Geçerli bir isim gir");
        return;
    }

    if(!/^[a-zA-Z0-9_.-]{3,24}$/.test(username)){
        showToast("Kullanıcı adı geçersiz");
        return;
    }

    const duplicate=users().find(
        x=>x.id!==u.id &&
        x.username.toLowerCase()===username.toLowerCase()
    );

    if(duplicate){
        showToast("Bu kullanıcı adı alınmış");
        return;
    }

    const now=Date.now();
    const week=7*24*60*60*1000;

    u.nameChanges=(u.nameChanges||[])
        .filter(x=>now-x<week);

    const identityChanged=
        name!==u.name||
        username!==u.username;

    if(identityChanged){

        if(u.nameChanges.length>=3){
            showToast("7 gün içinde en fazla 3 isim/kullanıcı adı değişikliği");
            return;
        }

        u.nameChanges.push(now);
    }

    const avatar=document.getElementById("profileAvatar").files[0];

    if(avatar){
        u.avatarMediaId=await putMedia(avatar);
    }

    const background=document
        .getElementById("profileBackground")
        .files[0];

    if(background){
        u.profileBackgroundMediaId=
            await putMedia(background);
    }

    u.name=name;
    u.username=username;
    u.bio=bio;

    updateUser(u);

    closeModal();

    showToast("Profil güncellendi");

    render();
}

function openChat(userId){

    }

function renderMessages(){

    const u=me();

    const people=users()

    document.getElementById("main").innerHTML=`

                <input class="field"
                       placeholder="Konuşma ara..."
                       oninput="filterChats(this.value)">

                <div id="chatList"></div>

            </div>

            <div class="card">

                <div id="chatBox">
                    ${
                        state.chatUser
                        ?
                        "Mesajlar yükleniyor..."
                        :
                        `<div class="empty">
                            Mesajlaşmak için bir kişi seç.
                        </div>`
                    }
                </div>

    `;

    renderChatList(people);

    if(state.chatUser){

    }
}

async function renderChatList(people){

    const box=document.getElementById("chatList");

    if(!box)return;

    const all=messages();

    const used=[];

    for(const msg of all){

        const other=
            msg.fromId===me().id
            ?msg.toId
            :msg.fromId;

        if(
            !used.includes(other)&&
            !isBlocked(other)
        ){
            used.push(other);
        }
    }

    const ordered=[
        ...used,
        ...people.map(x=>x.id).filter(x=>!used.includes(x))
    ];

    let html="";

    for(const id of ordered){

        const user=getUser(id);

        if(!user)continue;

        const last=all
            .filter(x=>
                (x.fromId===me().id&&x.toId===id)||
                (x.fromId===id&&x.toId===me().id)
            )
            .sort((a,b)=>b.createdAt-a.createdAt)[0];

        html+=`
            <div class="person chat-person"
                 data-name="${esc(user.name.toLowerCase())}"
                 onclick="openChat('${user.id}')">

                ${await avatarHTML(user,"avatar small")}

                <div class="person-info">

                    <b>${esc(user.name)}</b>

                    <div class="small muted">
                        ${last?esc(last.text):"Yeni konuşma"}
                    </div>

                </div>

            </div>
        `;
    }

    box.innerHTML=html||`<div class="empty">Kişi yok.</div>`;
}

function filterChats(value){

    value=value.toLowerCase();

    document.querySelectorAll(".chat-person")
        .forEach(el=>{
            el.style.display=
                el.dataset.name.includes(value)
                ?"flex"
                :"none";
        });
}

async function renderChat(){

    const user=getUser(state.chatUser);
    const box=document.getElementById("chatBox");

    if(!user||!box)return;

    if(isBlocked(user.id)){
        box.innerHTML=`<div class="empty">Bu kullanıcı engelli.</div>`;
        return;
    }

    const list=messages()
        .filter(x=>
            (x.fromId===me().id&&x.toId===user.id)||
            (x.fromId===user.id&&x.toId===me().id)
        )
        .sort((a,b)=>a.createdAt-b.createdAt);

    list.forEach(x=>{
        if(x.toId===me().id){
            x.read=true;
        }
    });

    save(KEYS.messages,messages());

    let html=`
        <div class="row">

            ${await avatarHTML(user,"avatar")}

            <div>
                <b>${esc(user.name)}</b>
                <div class="small muted">
                    @${esc(user.username)}
                </div>
            </div>

        </div>

        <hr style="border-color:#222;margin:15px 0">

        <div style="max-height:430px;overflow:auto">
    `;

    for(const msg of list){

        const own=msg.fromId===me().id;

        html+=`
            <div style="
                display:flex;
                justify-content:${own?"flex-end":"flex-start"};
                margin-bottom:8px;
            ">

                <div style="
                    max-width:75%;
                    background:${own?"#6d28d9":"#202020"};
                    padding:10px 13px;
                    border-radius:12px;
                ">

                    ${esc(msg.text)}

                    <div class="small"
                         style="opacity:.6;margin-top:4px">
                        ${new Date(msg.createdAt).toLocaleTimeString("tr-TR",{
                            hour:"2-digit",
                            minute:"2-digit"
                        })}
                    </div>

                </div>

            </div>
        `;
    }

    html+=`
        </div>

        <div class="comment-box">

            <input id="messageInput"
                   placeholder="Mesaj yaz..."
                   onkeydown="messageEnter(event)">

            <button class="btn primary"
                    onclick="sendMessage()">
                Gönder
            </button>

        </div>
    `;

    box.innerHTML=html;
}

function messageEnter(e){

    if(e.key==="Enter"){
        e.preventDefault();
        sendMessage();
    }
}

function sendMessage(){

    const user=getUser(state.chatUser);

    if(!user)return;

    if(isBlocked(user.id)){
        showToast("Bu kullanıcıyla mesajlaşamazsın");
        return;
    }

    const input=document.getElementById("messageInput");
    const text=input.value.trim();

    if(!text)return;

    const list=messages();

    list.push({
        id:uid("message"),
        fromId:me().id,
        toId:user.id,
        text,
        read:false,
        createdAt:Date.now()
    });

    save(KEYS.messages,list);

    notify(
        user.id,
        "message",
        me().name+" sana mesaj gönderdi."
    );

    saveActivity(
        "message",
        user.name+" kişisine mesaj gönderdin."
    );

    input.value="";

    renderMessages();
}

            !isBlocked(u.id)&&

async function playSong(id){

    const song=songs().find(x=>x.id===id);

    if(!song)return;

    state.playerSong=id;

    state.queue=songs()
        .filter(x=>!isBlocked(x.userId));

    state.queueIndex=
        Math.max(
            0,
            state.queue.findIndex(x=>x.id===id)
        );

    await playMedia(
        song.mediaId,
        song.name,
        getUser(song.userId)?.name||""
    );

    song.plays=(song.plays||0)+1;

    save(KEYS.songs,songs());
}

async function playMedia(mediaId,title,artist){

    const url=await mediaURL(mediaId);

    if(!url){
        showToast("Ses dosyası bulunamadı");
        return;
    }

    audio.src=url;

    document.getElementById("playerTitle").textContent=title;
    document.getElementById("playerArtist").textContent=artist;

    document.getElementById("player").classList.remove("hidden");

    await audio.play().catch(()=>{});

    document.querySelector("#player button:nth-child(2)")
        .textContent="Duraklat";
}

function togglePlayer(){

    if(audio.paused){

        audio.play();

        document.querySelector("#player button:nth-child(2)")
            .textContent="Duraklat";

    }else{

        audio.pause();

        document.querySelector("#player button:nth-child(2)")
            .textContent="Oynat";
    }
}

async function nextSong(){

    if(!state.queue.length)return;

    state.queueIndex=
        (state.queueIndex+1)%state.queue.length;

    const s=state.queue[state.queueIndex];

    state.playerSong=s.id;

    await playMedia(
        s.mediaId,
        s.name,
        getUser(s.userId)?.name||""
    );
}

async function previousSong(){

    if(!state.queue.length)return;

    state.queueIndex=
        (state.queueIndex-1+state.queue.length)
        %state.queue.length;

    const s=state.queue[state.queueIndex];

    state.playerSong=s.id;

    await playMedia(
        s.mediaId,
        s.name,
        getUser(s.userId)?.name||""
    );
}

function seekPlayer(value){

    if(!audio.duration)return;

    audio.currentTime=
        audio.duration*(Number(value)/100);
}

audio.addEventListener("timeupdate",()=>{

    const p=document.getElementById("playerProgress");

    if(!p||!audio.duration)return;

    p.value=(audio.currentTime/audio.duration)*100;
});

audio.addEventListener("ended",()=>{

    if(me()?.settings?.autoplay){
        nextSong();
    }else{
        document.querySelector("#player button:nth-child(2)")
            .textContent="Oynat";
    }
});

/* =========================================================
   MODAL
========================================================= */

function openModal(html){

    document.getElementById("modalBox").innerHTML=html;

    document.getElementById("modal")
        .classList.remove("hidden");
}

function closeModal(){

    document.getElementById("modal")
        .classList.add("hidden");

    document.getElementById("modalBox")
        .innerHTML="";
}

function modalOutside(e){

    if(e.target.id==="modal"){
        closeModal();
    }
}

/* =========================================================
   COUNTS
========================================================= */

function updateCounts(){

    const n=unreadNotifications();
    const m=unreadMessages();

    const nb=document.getElementById("notificationCount");
    const mb=document.getElementById("messageCount");

    if(n){
        nb.textContent=n;
        nb.classList.remove("hidden");
    }else{
        nb.classList.add("hidden");
    }

    if(m){
        mb.textContent=m;
        mb.classList.remove("hidden");
    }else{
        mb.classList.add("hidden");
    }
}

/* =========================================================
   DATA EXPORT / RESET
========================================================= */

function exportData(){

    const data={
        users:users(),
        posts:posts(),
        songs:songs(),
        reels:reels(),
        shop:shopItems(),
        comments:comments(),
        messages:messages(),
        activity:activities(),
        notifications:notifications(),
        archive:archive()
    };

    const blob=new Blob(
        [JSON.stringify(data,null,2)],
        {type:"application/json"}
    );

    const url=URL.createObjectURL(blob);

    const a=document.createElement("a");

    a.href=url;
    a.download="mym-sound-data.json";
    a.click();

    URL.revokeObjectURL(url);
}

function resetData(){

    if(!confirm(
        "Tüm MYM SOUND demo verileri silinsin mi?"
    ))return;

    Object.values(KEYS).forEach(key=>{
        if(key!==KEYS.current){
            localStorage.removeItem(key);
        }
    });

    localStorage.removeItem(KEYS.current);

    location.reload();
}

/* =========================================================
   START
========================================================= */

async function start(){

    try{
        await openDB();
    }catch(e){
        console.error(e);
        showToast("Medya sistemi başlatılamadı");
    }

    const current=getCurrentUser();

    if(current){

        current.online=true;
        current.lastSeen=Date.now();

        updateUser(current);

        showApp();

    }else{

        document.getElementById("authScreen")
            .classList.remove("hidden");

        document.getElementById("app")
            .classList.add("hidden");
    }
}

window.addEventListener("beforeunload",()=>{

    const u=me();

    if(u){
        u.online=false;
        u.lastSeen=Date.now();
        updateUser(u);
    }
});

start();
</script>
